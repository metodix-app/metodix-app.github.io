<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metodix</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icono-512.png">
<meta name="theme-color" content="#7B1E30">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Plan: mismo mundo visual del club (azul marino, dorado, plata) en claro fijo.
   Layout: banda metálica arriba, selector de rol, columna central que pasa a dos en iPad horizontal. */
:root{
  --navy:#0E1B3D; --gold:#C9A227; --gold-deep:#9C7A12;
  --bg:#E7E9ED; --surface:#F8F9FB; --ink:#0E1B3D; --muted:#4A5676; --line:#C2C7D0; --seg:#D2D6DD; --silver-soft:#ECEEF2;
  --metal:linear-gradient(180deg,#F2F4F6 0%,#CBD0D7 100%);
  --ok:#2E6B3A; --ok-soft:#DDEBDF; --amber:#A86A06; --amber-soft:#F6EBD2; --red:#B3261E; --red-soft:#F7DEDB;
  --pitch:#3E7A4D; --pitch-line:rgba(255,255,255,.85);
  --display:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.inner{max-width:1040px;margin:0 auto;padding:0 16px}
.band{background:var(--metal);border-bottom:4px solid var(--gold)}
.band .inner{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px;padding-bottom:12px}
.band h1{font:700 30px/1 var(--display);text-wrap:balance}
.band h1 small{display:block;font:600 15px/1.2 var(--display);color:var(--gold-deep);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.band .club{font:600 17px/1 var(--display)}
.roles{background:var(--surface);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font:600 17px/1 var(--display);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.chip.coord[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
main{padding-bottom:110px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 10px;border-bottom:2px solid var(--gold);padding-bottom:6px;flex-wrap:wrap}
.section-h h2{font:700 24px/1.05 var(--display)}
.section-h span{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--gold);background:var(--gold);color:var(--navy);font:600 18px/1 var(--display)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.small{min-height:40px;padding:8px 12px;font-size:16px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:16px}
.weeknav b{flex:1;text-align:center;font:700 21px/1.1 var(--display)}
.note{font-size:14.5px;color:var(--muted);margin:8px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.item{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.date{background:var(--navy);color:#fff;border-radius:9px;min-width:62px;padding:6px 6px 5px;text-align:center;font:700 26px/1 var(--display)}
.date small{display:block;font:600 13px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.iname{display:block;font:600 20px/1.15 var(--display)}
.isub{display:block;font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-flex;align-items:center;font:600 13.5px/1 var(--display);border-radius:7px;padding:6px 9px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:var(--silver-soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.mid{background:var(--amber-soft);color:var(--amber)}.pill.bad{background:var(--red-soft);color:var(--red)}.pill.gold{background:#F3E7BE;color:var(--gold-deep)}
.subbar{position:sticky;top:0;z-index:5;background:var(--metal);border-bottom:4px solid var(--gold)}
.subbar .inner{display:flex;align-items:center;gap:8px;padding-top:6px;padding-bottom:6px}
.subbar button{background:none;border:0;font:600 18px/1 var(--display);padding:12px 8px;border-radius:8px}
.subbar .ttl{font:700 21px/1 var(--display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead{display:grid;gap:6px;margin-top:14px}
.shead h2{font:700 28px/1.05 var(--display)}
.shead h2::first-letter{text-transform:uppercase}
.banner{background:var(--surface);border-left:4px solid var(--gold);padding:10px 14px;margin:12px 0 0;font-size:14.5px;border-radius:0 8px 8px 0}
.tasks{display:grid;gap:14px;margin-top:14px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.task.ok{border-color:var(--ok)}.task.mod{border-color:var(--gold)}
.thead{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--silver-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tnum{background:var(--gold);color:var(--navy);border-radius:9px;min-width:40px;height:40px;display:grid;place-items:center;font:700 22px/1 var(--display)}
.tslot{font:600 13px/1 var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--gold-deep)}
.tname{font:700 21px/1.1 var(--display)}
.tbody{display:grid;gap:14px;padding:14px}
@media (min-width:760px){.tbody{grid-template-columns:minmax(260px,1fr) 1.15fr;align-items:start}}
.diag{background:#2F5E3B;border-radius:10px;padding:8px}
.diag svg{display:block;width:100%;height:auto;max-height:360px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:12.5px;color:#E6EEE8}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%}
.legend i.l{width:18px;height:0;border-radius:0;border-top:2px solid #fff}
.legend i.ld{width:18px;height:0;border-radius:0;border-top:2px dashed #fff}
.legend i.lc{width:18px;height:0;border-radius:0;border-top:2px dotted #F2C14E}
.tdesc{display:grid;gap:8px;font-size:15px}
.tdesc b{display:block;font:600 13px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tactions{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.edit{display:grid;gap:10px}
.field label{display:block;font:600 15px/1.2 var(--display);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;min-height:44px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.alts{display:grid;gap:10px;padding:0 14px 14px}
@media (min-width:640px){.alts{grid-template-columns:1fr 1fr}}
.alt{display:grid;gap:6px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px}
.alt .diag{padding:4px}
.asis summary,.card>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.asis{margin-top:12px}
.asum{font:600 15px/1.2 var(--display);color:var(--ink)}
.asgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.asb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line,#ccd);border-radius:10px;padding:8px 10px;background:#fff;min-height:48px}
.asb select{width:100%;min-height:40px;margin-top:4px;border:1px solid var(--line,#ccd);border-radius:8px;padding:4px 8px;background:#fff;font:inherit}
.prog{margin:0 0 6px;padding-left:18px}.prog li{margin:2px 0}.prog span{font-weight:600}
.asb small{font:600 12px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:#2E7D46}
.asb.f{background:#FBEBEB;border-color:#B3261E}.asb.f small{color:#B3261E}.asb.f span{text-decoration:line-through}
.asb.j{background:#F9EEDA;border-color:#C9A227}.asb.j small{color:#8A6D0B}.asb.j span{text-decoration:line-through}
.ck{display:flex;align-items:center;gap:6px;min-height:44px}
.plan{border-top:1px dashed var(--line,#ccd);padding-top:8px;margin-top:4px}
.plan summary{cursor:pointer;font:600 15px/1.2 var(--display);color:var(--ink);padding:6px 0}
.grps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 10px}
.grp{background:#F3F4F7;border-radius:8px;padding:8px;font-size:14px;line-height:1.35}
.grp b{display:block;font:600 14px/1.2 var(--display);margin-bottom:4px}
.rl{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.rl li{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line,#ccd);padding:6px 0}

.diag.ext{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:#F3F4F7;border:1px dashed var(--line,#ccd);border-radius:10px;padding:12px;color:var(--muted,#4A5676);font-size:14px}
.alt .diag.ext{padding:8px;font-size:12px}
.diag.img{background:#fff;padding:0;overflow:hidden;border:1px solid var(--line,#dde)}
.diag.img img{display:block;width:100%;height:auto;max-height:360px;object-fit:contain}
.alt .diag.img img{max-height:170px}
.alt .diag svg{max-height:170px}
.alt b{font:700 17px/1.1 var(--display)}
.alt small{color:var(--muted);font-size:13px}
.val{display:grid;gap:8px;padding:12px 14px;border-top:1px dashed var(--line);background:#FBFBFC}
.vbtns{display:flex;gap:6px;flex-wrap:wrap}
.vbtn{min-width:48px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 22px/1 var(--display)}
.vbtn[aria-pressed="true"]{background:var(--gold);border-color:var(--navy)}
.vbtn.lo[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.footbar .inner{display:flex;gap:10px;align-items:center}
.footbar .btn{flex:1}
.footbar .st{font-size:14px;color:var(--muted);flex:1}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{font:600 14px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;background:var(--metal)}
td.n{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td{background:var(--silver-soft)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;font:600 15px/1 var(--display);background:#fff}
.days input{accent-color:var(--gold);width:18px;height:18px}
.grid2{display:grid;gap:12px;margin-top:12px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.bank{display:grid;gap:12px;margin-top:12px}
@media (min-width:640px){.bank{grid-template-columns:1fr 1fr}}
@media (min-width:980px){.bank{grid-template-columns:1fr 1fr 1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--surface);border:2px solid var(--gold);box-shadow:0 6px 18px rgba(14,27,61,.18);padding:10px 16px;border-radius:10px;font-size:15px;max-width:88vw;z-index:50}
.toast:empty{display:none}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;margin:14px 0;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:600 21px/1.2 var(--display);margin-bottom:4px}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Tema Metodix: neutros + verde + celeste, manteniendo marino y dorado como acentos ===== */
:root{
  --green:#2F8A5B; --green-deep:#1F6B44; --green-soft:#E2F2E9;
  --sky:#4BA3D3; --sky-deep:#2A7FAE; --sky-soft:#E3F2FA;
  --bg:#EFF4F2; --surface:#FFFFFF; --muted:#566579; --line:#D5E0DC; --seg:#DCE6E2; --silver-soft:#F2F7F5;
  --metal:linear-gradient(115deg,#E3F2FA 0%,#EAF5EF 55%,#F4F8F6 100%);
  --ok:#2F8A5B; --ok-soft:#E2F2E9;
  --shadow:0 1px 2px rgba(14,27,61,.05),0 4px 14px rgba(14,27,61,.06);
}
body{background:linear-gradient(180deg,#F4F8F6 0%,var(--bg) 320px)}
:focus-visible{outline-color:var(--sky)}
.band{border-bottom:0;box-shadow:inset 0 -4px 0 0 transparent;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--green) 0%,var(--sky) 60%,var(--gold) 100%)}
.band h1 small{color:var(--green-deep)}
.roles{background:rgba(255,255,255,.75);backdrop-filter:blur(6px)}
.chip{background:#fff;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--sky);color:var(--sky-deep)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 8px rgba(47,138,91,.25)}
.section-h{border-bottom:0;position:relative}
.section-h::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--sky) 55%,rgba(75,163,211,0))}
.btn{background:var(--green);border-color:var(--green);color:#fff;transition:filter .15s,box-shadow .15s}
.btn:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 2px 8px rgba(47,138,91,.22)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover:not(:disabled){border-color:var(--sky);box-shadow:none;filter:none}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn:disabled{background:#A9B6B1;border-color:#A9B6B1;color:#fff;opacity:1}
.card,.item,.task,.empty,.scroll{border-color:var(--line);box-shadow:var(--shadow)}
.item{transition:border-color .15s,transform .15s}
.item:hover{border-color:var(--sky);transform:translateY(-1px)}
.date{background:linear-gradient(160deg,var(--navy) 0%,#1D3A66 100%)}
.date small{color:#9AD3F0}
.pill{background:var(--silver-soft)}
.pill.gold{background:#F6EDCC}
.subbar{border-bottom:0;box-shadow:0 2px 10px rgba(14,27,61,.06)}
.subbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--green) 0%,var(--sky) 60%,var(--gold) 100%)}
.subbar button:hover{background:rgba(75,163,211,.12)}
.banner{background:var(--sky-soft);border-left-color:var(--sky)}
.task.ok{border-color:var(--green)}
.thead{background:linear-gradient(90deg,var(--sky-soft) 0%,#F2F8F5 100%)}
.tslot{color:var(--sky-deep)}
.diag{background:#2E6E4C}
.alt{border-color:var(--line)}
.alt:hover{border-color:var(--sky)}
.val{background:#F6FAF8}
.vbtn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.footbar{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);box-shadow:0 -2px 12px rgba(14,27,61,.06)}
th{background:linear-gradient(180deg,var(--sky-soft),#EAF4F8)}
.days input{accent-color:var(--green)}
.grp{background:var(--sky-soft)}
.toast{border-color:var(--green)}
.asb small{color:var(--green)}

/* ===== Temas: Metodix (general) y colores de cada club ===== */
:root{ --stripe:linear-gradient(90deg,var(--green) 0%,var(--sky) 60%,var(--gold) 100%); --on-green:#fff; }
.band::after,.subbar::after{background:var(--stripe)}
.btn{color:var(--on-green)}
.chip[aria-pressed="true"]{color:var(--on-green)}
.vbtn[aria-pressed="true"]{color:var(--on-green)}
.band h1 small{color:var(--green-deep)}
body.brand{background:linear-gradient(180deg,#F6F8FB 0%,#EEF2F7 100%)}
body.brand .band{background:linear-gradient(115deg,#EAF5FC 0%,#FFFBEA 55%,#F8EEF0 100%)}
body.brand .band h1{font-size:34px;letter-spacing:.01em}
body.brand .band h1 .mx-a{color:#2B86C2} body.brand .band h1 .mx-b{color:var(--green)}
body.brand .banner{background:#F3F6FB;border-left-color:var(--sky)}
.brand-foot{margin:18px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.brand-flag{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:0 0 16px}
.brand-flag i{flex:1}
.band .inner{align-items:center}
/* Evaluación individual */
.ev .plist{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
.ev .prow{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto 50px;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ev .pnum{font:700 24px/1 var(--display);color:var(--navy);background:var(--gold);border-radius:9px;height:44px;display:grid;place-items:center}
.ev .pname{display:block;font:600 19px/1.15 var(--display)}
.ev .psub{display:block;font-size:13.5px;color:var(--muted)}
.ev .pbars{display:flex;align-items:flex-end;gap:3px;height:30px}
.ev .pbars i{display:block;width:6px;border-radius:2px 2px 0 0;background:var(--gold);min-height:2px}
.ev .pbars i.nil{background:var(--seg);height:2px}
.ev .pavg{font:700 24px/1 var(--display);text-align:right}
@media (max-width:420px){.ev .prow{grid-template-columns:40px minmax(0,1fr) 46px}.ev .pbars{display:none}}
.evgrid{display:grid;gap:16px;margin-top:16px}
@media (min-width:860px){.evgrid{grid-template-columns:380px minmax(0,1fr);align-items:start}}
.ev .cromo{background:var(--metal);border-radius:18px;padding:20px 18px 12px;border:1px solid var(--line);border-bottom:5px solid var(--gold)}
.ev .cromo-top{display:flex;align-items:flex-end;gap:14px}
.ev .dorsal{font:700 84px/.78 var(--display);color:var(--navy)}
.ev .cromo-id{flex:1;min-width:0}
.ev .cromo-id h2{font:700 29px/1 var(--display);text-transform:uppercase;overflow-wrap:break-word}
.ev .cromo-id p{font-size:14.5px;color:var(--muted);margin-top:5px}
.ev .media{flex:none;background:var(--gold);color:var(--navy);border-radius:12px;padding:8px 10px 6px;text-align:center;min-width:70px}
.ev .media b{display:block;font:700 40px/.95 var(--display)}
.ev .media span{font:600 13px/1 var(--display)}
.ev .radar{display:block;width:100%;height:auto;margin-top:8px;font-family:var(--display)}
.ev .legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);padding-bottom:6px}
.ev .legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--gold);vertical-align:middle;margin-right:6px}
.ev .legend i.prev{border-top:2px dashed var(--navy)}
.ev .evh{font:700 21px/1.1 var(--display);margin-bottom:6px}
.ev .abar{display:grid;grid-template-columns:96px minmax(0,1fr) 40px 44px;align-items:center;gap:10px;padding:6px 0}
.ev .abar .nm{font:600 16.5px/1.1 var(--display)}
.ev .track{height:12px;border-radius:6px;background:var(--seg);overflow:hidden;display:block}
.ev .track i{display:block;height:100%;background:var(--gold);border-radius:6px}
.ev .abar .v{font:700 20px/1 var(--display);text-align:right}
.ev .abar .d{font-size:13px;color:var(--muted);text-align:right}
.ev details.evd{border-top:1px solid var(--line)}
.ev details.evd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font:600 17.5px/1 var(--display);cursor:pointer}
.ev details.evd summary::-webkit-details-marker{display:none}
.ev details.evd summary span{color:var(--muted);font-weight:500}
.ev .asprow{display:grid;grid-template-columns:minmax(0,1fr) 84px 34px;align-items:center;gap:10px;padding:5px 0;font-size:14.5px}
.ev .asprow .track{height:8px}
.ev .asprow b{font:700 17px/1 var(--display);text-align:right}
.ev .obs p{margin-bottom:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.ev .obs b{display:block;font:600 16px/1.2 var(--display);color:var(--muted)}
.ev .hist{list-style:none;margin:0;padding:0}
.ev .hist li{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:6px 0}
.ev .hist li:first-child{border-top:0}
.ev .hist .sel{flex:1;text-align:left;background:none;border:0;padding:10px 0;font-size:15.5px}
.ev .hist .sel[aria-current="true"]{font-weight:700}
.ev .hist .hv{font:700 20px/1 var(--display)}
.ev .linkbtn{background:none;border:0;padding:10px 6px;font:600 15.5px/1 var(--display);color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.ev .linkbtn.danger{color:var(--red)}
.ev .area{margin-top:22px}
.ev .area-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:6px}
.ev .area-head h3{font:700 24px/1 var(--display)}
.ev .area-head span{font:700 22px/1 var(--display)}
.ev .asp{padding:10px 0 12px;border-bottom:1px solid var(--line)}
.ev .asp-head{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.ev .asp-name{font-weight:500;font-size:15.5px;flex:1;min-width:0}
.ev .na{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:600 14px/1 var(--display);color:var(--muted)}
.ev .na[aria-pressed="true"]{background:var(--seg);border-color:var(--navy);color:var(--ink)}
.ev .asp-val{font:700 20px/1 var(--display);min-width:34px;text-align:right}
.ev .segs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:2px}
.ev .seg{height:44px;padding:0;border:0;border-radius:5px;background:var(--seg);color:var(--muted);font:600 15px/1 var(--display)}
.ev .seg.on{background:var(--gold);color:var(--navy)}
.ev .seg.cur{box-shadow:inset 0 0 0 2px var(--navy)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.ev .evt table{min-width:440px}
.ev .evt th,.ev .evt td{text-align:center;padding:9px 4px}
.ev .evt th:first-child,.ev .evt td:first-child{text-align:left;padding-left:12px}
.ev .evt td{font:600 17px/1 var(--display)}
.ev .evt td:first-child{font:500 15px/1.2 var(--body)}
.ev .evt td:first-child small{color:var(--muted);font:700 15px/1 var(--display);margin-right:6px}
.ev .evt tbody td:last-child,.ev .evt tfoot td:last-child{background:rgba(201,162,39,.3)}
.ev .evt tfoot td{border-top:2px solid var(--gold);background:var(--seg)}
.paste summary{list-style:none;cursor:pointer}
.paste summary::-webkit-details-marker{display:none}

il (amarillo izquierda, naranja derecha). Cada repetición se cambia de perfil. A la mitad del tiempo, iniciará la acción el jugador amarillo para finalizar con la pierna izquerda. Variante: al primer toque (acercarse para no perder precisión).","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/cal25.jpg","src":"Tareas de calentamiento","cat":"Alevín y menores","ser":"1 serie de 10′","dur":10,"fic":{"cx":"Baja","es":"Rueda de Pases","di":"ADM","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Mando directo"},"org":"parejas","pr":"pm","prs":["pm","pf"]},{"id":"cal26","s":"rue","e":["per","ren"],"n":"Rondo 3x0","o":"Mejorar la técnica de pase y control y ofrecer líneas de pase.","g":"Cada equipo tiene un balón y debe realzar pases entre ellos, sin chocarse con los otros jugadores o balones. Dar pase y buscar línea de pase. Antes de recibir, mirar dónde están los compañeros para hacer control orientado y jugar con velocidad. Primero seguir siempre el mismo orden de pase. Después libre y se puede jugar a un toque.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/cal26.jpg","src":"Tareas de calentamiento","cat":"Infantil y mayores","ser":"4 series de 2′","dur":11,"fic":{"cx":"Media","es":"Rondo","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"grupos de 9","pr":"pm","prs":["pm","pf"]},{"id":"cal27","s":"rue","e":["des","per","ren"],"n":"Rondo 3x1","o":"Mejorar la técnica de pase y control y ofrecer líneas de pase.","g":"Jugar un 3x1 de tal forma que el lado opuesto al balón siempre esté libre, dando apoyo en los lados contiguos. Si hay robo, cambio de rol con el que ha perdido el balón.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/cal27.jpg","src":"Tareas de calentamiento","cat":"Alevín y mayores","ser":"1 serie de 10′","dur":10,"fic":{"cx":"Media","es":"Rondo","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"grupos de 4","pr":"pm","prs":["pm","pa","ap","rp"]},{"id":"cal28","s":"rue","e":["per","ren"],"n":"Rondo 4x2 + transición","o":"Mejorar la técnica de pase y control y dar apoyos al poseedor.","g":"Jugar un 4x2 en uno de los rectángulos. Si los defensores recuperan el balón, tienen que dar pase a los compañeros que están en el otro espacio para jugar allí otro 4x2. Jugar a 2 toques. Los defensores van rotando.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/cal28.jpg","src":"Tareas de calentamiento","cat":"Cadete y mayores","ser":"4 series de 3′","dur":15,"fic":{"cx":"Media","es":"Rondo","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"grupos de 8","pr":"rp","prs":["pm","pa","rp"]},{"id":"cal29","s":"act","e":["des","per","ren"],"n":"Triángulo de pases","o":"Mejorar la técnica de pase y control y perfilarse correctamente.","g":"El jugador verde recibe el balón y realiza un control orientado hacia el compañero que no tiene balón y le pasa el balón. Inmediatamente, va a recibir del otro jugador y pasará al que no tenga balón y así sucesivamente. Debe evitar tirar el cono del centro, dando apoyos dentro del triángulo. Cada serie van rotando los roles.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/cal29.jpg","src":"Tareas de calentamiento","cat":"Alevín y mayores","ser":"8 series de 1′","dur":15,"fic":{"cx":"Baja","es":"Rueda de Pases","di":"ADM","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Mando directo"},"org":"grupos de 4","pr":"pf","prs":["pm","pf","pa","ap"]},{"id":"cal30","s":"rue","e":["per","ren"],"n":"Rondo por cuadrantes","o":"Mejorar la técnica de pase y control y ofrecer líneas de pase.","g":"Se juega un 5x4 con la particularidad que cada defensor tiene asignada una zona donde puede interceptar el pase. El comodín, que juega por dentro, se puede mover por todo el espacio. No se puede jugar dos veces seguidas con el mismo jugador. Jugar como máximo a 2 toques. Cada serie rotan los roles.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/cal30.jpg","src":"Tareas de calentamiento","cat":"Infantil y mayores","ser":"4 series de 2′","dur":11,"fic":{"cx":"Media","es":"Rondo","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"grupos de 9","pr":"pm","prs":["pm"]},{"id":"cal31","s":"rue","e":["per","ren"],"n":"Rondos móviles","o":"Mejorar la técnica de pase y control y ofrecer líneas de pase.","g":"Se juega a 1 toque. El que pierde el balón va rápidamente al siguiente rondo según las flechas. Si aún esta el otro defensor, éste se irá al siguiente.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/cal31.jpg","src":"Tareas de calentamiento","cat":"Infantil y mayores","ser":"1 series de 10′","dur":10,"fic":{"cx":"Media","es":"Rondo","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"grupos de 6","pr":"pm","prs":["pm"]},{"id":"cal32","s":"rue","e":["per","ren"],"n":"Rondo 4x1","o":"Mejorar la técnica de pase y control y ofrecer líneas de pase.","g":"Se juega a 1 toque (salvo en la última norma). Distintos tipos de rondos. Una serie con cada norma.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/cal32.jpg","src":"Tareas de calentamiento","cat":"Infantil y mayores","ser":"3 series de 4′","dur":14,"fic":{"cx":"Media","es":"Rondo","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"grupos de 5","pr":"pm","prs":["pm"]},{"id":"cal33","s":"rue","e":["ren"],"n":"Rondo 5x1","o":"Mejorar la técnica de pase y control y ofrecer líneas de pase.","g":"Distintos tipos de rondos. Una serie con cada norma.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/cal33.jpg","src":"Tareas de calentamiento","cat":"Juvenil y mayores","ser":"3 series de 4′","dur":14,"fic":{"cx":"Media","es":"Rondo","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"grupos de 6","pr":"pm","prs":["pm"]},{"id":"cal34","s":"rue","e":["per","ren"],"n":"Rondo por parejas","o":"Mejorar la técnica de pase y control y ofrecer líneas de pase.","g":"Se juega a 2 toques. Se asignan parejas. Si uno de la pareja pierde el balón, los dos pasan a ser los defensores.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/cal34.jpg","src":"Tareas de calentamiento","cat":"Cadete y mayores","ser":"1 series de 10′","dur":10,"fic":{"cx":"Media","es":"Rondo","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"grupos de 8","pr":"pm","prs":["pm"]},{"id":"cal35","s":"act","e":["per","ren"],"n":"Juegos habilidad","o":"Mejorar la técnica de pase y control.","g":"Distintos juegos de habilidad por equipos. Adaptar según el número de jugadores. Fútbol-tenis golf-pie beisbol-pie baloncesto-pie pase mano-gol cabeza relevos de habilidad","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/cal35.jpg","src":"Tareas de calentamiento","cat":"Cadete y mayores","ser":"1 serie de 15′","dur":15,"fic":{"cx":"Baja","es":"Juego","di":"ADM","si":"Intersectorial","co":"Coordinación Equipo","en":"Descubrimiento guiado"},"org":"equipos de 5","pr":"pm","prs":["pm"]},{"id":"cal36","s":"act","e":["per","ren"],"n":"1x1 analítico","o":"Atacar y defender el 1x1.","g":"Realizar habilidad por parejas (5'). Cada pareja dentro de su espacio realizará los ejercicios de 1x1 especificados.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/cal36.j rtería. En cada serie actúa un equipo de comodín.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/pos04.jpg","src":"Tareas de juegos de posesión","cat":"Alevín y mayores","ser":"3 series de 6′","dur":20,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"3 equipos","pr":"ap","prs":["pm","pf","sb","ap"]},{"id":"pos05","s":"pri","e":["ren"],"n":"Juego de posición grande","o":"Reaccionar en las transiciones.","g":"Se juega un 7x7 + 3 comodines. Cada jugador tiene una posición asignada que ocupará cuando su equipo tenga la posesión del balón. Las transiciones deben ser inmediatas.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/pos05.jpg","src":"Tareas de juegos de posesión","cat":"Juvenil y mayores","ser":"3 series de 6′","dur":20,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"1 grupo","pr":"rp","prs":["pm","rp"]},{"id":"pos06","s":"pri","e":["ren"],"n":"Juego de posición mediano 1","o":"Reaccionar en las transiciones.","g":"Se juega un 4x4 + 3 comodines. Cada jugador tiene una posición asignada que ocupará cuando su equipo tenga la posesión del balón. Las transiciones deben ser inmediatas.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/pos06.jpg","src":"Tareas de juegos de posesión","cat":"Juvenil y mayores","ser":"4 series de 4′","dur":19,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Resolución de problemas"},"org":"2 grupos","pr":"rp","prs":["pm","rp"]},{"id":"pos07","s":"pri","e":["ren"],"n":"Juego de posición mediano 2","o":"Reaccionar en las transiciones.","g":"
