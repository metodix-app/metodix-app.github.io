mpo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/pos12.jpg","src":"Tareas de juegos de posesión","cat":"Cadete y mayores","ser":"4 series de 5′","dur":23,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"4 equipos","pr":"ap","prs":["pm","ap"]},{"id":"pos13","s":"pri","e":["des","per","ren"],"n":"Posesión 3 equipos","o":"Ocupar el campo con amplitud.","g":"Se juega un 5x5 + 5 comodines. Los comodines sólo pueden jugar al primer toque, el resto a dos. Cada serie se rotan los comodines.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/pos13.jpg","src":"Tareas de juegos de posesión","cat":"Alevín y mayores","ser":"3 series de 6′","dur":20,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"3 equipos","pr":"ap","prs":["pm","ap"]},{"id":"pos14","s":"pri","e":["per","ren"],"n":"Cuadrantes fijos","o":"Ofrecer líneas de pase.","g":"Se juega un 4x4 + 2 comodines. Cada jugador tiene asignado un cuadrante, tanto en ataque como en defensa. Si los defensores recuperan el balón, se devuelve a los atacantes. Rotar los roles en cada serie.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/pos14.jpg","src":"Tareas de juegos de posesión","cat":"Infantil y mayores","ser":"8 series de 2′","dur":23,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Resolución de problemas"},"org":"2 grupos de 8","pr":"pm","prs":["pm"]},{"id":"pos15","s":"pri","e":["ren"],"n":"Posesión de resistencia","o":"Mejorar la resistencia específica.","g":"Cada serie consta de: 2' de 2x2 + 6' de 8x8 + 2' de 2x2 los comodines del 8x8 son los porteros, que realizarán un trabajo específico durante el 2x2. El resto de jugadores ya están emparejados para jugar el 2x2. Los cambios de ejercicios deben ser rápidos.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/pos15.jpg","src":"Tareas de juegos de posesión","cat":"Juvenil y mayores","ser":"2 series de 8′","dur":17,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"1 grupo","pr":"pm","prs":["pm","ap"]},{"id":"pos16","s":"pri","e":["per","ren"],"n":"Presión defensiva 1","o":"Presionar tras la pérdida.","g":"Se juega un 6x3 dentro del espacio delimitado. El equipo que pierda la posesión del balón defiende. Las transiciones deben ser inmediatas.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/pos16.jpg","src":"Tareas de juegos de posesión","cat":"Infantil y mayores","ser":"3 series de 4′","dur":14,"fic":{"cx":"Alta","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Mando directo"},"org":"2 grupos de 9","pr":"rp","prs":["pm","rp"]},{"id":"pos17","s":"pri","e":["per","ren"],"n":"Presión defensiva 2","o":"Presionar tras la pérdida.","g":"Se juega un 3x3 + 2 comodines dentro del espacio delimitado. Las transiciones deben ser inmediatas. Variante: los comodines se colocan en lados opuestos del espacio.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/pos17.jpg","src":"Tareas de juegos de posesión","cat":"Infantil y mayores","ser":"3 series de 4′","dur":14,"fic":{"cx":"Alta","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Mando directo"},"org":"2 grupos de 8","pr":"rp","prs":["rp"]},{"id":"pos18","s":"pri","e":["per","ren"],"n":"Rondo de presión","o":"Presionar tras la pérdida.","g":"Se juega un 4x3 en la mitad del espacio delimitado. Si los azules consiguen dar 5 pases seguidos, pasan el balón a los amarillos y los naranjas pasan a defender allí. Cuando el equipo naranja recupere, pasa el balón al otro lado y va a defender el equipo que perdió el balón. Transiciones inmediatas.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/pos18.jpg","src":"Tareas de juegos de posesión","cat":"Infantil y mayores","ser":"3 series de 5′","dur":17,"fic":{"cx":"Alta","es":"Rondo","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 grupos de 10","pr":"rp","prs":["pm","rp"]},{"id":"pos19","s":"pri","e":["ren"],"n":"Rondo 6x4x2","o":"Presionar tras la pérdida.","g":"Se juega un 6x4 (azules defienden) dentro del espacio delimitado. Si azules recuperan, juegan un 4x2 (naranjas defienden). Cuando naranjas recuperen el balón, juegan con amarillos de nuevo un 6x4. Cada 2 series los azules cambian el rol con los amarillos.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/pos19.jpg","src":"Tareas de juegos de posesión","cat":"Juvenil y mayores","ser":"4 series de 3′","dur":15,"fic":{"cx":"Alta","es":"Rondo","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 grupos de 10","pr":"rp","prs":["pm","rp"]},{"id":"pos20","s":"pri","e":["per","ren"],"n":"Rondo 4 colores","o":"Desmarcarse para recibir.","g":"Se juega un rondo donde los de dentro se apoyan en los 4 que están por fuera del espacio. Éstos solo pueden jugar con los de dentro o con su compañero (lado opuesto). Los de dentro no tienen límite de toques, los apoyos juegan a 2 toques cada serie rotan los roles.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/pos20.jpg","src":"Tareas de juegos de posesión","cat":"Cadete y mayores","ser":"4 series de 3′","dur":15,"fic":{"cx":"Alta","es":"Rondo","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"grupos de 8","pr":"pm","prs":["pm","pa"]},{"id":"pos21","s":"pri","e":["per","ren"],"n":"Posesión con apoyos","o":"Tomar decisiones con rapidez.","g":"En cada serie se cambian los interiores con los apoyos exteriores. Jugadores interiores tienen de límite 2 toques, los apoyos exteriores juegan al primer toque y no pueden jugar entre ellos. Los defensores pueden recuperar el balón interceptando los pases o tocando con la mano a los jugadores atacantes mientras están en posesión del balón.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/pos21.jpg","src":"Tareas de juegos de posesión","cat":"Infantil y mayores","ser":"4 series de 4′","dur":19,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"dos equipos","pr":"pm","prs":["pm","pa"]},{"id":"pos22","s":"pri","e":["per","ren"],"n":"Posesión 4x2 + 4x2","o":"Ofrecer líneas de pase.","g":"2 equipos de 4 + 3 comodines. En cada espacio se juega un 4x2. Solo puede cabiar de zona el comodín central. Para cambiar el balón a los compañeros del otro espacio, los atacantes deben dar 5 pases. Los defensores pueden pasarlo si recuperan el balón. Variante: se puede pasar a los compañeros del otro cuadrado en cualquier momento.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/pos22.jpg","src":"Tareas de juegos de posesión","cat":"Cadete y mayores","ser":"6 series de 3′","dur":23,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Resolución de problemas"},"org":"2 grupos de 11","pr":"pm","prs":["pm"]},{"id":"pos23","s":"pri","e":["ren"],"n":"Ataque en dos zonas","o":"Reaccionar en las transiciones.","g":"Cada equipo tiene su zona de ataque, donde se juega un 5x5 +3 comodines. Si el equipo amarillo recupera el balón, pasa a su zona de ataque mediante pase a un comodín o a un compañero que pase a la zona de ataque. El equipo azul trata de recuperar antes de que pasen. Cada serie rotan los comodines.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/pos23.jpg","src":"Tareas de juegos de posesión","cat":"Juvenil y mayores","ser":"2 series de 8′","dur":17,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"1 grupo","pr":"rp","prs":["ap","rp"]},{"id":"pos24","s":"pri","e":["ren"],"n":"8 pases + cambio","o":"Reaccionar en las transiciones.","g":"Se juega un 5x5 +3 comodines en una de las zonas. Si el equipo azul enlaza 8 pases, debe jugar con un comodín que esta en la otra zona y pasar a atacar allí. Si el equipo amarillo recupera, intenta hacer lo mismo. Cada serie rotan los comodines.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/pos24.jpg","src":"Tareas de juegos de posesión","cat":"Juvenil y mayores","ser":"2 series de 8′","dur":17,"fic":{"cx":"Alta","es":"Juego de Posición","di":"Intensiva (interacción)","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"1 grupo","pr":"rp","prs":["pm","ap","rp"]},{"id":"fin02","s":"pri","e":["ren"],"n":"Pases y tiro lateral","o":"Ejecutar las acciones con velocidad y mejorar la técnica individual.","g":"Realizar pases con o sin control, coordinando la carrera del receptor con el pase. Finalizar al primer toque, al igual que el rechace. Rotación hacia la derecha. Realizar una serie en cada perfil.","c":"Apoyo cerca; juega de primeras cuando se pueda; ataca el espacio tras pasar.","img":"img/fin02.jpg","src":"Tareas de finalización","cat":"Juvenil y mayores","ser":"2 series de 6′","dur":13,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"pa","fin":1,"prs":["pf","pa"]},{"id":"fin03","s":"pri","e":["per","ren"],"n":"Pases y tiro frontal 1","o":"Ejecutar las acciones con velocidad y mejorar la técnica individual.","g":"Realizar pases con o sin control, coordinando la carrera del receptor con el pase. Rotación: 1-2-3-1. Realizar una serie en cada perfil.","c":"Apoyo cerca; juega de primeras cuando se pueda; ataca el espacio tras pasar.","img":"img/fin03.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"2 series de 6′","dur":13,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"pa","fin":1,"prs":["pf","pa"]},{"id":"fin04","s":"pri","e":["per","ren"],"n":"Pases y tiro frontal 2","o":"Actuar con velocidad y mejorar la técnica individual.","g":"Azul realiza pase y sale en velocidad a defender al jugador que llega desde atrás. Coordinar bien la carrera del receptor con el balón. Realizar todas las acciones a la mayor velocidad posible. Realizar una serie en cada perfil.","c":"Apoyo cerca; juega de primeras cuando se pueda; ataca el espacio tras pasar.","img":"img/fin04.jpg","src":"Tareas de finalización","cat":"Cadete y mayores","ser":"2 series de 6′","dur":13,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"pa","fin":1,"prs":["pf","pa"]},{"id":"fin05","s":"pri","e":["per","ren"],"n":"Desmarques de ruptura","o":"Ejecutar las acciones con velocidad y mejorar la técnica individual.","g":"Delantero descarga de cara con el mediocentro y realiza un desmarque a la espalda de la defensa, eligiendo una de las dos opciones posibles. El mediocentro coordinará el pase con el desmarque para no caer en fuera de juego. Finalizar rápido. Rotación de roles. Realizar una serie en cada perfil.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/fin05.jpg","src":"Tareas de finalización","cat":"Cadete y mayores","ser":"2 series de 8′","dur":17,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"ap","fin":1,"prs":["pm","pf","pa","ap"]},{"id":"fin06","s":"pri","e":["per","ren"],"n":"Pasar y cortar","o":"Ejecutar las acciones con velocidad y mejorar la técnica individual.","g":"Realizar pases en el orden establecido. Naranja despues de dejar de cara, corta al espacio y finaliza. Amarillo llega al rechace. Rotación verde-naranja-amarillo. Realizar una serie en cada perfil.","c":"Apoyo cerca; juega de primeras cuando se pueda; ataca el espacio tras pasar.","img":"img/fin06.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"2 series de 5′","dur":11,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"pa","fin":1,"prs":["pf","pa"]},{"id":"fin07","s":"pri","e":["des","per","ren"],"n":"Balón dividido","o":"Actuar con velocidad y mejorar la técnica individual.","g":"Hay 3 posibles recorridos (negro, verde y azul). Dependiendo de la señal del entrenador (auditiva o visual) se realizará uno u otro para después finalizar la jugada. El primero que llegue ataca y el otro defiende. Si el defensor recupera el balón tiene posibilidad de atacar. Realizar una repetición de cada lado.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/fin07.jpg","src":"Tareas de finalización","cat":"Alevín y mayores","ser":"1 serie de 15′","dur":15,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"parejas","pr":"rp","fin":1,"prs":["rp"]},{"id":"fin08","s":"pri","e":["per","ren"],"n":"Combinada 1","o":"Actuar con velocidad y mejorar la técnica individual.","g":"Realizar los pases a la mayor velocidad posible e ir a rematar el centro ocupando bien las zonas de remate. Realizar una serie en cada perfil. Variante: introducir un defensor en el área.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/fin08.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"2 series de 6′","dur":13,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"ap","fin":1,"prs":["pf","pa","ap"]},{"id":"fin09","s":"pri","e":["per","ren"],"n":"Combinada 2","o":"Actuar con velocidad y mejorar la técnica individual.","g":"Realizar los pases a la mayor velocidad posible e ir a rematar el centro ocupando bien las zonas de remate. Realizar una serie en cada perfil. Variante: introducir un defensor en el área.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/fin09.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"2 series de 6′","dur":13,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"ap","fin":1,"prs":["pf","pa","ap"]},{"id":"fin10","s":"pri","e":["per","ren"],"n":"Pases, centro y remate","o":"Ejecutar las acciones con velocidad y mejorar la técnica individual.","g":"Realizar pases con o sin control, realizando previamente un desmarque. Amarillo llega a la zona del segundo palo y naranja a la del primer palo. Rotación: 1-2-3-1. Realizar una serie en cada perfil. Variante: poner un defensor en el área.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/fin10.jpg","src":"Tareas de finalización","cat":"Cadete y mayores","ser":"2 series de 6′","dur":13,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"ap","fin":1,"prs":["pm","pf","ap"]},{"id":"fin11","s":"pri","e":["ini","des"],"n":"Conducción y tiro frontal","o":"Reaccionar con rapidez ante un estímulo y mejorar la técnica individual.","g":"Salen los 4 jugadores a la vez. Cuando lleguen al cuadrado, el entrenador dirá el color del cono del lado hacia el que tienen que atacar los verdes. Los azules salen al lado contrario e intentan llegar a defender. Cambio de rol.","c":"Apoyo cerca; juega de primeras cuando se pueda; ataca el espacio tras pasar.","img":"img/fin11.jpg","src":"Tareas de finalización","cat":"Alevín y menores","ser":"1 serie de 15′","dur":15,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"ap","fin":1,"prs":["ap"]},{"id":"fin12","s":"pri","e":["per","ren"],"n":"Competición de rapidez","o":"Ejecutar las acciones con velocidad y mejorar la técnica individual.","g":"A la señal del entrenador, realizan el ejercicio a máxima velocidad sin perder precisión. El primero que tire obtiene 1 punto, el que marque obtiene 2. Cambio de rol. Realizar una serie en cada perfil.","c":"Apoyo cerca; juega de primeras cuando se pueda; ataca el espacio tras pasar.","img":"img/fin12.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"2 series de 4 repeticiones","dur":15,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"pa","fin":1,"prs":["pf","pa","ap"]},{"id":"fin13","s":"pri","e":["per","ren"],"n":"Tiro en cuadrado","o":"Mejorar la técnica de pase y control.","g":"Cada serie son 6 repeticiones, 3 de cada perfil. Cambio de rol. 1/ pase + conducción + tiro. 2/ pared + tiro. 3/ pase en diagonal + 1x1. 4/ pase en diagonal + 2x2.","c":"Apoyo cerca; juega de primeras cuando se pueda; ataca el espacio tras pasar.","img":"img/fin13.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"4 series de 6 repeticiones","dur":15,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"pa","fin":1,"prs":["pm","pf","pa","ap"]},{"id":"fin14","s":"pri","e":["ini","des"],"n":"Pase y 1x1","o":"Mejorar la técnica individual.","g":"Los naranjas realizan un pase en diagonal y salen a defender el 1x1. Si recuperan intentan salir con conducción hasta la línea de conos. Los verdes atacan lo más rápido posible. Si pierden, realizan la transición defensiva tratando de que no lleguen a la línea de conos. Cambio de rol. Una serie de cada perfil.","c":"Apoyo cerca; juega de primeras cuando se pueda; ataca el espacio tras pasar.","img":"img/fin14.jpg","src":"Tareas de finalización","cat":"Alevín y menores","ser":"2 series de 10 repeticiones","dur":15,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"pa","fin":1,"prs":["pf","pa","ap","rp"]},{"id":"fin15","s":"pri","e":["per","ren"],"n":"Contraataque corto","o":"Desplazarse a máxima velocidad y mejorar la técnica.","g":"En un espacio de 10x6 metros se juega un 2x2 + 2 comodines. Después de realizar 5 pases seguidos, los naranjas inician un contraataque de 3x2 con un pase a banda a uno de los dos comodines. Rotación de roles.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/fin15.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"2 series de 8 repeticiones","dur":15,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 grupos","pr":"rp","fin":1,"prs":["rp"]},{"id":"fin16","s":"pri","e":["ren"],"n":"Contraataque largo","o":"Desplazarse a máxima velocidad y mejorar la técnica.","g":"En un espacio de 20x15 se juega un 6x3, cuando amarillo recupere balón, inicia contraataque con los amarillos atacantes o con uno de los comodines verdes, que se sumará al contraataque. Los equipos estarán compensados en cuanto a las posiciones se refiere. Una serie en cada rol. Los porteros también cambian de rol.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/fin16.jpg","src":"Tareas de finalización","cat":"Juvenil y mayores","ser":"2 series de 10′","dur":21,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Equipo","en":"Descubrimiento guiado"},"org":"1 grupo","pr":"rp","fin":1,"prs":["rp"]},{"id":"fin17","s":"pri","e":["per","ren"],"n":"Doble área","o":"Mejorar el juego colectivo.","g":"En un espacio aproximado del doble del área, se juega un 5x5. No hay límite de toques.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/fin17.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"3 series de 4′","dur":14,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Equipo","en":"Descubrimiento guiado"},"org":"3 equipos","pr":"pm","fin":1,"prs":["pm"]},{"id":"fin18","s":"pri","e":["per","ren"],"n":"Doble área 3 equipos","o":"Mejorar el juego colectivo.","g":"En un espacio aproximado del doble del área, se juega un 5x5 + 5 comodines. Los comodines juegan a un toque, el resto a dos. El que gana sigue jugando y el que pierde hace de comodín. Los partidos son a 2 minutos o a un gol. Si hay empate, pierde el que más tiempo lleve jugando.","c":"Pasa y muévete; ofrece línea de pase al poseedor.","img":"img/fin18.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"1 serie de 20′","dur":20,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Equipo","en":"Descubrimiento guiado"},"org":"3 equipos","pr":"pm","fin":1,"prs":["pm"]},{"id":"fin19","s":"pri","e":["ini","des"],"n":"2x2 + transición","o":"Desmarcarse para recibir y mejorar la técnica.","g":"Cada pareja realizará un ataque y una defensa, luego descansarán. El entrenador inicia la acción con un pase a uno de los amarillos que habrán realizado movimientos de desmarque (apoyo y ruptura). Éstos iniciarán el ataque, si verde recupera, ataca la portería contraria y amarillos realizarán la transición defensiva.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/fin19.jpg","src":"Tareas de finalización","cat":"Alevín y menores","ser":"1 serie de 15′","dur":15,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Equipo","en":"Descubrimiento guiado"},"org":"2 equipos","pr":"rp","fin":1,"prs":["pm","pa","ap","rp"]},{"id":"fin20","s":"pri","e":["des","per","ren"],"n":"Contraataque posicional","o":"Actuar con velocidad, resolver situaciones de 1x1 y mejorar la técnica.","g":"Partidos de 2'. El que pierda descansa. Los jugadores tienen posiciones y zonas de actuación asignadas. Un jugador de la zona media puede invadir la zona de ataque para hacer un 2x1, recuperando rápidamente la posición en caso de pérdida o cuando se finalice la jugada.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/fin20.jpg","src":"Tareas de finalización","cat":"Alevín y mayores","ser":"1 serie de 20′","dur":20,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Equipo","en":"Descubrimiento guiado"},"org":"3 equipos de 4","pr":"rp","fin":1,"prs":["pa","rp"]},{"id":"fin21","s":"pri","e":["ini","des"],"n":"Presión + contraataque","o":"Actuar con velocidad y mejorar la técnica.","g":"El entrenador inicia la acción con un pase al verde, que intentará llegar a atravesar la portería azul en conducción. Los amarillos, en cuanto el entrenador realice el pase, irán a la presión. Tras la recuperación, iniciarán el contraataque y el otro jugador verde replegará para defender. Cada defensor solo podrá defender en su medio campo. Rotación de perfiles. A la mitad del tiempo, rotación de roles.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/fin21.jpg","src":"Tareas de finalización","cat":"Alevín y menores","ser":"1 serie de 20′","dur":20,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Equipo","en":"Descubrimiento guiado"},"org":"2 equipos","pr":"rp","fin":1,"prs":["pf","rp"]},{"id":"fin22","s":"pri","e":["ini","des","per","ren"],"n":"Pases y tiro 1","o":"Pasar con precisión y finalizar.","g":"Realizar pases, coordinados con el compañero, (pie o espacio) y tiro. Rotación según los números. La mitad en cada perfil.","c":"Apoyo cerca; juega de primeras cuando se pueda; ataca el espacio tras pasar.","img":"img/fin22.jpg","src":"Tareas de finalización","cat":"Benjamín y mayores","ser":"1 serie de 15′","dur":15,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"pa","fin":1,"prs":["pf","pa"]},{"id":"fin23","s":"pri","e":["per","ren"],"n":"Combinada 3","o":"Actuar con velocidad y mejorar la técnica individual.","g":"Realizar los pases en el orden establecido, superando los conos con pase elevado a banda fija, poner centro y remate. Rotar posiciones. Cada serie en un perfil.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/fin23.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"2 series de 5′","dur":11,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"ap","fin":1,"prs":["pf","pa","ap"]},{"id":"fin24","s":"pri","e":["per","ren"],"n":"Combinada 4","o":"Actuar con velocidad y mejorar la técnica individual.","g":"Realizar los pases en el orden establecido, superando los conos con un cambio de orientación, poner centro y remate. Rotar posiciones. Cada serie en un perfil.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/fin24.jpg","src":"Tareas de finalización","cat":"Infantil y mayores","ser":"2 series de 5′","dur":11,"fic":{"cx":"Media","es":"Situaciones Reducidas","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Descubrimiento guiado"},"org":"2 perfiles","pr":"ap","fin":1,"prs":["pf","pa","ap"]},{"id":"par02","s":"par","e":["per","ren"],"n":"Partido 3 equipos","o":"Reaccionar en las transiciones.","g":"Ataques 5x4 continuos cuando el equipo defensor recupere el balón, debe jugar con el comodín que esta en el medio campo contrario. Los atacantes presionan la salida de balón hasta que toque balón el comodín. En ese momento pasan a atacar al otro medio campo.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/par02.jpg","src":"Tareas de partidos tácticos","cat":"Infantil y mayores","ser":"1 serie de 20′","dur":20,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"3 equipos","pr":"rp","prs":["sb","rp"]},{"id":"par03","s":"par","e":["per","ren"],"n":"Partido vigilancias","o":"Mantener las vigilancias defensivas.","g":"Cada equipo en su medio campo juega un (6x4). Los defensores tienen que enlazar con los compañeros que estan el la otra parte del campo (pase o despeje). Si recupera el portero, iniciará con uno de los comodines, que pasrán a atacar a campo contrario. Los comodines atacan con los dos equipos.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/par03.jpg","src":"Tareas de partidos tácticos","cat":"Infantil y mayores","ser":"1 serie de 20′","dur":20,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"2 equipos","pr":"rp","prs":["rp"]},{"id":"par04","s":"par","e":["des","per","ren"],"n":"Partido salida de balón","o":"Iniciar el juego desde atrás.","g":"Cada equipo en su medio campo juega un 4x2 y debe dar 3 pases antes de poder contactar con los delanteros, que estarán en el medio campo contrario y jugarán un 4x4, tratando de marcar gol. Si hay robo, transición ofensiva y defensiva inmediata. Los comodines atacan con los dos equipos.","c":"Ábrete para recibir; si presionan por un lado, sal por el otro.","img":"img/par04.jpg","src":"Tareas de partidos tácticos","cat":"Alevín y mayores","ser":"2 series de 10′","dur":21,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"2 equipos","pr":"sb","prs":["sb","rp"]},{"id":"par05","s":"par","e":["per","ren"],"n":"Partido 8 sectores","o":"Ocupar racionalmente el espacio.","g":"Se juega un 11x11 a 3 toques en campo propio. En campo contrario toque libre. No se pueder dar más de 3 pases seguidos en el mismo sector.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/par05.jpg","src":"Tareas de partidos tácticos","cat":"Infantil y mayores","ser":"2 series de 10′","dur":21,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"2 equipos","pr":"ap","prs":["pa","ap"]},{"id":"par06","s":"par","e":["per","ren"],"n":"Partido amplitud","o":"Ocupar el campo con amplitud.","g":"Se juega un 11x11 sin limitación de toques. Para poder meter gol, el balón tiene que pasar por al menos una banda. Si se marca gol y se ha pasado por las dos bandas, vale doble.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/par06.jpg","src":"Tareas de partidos tácticos","cat":"Infantil y mayores","ser":"2 series de 10′","dur":21,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"2 equipos","pr":"ap","prs":["pa","ap"]},{"id":"par07","s":"par","e":["per","ren"],"n":"Partido 4 pasillos","o":"Ocupar el campo con amplitud y bascular como equipo.","g":"Se juega un 11x11 sin limitación de toques. En ataque ocupar los 4 pasillos. En defensa abandonar el más alejado al balón. Tras robo, el siguiente pase debe ir a otro pasillo distinto al que se ha recuperado el balón.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/par07.jpg","src":"Tareas de partidos tácticos","cat":"Infantil y mayores","ser":"2 series de 15′","dur":31,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"2 equipos","pr":"ap","prs":["pa","ap","rp"]},{"id":"par08","s":"par","e":["des","per","ren"],"n":"Partido contraataque","o":"Reaccionar en las transiciones.","g":"Cada serie son 2 partidos, azul vs naranja y verde vs rosa. Los partidos son de un minuto, por lo que se debe jugar muy rápido. No hay limitación de toques.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/par08.jpg","src":"Tareas de partidos tácticos","cat":"Alevín y mayores","ser":"10 series","dur":20,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"4 equipos","pr":"rp","prs":["rp"]},{"id":"par09","s":"par","e":["ren"],"n":"Partido 2 estilos","o":"Contraatacar con rapidez y atacar de forma combinativa.","g":"Amarillos realizan ataque combinativo. Tienen que dar 4 pases entre los de dentro para poder atacar un 4x2 (ext + del + med vs 2 cen), iniciando siempre con un pase a banda y realizar centro lateral. Los azules, en cuanto recuperen el balón, inician contraataque 4x4 (2 ext + 2 del vs 2 lat + 2 cen), finalizando lo más rápido posible. En cuanto finalice la jugada en cualquiera de las dos áreas, pase al cuadrado y se empieza de nuevo.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/par09.jpg","src":"Tareas de partidos tácticos","cat":"Juvenil y mayores","ser":"2 series de 15′","dur":31,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"2 equipos","pr":"rp","prs":["ap","rp"]},{"id":"par10","s":"par","e":["ren"],"n":"Combinativo contra contraataque","o":"Reaccionar en las transiciones y mantener las vigilancias defensivas.","g":"Verdes realizan ataque combinativo. Tienen que dar 5 pases para poder atacar un 3x2 (se incorporan dos verdes), iniciando siempre con un pase a banda para realizar centro lateral. Los azules, en cuanto recuperen el balón, inician contraataque 4x3 (se incorporan dos verdes), iniciando siempre con un pase a uno de los delanteros. Los roles individuales van rotando. Cada serie cambia el rol grupal.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/par10.jpg","src":"Tareas de partidos tácticos","cat":"Juvenil y mayores","ser":"2 series de 15′","dur":31,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"2 equipos","pr":"rp","prs":["ap","rp"]},{"id":"par11","s":"par","e":["ren"],"n":"Rondo y 1x1 contra contraataque","o":"Reaccionar en las transiciones.","g":"Verde mantiene la posesión, intentando dar 8 pases seguidos. Si lo consigue, uno de ellos realiza un 1x1 contra el jugador azul que esta esperando fuera del espacio delimitado. Si naranja recupera, inician un contraataque de 4x3 contra los azules (verdes trata de impedirlo dentro del espacio delimitado). Los roles rotan en cada serie.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/par11.jpg","src":"Tareas de partidos tácticos","cat":"Juvenil y mayores","ser":"3 series de 8′","dur":26,"fic":{"cx":"Alta","es":"Rondo","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Descubrimiento guiado"},"org":"3 equipos","pr":"rp","prs":["pm","pa","rp"]},{"id":"par12","s":"par","e":["per","ren"],"n":"Rondos + finalización","o":"Reaccionar en las transiciones.","g":"Azul mantiene la posesión, intentando dar 5 pases seguidos. Si lo consigue, uno de ellos realiza un 1x1 contra el portero. Si verde recupera, da pase al otro espacio para que se realice un 3x1, finalizando lo más rápido posible (azul trata de impedirlo dentro del espacio delimitado). Los roles rotan cada vez que se marque un gol.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/par12.jpg","src":"Tareas de partidos tácticos","cat":"Cadete y mayores","ser":"3 series de 6′","dur":20,"fic":{"cx":"Alta","es":"Rondo","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Descubrimiento guiado"},"org":"2 equipos de 6","pr":"rp","prs":["pm","pa","rp"]},{"id":"par13","s":"par","e":["per","ren"],"n":"ABP + transición","o":"Ejecutar acciones a balón parado y reaccionar en las transiciones.","g":"Azules inician mediante una acción a balón parado. Si hay remate suma un gol, si marca suman 2 goles. Si hay despeje, se inicia la transición hasta que finalice la jugada en una u otra portería. Si naranjas consigue tirar a portería en el contraataque suma un gol, si marca suma 3 goles. Los roles rotan en cada serie.","c":"Tras perder, presión inmediata del más cercano; tras robar, primer pase seguro o ataque rápido.","img":"img/par13.jpg","src":"Tareas de partidos tácticos","cat":"Infantil y mayores","ser":"2 series de 10′","dur":21,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"2 equipos","pr":"rp","prs":["rp"]},{"id":"par14","s":"par","e":["ren"],"n":"1x1 contra portero","o":"Ganar la espalda a la defensa y resolver situaciones de 1x1.","g":"Se juega un 7x7 + 2 comodines dentro del espacio central. Progresar hasta conseguir ganar la espalda a la línea defensiva mediante un pase al espacio delimitado. En esa zona se realizará un 1x1 contra el portero, sin que los defensores puedan entrar. Variante: se puede entrar en conducción a la zona de finalización.","c":"Abre el campo; si un lado se cierra, cambia; llega al área con varios jugadores.","img":"img/par14.jpg","src":"Tareas de partidos tácticos","cat":"Juvenil y mayores","ser":"4 series de 6′","dur":27,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"2 equipos","pr":"ap","prs":["pa","ap"]},{"id":"par15","s":"par","e":["ren"],"n":"Salida de balón y progresión","o":"Progresar hasta campo contrario.","g":"Se juega un 9x9 + 2 comodines dentro del espacio total. Los jugadores están distribuidos por zonas. Solo pueden invadir las otras zonas los comodines (solo uno a la vez). En la zona central se juega a 2 toques. Progresar hasta conseguir contactar con los delanteros, que intentarán finalizar.","c":"Ábrete para recibir; si presionan por un lado, sal por el otro.","img":"img/par15.jpg","src":"Tareas de partidos tácticos","cat":"Juvenil y mayores","ser":"2 series de 12′","dur":25,"fic":{"cx":"Alta","es":"Partidos","di":"Extensiva","si":"Estructura Completa","co":"Coordinación Equipo","en":"Resolución de problemas"},"org":"2 equipos","pr":"sb","prs":["sb"]},{"id":"fis02","s":"act","e":["per","ren"],"n":"Circuito coordinación 1","o":"Mejorar la coordinación.","g":"Realizar una repetición en cada ejercicio e ir rotando al siguiente. 2' de recuperación entre series. Realizar a la mayor velocidad posible sin perder precisión en las acciones. En las escaleras se realizan ejercicios diferentes unos de otros.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis02.jpg","src":"Tareas de preparación física","cat":"Cadete y mayores","ser":"3 series de 4 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"4 grupos"},{"id":"fis03","s":"act","e":["per","ren"],"n":"Circuito coordinación 2","o":"Mejorar la coordinación.","g":"Cada repetición es una vuelta completa al circuito. Realizar a la mayor velocidad posible sin perder precisión en las acciones. Coordinar la salida para que sea lo más continuo posible.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis03.jpg","src":"Tareas de preparación física","cat":"Infantil y mayores","ser":"6 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"2 grupos"},{"id":"fis04","s":"act","e":["des","per","ren"],"n":"Coordinación específica 1","o":"Mejorar la coordinación y mejorar la técnica de pase y control.","g":"Cada repetición es un ejercicio distinto: 1- conducción dos piernas. 2- conducción normal y de espaldas. 3- conducción slalom (la mitad del trayecto solo con derecha y la otra solo con izquierda). 4- control orientado y pase (solo con dos balones). Realizar a la mayor velocidad posible sin perder precisión en las acciones.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis04.jpg","src":"Tareas de preparación física","cat":"Alevín y mayores","ser":"4 repeticiones de 3′","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"2 grupos de 8","pr":"pm","prs":["pm","pf","ap"]},{"id":"fis05","s":"act","e":["ini","des","per","ren"],"n":"Coordinación específica 2","o":"Mejorar la coordinación y mejorar la técnica de pase y control.","g":"Realizar despacio, e ir aumentando poco a poco la velocidad. Últimos 5 minutos realizar sin balón el mismo recorrido a la máxima velocidad (relevos).","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis05.jpg","src":"Tareas de preparación física","cat":"Benjamín y mayores","ser":"1 serie de 15′","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Sectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"parejas","pr":"pm","prs":["pm"]},{"id":"fis06","s":"act","e":["per","ren"],"n":"Circuito agilidad","o":"Mejorar la agilidad y desarrollar la fuerza explosiva.","g":"En un espacio reducido estan distribuídos distintos elementos que hay que sortear a máxima intensidad . El recorrido es libre, intentando no repetir los mismos elementos. Recuperación entre repeticiones de 1 minuto, aprovechando para hacer trabajo compensatorio.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis06.jpg","src":"Tareas de preparación física","cat":"Cadete y mayores","ser":"6 repeticiones de 30″","dur":185,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"1 grupo"},{"id":"fis07","s":"act","e":["ren"],"n":"Circuito propiocepción 1","o":"Trabajar la propiocepción y mejorar la agilidad.","g":"Realizar 2 repeticiones seguidas en cada ejercicio y luego rotar. Recuperación implícita en la rotación. La intensidad es submáxima.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis07.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"2 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"5 grupos"},{"id":"fis08","s":"fis","e":["ren"],"n":"Circuito fuerza máxima","o":"Desarrollar la fuerza máxima.","g":"Cada serie es una vuelta al circuito completo. Intensidad submáxima. La recuperación entre repeticiones está implícita en la rotación del rol dentro de cada pareja. La recuperación entre series será de 3 minutos.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis08.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"2 series","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"parejas"},{"id":"fis09","s":"fis","e":["ren"],"n":"Fartlek de fuerza explosiva","o":"Mejorar la resistencia a la fuerza explosiva.","g":"Recuperación entre series de 2 minutos. Respetar bien los ritmos marcados. Coordinar las salidas para que no haya interrupciones durante las 2 repeticiones seguidas.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis09.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"2 series de 2 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"1 grupo"},{"id":"fis10","s":"fis","e":["per","ren"],"n":"Cuadrado de fuerza","o":"Mejorar la resistencia a la fuerza explosiva.","g":"Cada repetición es una vuelta completa al cuadrado. 2 minutos de recuperación entre series. Realizar control y pase e ir donde se ha pasado realizando las acciones coorespondientes de fuerza explosiva.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis10.jpg","src":"Tareas de preparación física","cat":"Cadete y mayores","ser":"2 series de 2 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"2 grupos de 8","prs":["pf"],"pr":"pf"},{"id":"fis11","s":"pri","e":["ren"],"n":"F. explosiva con finalización 1","o":"Desarrollar la fuerza explosiva, finalizar y rematar.","g":"Cada repetición consta de realizar cada ejercicio en los dos perfiles. Realizar las 2 repeticiones seguidas en el mismo ejercicio y luego se rota. Recuperación implícita en la rotación. Acciones de máxima intensidad.","c":null,"img":"img/fis11.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"2 repeticiones (12 en total)","dur":15,"fic":{"cx":"Media","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Mando directo"},"org":"3 grupos","fin":1,"prs":["pf"],"pr":"pf"},{"id":"fis12","s":"pri","e":["per","ren"],"n":"F. explosiva con finalización 2","o":"Desarrollar la fuerza explosiva, finalizar y rematar.","g":"Cada serie corresponde a un perfil. Las repeticiones se realizarán dos seguidas en cada ejercicio y luego se rota. Recuperación implícita en la rotación. Acciones de máxima intensidad. Salen todos a la vez son dos perfiles distintos","c":null,"img":"img/fis12.jpg","src":"Tareas de preparación física","cat":"Cadete y mayores","ser":"2 series de 6 repeticiones","dur":15,"fic":{"cx":"Media","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Mando directo"},"org":"6 grupos","fin":1,"prs":["pf"],"pr":"pf"},{"id":"fis13","s":"pri","e":["ren"],"n":"F. explosiva con finalización 3","o":"Desarrollar la fuerza explosiva, finalizar y rematar.","g":"Cada serie corresponde a un perfil. Las repeticiones se realizarán dos seguidas en cada ejercicio y luego se rota. Recuperación implícita en la rotación. Acciones de máxima intensidad. Salen todos a la vez son dos perfiles distintos","c":null,"img":"img/fis13.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"2 series de 6 repeticiones","dur":15,"fic":{"cx":"Media","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugadores/as","en":"Mando directo"},"org":"6 grupos","fin":1,"prs":["pf"],"pr":"pf"},{"id":"fis14","s":"pri","e":["ren"],"n":"F. explosiva con finalización 4","o":"Desarrollar la fuerza explosiva y finalizar.","g":"Al finalizar el ejercicio, recoge el balón y se coloca para realizar los pases con el compañero, que habrá ido al principio para realizar el ejercicio. Recuperación implícita en la rotación. Acciones de máxima intensidad.","c":null,"img":"img/fis14.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"8 repeticiones","dur":15,"fic":{"cx":"Media","es":"Circuito","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugadores/as","en":"Mando directo"},"org":"parejas","fin":1},{"id":"fis15","s":"fis","e":["ren"],"n":"F. explosiva específica","o":"Mejorar la resistencia a la fuerza explosiva.","g":"Realizar una serie en cada perfil. Recuperación implícita en la rotación. Los azules son jugadores defensivos y los amarillos jugadores ofensivos. Acciones de 20-30 segundos a máxima intensidad.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis15.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"2 series de 3 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"4 grupos","prs":["pf"],"pr":"pf"},{"id":"fis16","s":"fis","e":["per","ren"],"n":"Circuito anaeróbico","o":"Mejorar la resistencia anaeróbica y finalizar.","g":"Cada repetición corresponde a una vuelta entera al circuito. Al finalizar en una portería, colocarse al final de la fila del perfil contrario. Recuperación implícita en el circuito. Coordinar las salidas para que no haya demasiada recuperación entre cada repetición.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis16.jpg","src":"Tareas de preparación física","cat":"Cadete y mayores","ser":"3 repeticioneseticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"2 grupos","prs":["pf"],"pr":"pf"},{"id":"fis17","s":"fis","e":["ren"],"n":"Capacidad anaeróbica 1","o":"Mejorar la resistencia anaeróbica.","g":"Realizar el recorrido a la máxima intensidad posible y entregar el balón al compañero para que lo realice él. Repetir hasta que finalice el tiempo. Recuperación entre repeticiones de 1 minuto, donde se realizará habilidad con el balón por parejas.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis17.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"5 repeticiones de 1′","dur":9,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"parejas"},{"id":"fis18","s":"fis","e":["ren"],"n":"Capacidad anaeróbica 2","o":"Mejorar la resistencia anaeróbica.","g":"Realizar el recorrido a la máxima intensidad posible y pasar el balón al compañero para que lo realice él. Repetir hasta que finalice el tiempo. Recuperación entre repeticiones de 1 minuto, donde se realizará habilidad con el balón por tríos.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis18.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"4 repeticiones de 2′","dur":11,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"grupos de 3"},{"id":"fis19","s":"fis","e":["ren"],"n":"Potencia anaeróbica","o":"Mejorar la resistencia anaeróbica.","g":"Cada repetición consta de una rotación completa de todos los roles. Recuperación implícita en la rotación. El jugador amarillo va hacia uno de los conos que tiene a los lados. El jugador verde, después de hacer la acción técnica correspondiente, se gira y va y vuelve al cono contrario a máxima velocidad. Realizar a máxima intensidad.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis19.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"6 repeticiones de 30″","dur":185,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"grupos de 3","prs":["pm"],"pr":"pm"},{"id":"fis20","s":"fis","e":["per","ren"],"n":"Fartlek + rondos","o":"Mejorar la resistencia mixta y mejorar la técnica de pase y control.","g":"Se realiza un rondo de 4x1 al primer toque dentro de cada espacio. A la señal, cambio en diagonal a máxima velocidad. El último que llegue comienza de defensor. La señal será cada 30\" aproximadamente. Variante: jugar con las distancias y el tiempo de recuperación en función del objetivo perseguido.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis20.jpg","src":"Tareas de preparación física","cat":"Cadete y mayores","ser":"3 series de 4′","dur":14,"fic":{"cx":"Baja","es":"Rondo","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugador/a","en":"Descubrimiento guiado"},"org":"grupos de 4-5","pr":"pm","prs":["pm","ap"]},{"id":"fis21","s":"fis","e":["per","ren"],"n":"Fartlek en cuadrado","o":"Mejorar la resistencia mixta.","g":"Cada serie es en un perfil (amarillo o verde). Cada repetición es una vuelta completa. Recuperación entre series de 2'. Rojo a intensidad submáxima (90%), negro a baja intensidad (60%).","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis21.jpg","src":"Tareas de preparación física","cat":"Cadete y mayores","ser":"2 series de 2 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"2 grupos","prs":["pf"],"pr":"pf"},{"id":"fis22","s":"fis","e":["ren"],"n":"Resistencia específica","o":"Mejorar la resistencia a la fuerza explosiva.","g":"Cada serie es en un ejercicio (verde, naranja o amarillo). Cada repetición es a un cono, variando la distancia (10-20-30 metros). Recuperación entre series de 1'. Realizar todo a máxima intensidad.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis22.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"3 series de 3 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"3 grupos"},{"id":"fis23","s":"fis","e":["per","ren"],"n":"Fuerza específica","o":"Mejorar la resistencia a la fuerza explosiva.","g":"Cada serie es en un ejercicio (verde, naranja o amarillo). Recuperación entre series de 1'. Realizar todo a máxima intensidad.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis23.jpg","src":"Tareas de preparación física","cat":"Infantil y mayores","ser":"3 series de 3 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"3 grupos"},{"id":"fis24","s":"fis","e":["per","ren"],"n":"Resistencia específica 2","o":"Mejorar la fuerza-resistencia.","g":"En las dos mitades del campo se realizan los mismos ejercicios. Realizar 1' de core (planchas isométricas) al final de cada repetición. Recuperación implícita en la rotación. Realizar todo a intensidad submáxima.","c":"Máxima intensidad sin perder la técnica; respeta las recuperaciones.","img":"img/fis24.jpg","src":"Tareas de preparación física","cat":"Cadete y mayores","ser":"6-8 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"Intensiva (interacción)","si":"Sectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"parejas"},{"id":"fis25","s":"act","e":["ren"],"n":"Circuito velocidad gestual","o":"Ejecutar las acciones con velocidad y mejorar la técnica individual.","g":"Cada serie corresponde a uno de los ejercicios. Recuperación entre series de 1 minuto. Realizar a la máxima velocidad posible sin perder precisión en las acciones.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis25.jpg","src":"Tareas de preparación física","cat":"Juvenil y mayores","ser":"3 series de 3 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"3 grupos"},{"id":"fis26","s":"act","e":["ini","des","per"],"n":"Vel. reacción 1","o":"Reaccionar con rapidez ante un estímulo.","g":"Cada serie corresponde a un ejercicio. Alternar los roles. 2 minutos de recuperación entre series, aprovechando para realizar habilidad con el balón por parejas. Realizar a máxima intensidad.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis26.jpg","src":"Tareas de preparación física","cat":"Infantil y menores","ser":"2 series de 10 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Sectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"parejas"},{"id":"fis27","s":"act","e":["des","per","ren"],"n":"Vel. reacción 2","o":"Reaccionar con rapidez ante un estímulo.","g":"Cada equipo sale a trote hacia el centro de la zona. Cuando el entrenador diga un color el equipo de ese color perseguirá al equipo contrario, que escapará hasta los conos donde empezaron. El entrenador esperará hasta que esten cerca los dos equipos para dar la orden. Recuperación entre repeticiones de 30 segundos.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis27.jpg","src":"Tareas de preparación física","cat":"Alevín y mayores","ser":"12 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"2 equipos","prs":["ap"],"pr":"ap"},{"id":"fis28","s":"act","e":["des","per","ren"],"n":"Vel. reacción 3","o":"Reaccionar con rapidez ante un estímulo.","g":"El ejercicio lo realizan a la vez 4 jugadores. La recuperación está implícita en la rotación. El entrenador va diciendo números y los jugadores tocan el cono correspondiente con el pie. Cuando el entrenador diga amarillo o azul, realizarán una salida a máxima velocidad al cono correspondiente.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis28.jpg","src":"Tareas de preparación física","cat":"Alevín y mayores","ser":"10 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"4 grupos"},{"id":"fis29","s":"act","e":["per","ren"],"n":"Vel. reacción 4","o":"Reaccionar con rapidez y ejecutar con velocidad.","g":"Cada repetición consta de realizar el ejercicio una vez en cada rol. Recuperación implícita en la rotación. El jugador amarillo decide el recorrido a realizar y el verde lo imita lo más rápido posible.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis29.jpg","src":"Tareas de preparación física","cat":"Cadete y mayores","ser":"5 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"2 equipos"},{"id":"fis30","s":"act","e":["ini","des","per","ren"],"n":"Vel. reacción 5","o":"Reaccionar con rapidez ante un estímulo.","g":"Cada serie corresponde a un ejercicio. Alternar los roles. 2 minutos de recuperación entre series, aprovechando para realizar habilidad con el balón por parejas. Realizar a máxima intensidad.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis30.jpg","src":"Tareas de preparación física","cat":"Benjamín y mayores","ser":"2 series de 6 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"2 grupos"},{"id":"fis31","s":"act","e":["per","ren"],"n":"Vel. reacción 6","o":"Reaccionar con rapidez ante un estímulo.","g":"Cada serie corresponde a un ejercicio. Alternar los roles. 2 minutos de recuperación entre series, aprovechando para realizar habilidad con el balón por parejas. Realizar a máxima intensidad.","c":"Aumenta la intensidad de forma progresiva; acciones con precisión y buena orientación del cuerpo.","img":"img/fis31.jpg","src":"Tareas de preparación física","cat":"Infantil y mayores","ser":"2 series de 6 repeticiones","dur":15,"fic":{"cx":"Baja","es":"Circuito","di":"ADM","si":"Intersectorial","co":"Coordinación Jugador/a","en":"Mando directo"},"org":"2 grupos"},{"id":"fis32","s":"act","e":["per","ren"],"n":"Carreras aceleración","o":"Desplazarse a máxima velocidad.","g":"Cada serie corresponde a un ejerci 4, 2]]}, "e": ["ini"], "mod": "sala"}, {"id": "fs09", "s": "pri", "pr": "sb", "n": "Salida del portero: 2x1 hasta la línea de medio campo", "o": "Iniciar el juego desde el portero buscando al compañero libre.", "g": "Media pista con portero. El portero saca con la mano a uno de los dos atacantes, abiertos en las bandas. Un defensor presiona. Punto si se cruza la línea de medio campo conduciendo con el balón controlado.", "c": "Ábrete y separa; el portero saca al que está libre; si te presionan, pase al compañero y desmárcate.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 20, "p": [["p", 1.2, 10, "", 1], ["a", 6, 3], ["a", 6, 17], ["b", 8, 10]], "f": [["p", 2, 9.6, 5.6, 3.6], ["m", 8, 10, 6.5, 5], ["c", 6, 3, 19, 4]], "k": [[20, 0], [20, 20]]}, "e": ["ini"], "mod": "sala"}, {"id": "fu37", "s": "par", "pr": "rp", "n": "Partido 4x4 con cambio de marcas al silbato", "o": "Reorganizar la defensa rápido y aprovechar el desorden del rival.", "g": "Partido 4x4 con porteros. Cuando el equipo que defiende ya se ha replegado y antes de que el rival empiece su ataque posicional, el entrenador pita: todos los defensores cambian de marca (giro defensivo o cambios por parejas). El que ataca aprovecha ese momento para atacar rápido.", "c": "Al silbato, comunica el cambio en voz alta; el atacante mira quién se ha quedado libre.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [], "p": [["p", 0.8, 10], ["p", 39.2, 10], ["a", 12, 10, "", 1], ["a", 18, 4], ["a", 18, 16], ["a", 26, 10], ["b", 21, 6], ["b", 21, 14], ["b", 28, 9], ["b", 16, 10], ["e", 20, 19.6, "E"]], "f": [["m", 21, 6, 25, 9], ["m", 28, 9, 22, 13], ["p", 12.6, 9.6, 17.4, 4.4]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fu09", "s": "pri", "pr": "rp", "n": "Defensa 1x2 que se libera al sexto pase", "o": "Defender en inferioridad controlando con la vista al balón y a los dos rivales.", "g": "Media pista de baloncesto (unos 14x15) dentro de la pista de futsal. Un defensor contra dos atacantes, que tienen que dar 6 pases. Al conseguirlo, se libera el espacio y pueden atacar cualquiera de las dos porterías, sin cambiar de campo una vez elegido. El que finaliza pasa a defender la siguiente.", "c": "Colócate entre los dos para cerrar el pase; finta para provocar el error; mira siempre balón y rival libre.", "ser": "4 series de 6 repeticiones", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[0, 3.5, 6, 13, ""], [34, 3.5, 6, 13, ""], [13, 3, 14, 14, "6 pases"]], "p": [["p", 0.8, 10], ["p", 39.2, 10], ["a", 15, 6, "", 1], ["a", 24, 12], ["b", 19, 9], ["a", 20, 19.4], ["a", 22, 19.4]], "f": [["p", 15.6, 6.4, 23.4, 11.6], ["m", 19, 9, 21, 11]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs10", "s": "rue", "pr": "pf", "n": "Recibir perfilado en el ala", "o": "Recibir con el cuerpo abierto y orientar el control hacia dentro.", "g": "Media pista. Un pasador en el centro y dos alas. El ala se desmarca, recibe perfilado (cuerpo mirando a la portería) y orienta el control hacia el carril central para pasar al compañero del otro lado. Rotan posiciones.", "c": "Antes de recibir, mira; control con el pie lejano al defensor; el primer toque ya hacia dentro.", "ser": "3 series de 4′", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19, 10], ["a", 6, 10, "", 1], ["a", 10, 3], ["a", 10, 17]], "f": [["p", 6.6, 9.6, 9.6, 3.6], ["c", 10, 3, 13, 8], ["p", 13, 8.6, 10.6, 16.4]]}, "e": ["ini"], "mod": "sala"}, {"id": "fs11", "s": "pri", "pr": "ap", "n": "Amplitud: 3x2 con zonas de ala", "o": "Ocupar las bandas para abrir espacios por dentro.", "g": "Pista completa sin porterías: dos zonas de ala de 3 m marcadas con conos. Tres atacantes contra dos defensores; los defensores no entran en las zonas de ala. Punto al pasar conduciendo la línea de fondo, y doble si antes el balón ha pasado por las dos alas.", "c": "Uno siempre abierto en cada ala; si te cierran, cambia el balón de lado.", "ser": "3 series de 4′", "d": {"w": 30, "h": 20, "p": [["a", 2, 10, "", 1], ["a", 8, 1.5], ["a", 8, 18.5], ["b", 10, 8], ["b", 10, 12]], "f": [["p", 2.6, 9.6, 7.6, 2], ["p", 8.6, 2, 8.6, 17.6]], "z": [[0, 0, 30, 3, "Ala"], [0, 17, 30, 3, "Ala"]]}, "e": ["ini"], "mod": "sala"}, {"id": "fu10", "s": "pri", "pr": "rp", "n": "5x5 + porteros en tres zonas: máximo 3x2 por zona", "o": "Defender en inferioridad 2x3: flotar, replegar, temporizar y cerrar líneas de pase.", "g": "Pista completa dividida en tres zonas de 13,3x20. Juego libre 5x5 con porteros, pero en cada zona no puede haber más de 3 atacantes ni más de 2 defensores. Se entra y se sale de las zonas libremente respetando esa regla. Variantes: a dos toques; el portero del equipo con balón cuenta como atacante.", "c": "Con dos contra tres, uno al balón y otro en medio de los dos libres; repliega rápido a la zona siguiente.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[13.3, 0, 13.4, 20, "Máx. 3x2"]], "p": [["p", 0.8, 10], ["p", 39.2, 10], ["a", 17, 5, "", 1], ["a", 20, 15], ["a", 24, 9], ["b", 19, 8], ["b", 22, 12], ["a", 30, 4], ["b", 33, 8], ["b", 32, 14]], "f": [["p", 17.6, 5.4, 23.4, 8.8], ["m", 22, 12, 23, 10], ["c", 24, 9, 28, 9]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs12", "s": "pri", "pr": "rp", "n": "Robo y pase al portero: 3x3 en media pista", "o": "Presionar tras pérdida y asegurar el primer pase después de robar.", "g": "Media pista con un portero a cada lado (sin portería, de pie en un cono). Dos equipos de 3. Punto al pasar al propio portero; si se pierde el balón, los tres presionan durante 5 segundos.", "c": "Al perder, el más cercano presiona y los otros cierran el pase; al robar, primer pase seguro.", "ser": "4 series de 3′", "d": {"w": 20, "h": 20, "p": [["p", 1, 10], ["p", 19, 10], ["a", 5, 6, "", 1], ["a", 8, 14], ["a", 12, 9], ["b", 7, 8], ["b", 11, 13], ["b", 14, 6]], "f": [["p", 5.6, 6.4, 11.6, 9], ["p", 12.6, 9.2, 18.4, 10]]}, "e": ["ini"], "mod": "sala"}, {"id": "fu38", "s": "pri", "pr": "pm", "n": "Posesión 5x5 con gol-pase en seis porterías de conos", "o": "Circular rápido y bascular en defensa según el balón.", "g": "Pista completa, 5x5. Hay 6 porterías de conos repartidas y orientadas en distintas direcciones. Es gol cada pase que atraviesa una portería y recibe un compañero, en cualquier sentido. Variantes: máximo dos toques; un comodín con el que el gol vale triple; solo vale de fuera hacia dentro.", "c": "Mueve el balón rápido de un lado a otro; el que recibe, ya colocado detrás de la portería; en defensa, juntos hacia el balón.", "ser": "3 series de 4′", "d": {"w": 40, "h": 20, "p": [["a", 5, 4, "", 1], ["a", 14, 16], ["a", 22, 6], ["a", 30, 14], ["a", 35, 5], ["b", 9, 6], ["b", 17, 12], ["b", 25, 9], ["b", 32, 10], ["b", 20, 17]], "f": [["p", 5.6, 4.6, 9.4, 3], ["p", 22.6, 6.4, 29.4, 13.6]], "k": [[8, 2], [11, 2], [18, 5], [18, 8], [6, 14], [9, 16], [26, 3], [26, 6], [33, 16], [36, 16], [28, 11], [31, 9]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs13", "s": "pri", "pr": "pf", "n": "1x1 + portero desde el ala", "o": "Encarar en el 1x1 y finalizar con el pie contrario al defensor.", "g": "Media pista con portero. El atacante sale desde el ala con balón; el defensor sale desde la línea de fondo cuando el atacante toca el balón. Se juega hasta gol, despeje o falta. Cambian de rol.", "c": "Ataca al defensor de frente y cambia el ritmo; tira cuanto antes, al palo largo.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19, 10], ["a", 3, 3, "", 1], ["b", 18, 4]], "f": [["c", 3, 3, 11, 6], ["m", 18, 4, 13, 6], ["p", 11.6, 6.4, 19, 9.4]]}, "e": ["ini"], "mod": "sala", "fin": 1}, {"id": "fs14", "s": "pri", "pr": "pa", "n": "2x1 + portero: pared y tiro", "o": "Superar al defensor con una pared y finalizar.", "g": "Media pista con portero. Dos atacantes contra un defensor que espera en la frontal. El que conduce pasa al compañero, que devuelve de primeras a la carrera para el tiro.", "c": "Conduce hacia el defensor para fijarlo; pase y arranca por su espalda; la devolución, al espacio.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19, 10], ["a", 3, 7, "", 1], ["a", 6, 14], ["b", 12, 9]], "f": [["c", 3, 7, 9, 8], ["p", 9.6, 8.4, 10, 13.4], ["m", 9, 8, 14, 7.5], ["p", 10.6, 13.6, 14, 8], ["p", 14.6, 7.8, 19, 9.4]]}, "e": ["ini"], "mod": "sala", "fin": 1}, {"id": "fu19", "s": "pri", "pr": "pa", "n": "2x2 + porteros en dos sectores", "o": "Superar al rival directo en su sector y aprovechar el pase al otro sector.", "g": "Media pista con dos porterías enfrentadas y porteros. Una línea imaginaria que une el centro de las porterías divide el espacio en dos sectores; en cada uno, un atacante contra un defensor que no pueden salir de él. El balón sí pasa libremente de un sector a otro.", "c": "Fija a tu defensor antes de pasar; si el compañero está libre, pásale; si no, encara.", "ser": "4 series de 2′", "d": {"w": 20, "h": 20, "g": [[0, 10.0, 3, "v"], [20, 10.0, 3, "v"]], "z": [[0, 0, 20, 10, ""]], "p": [["p", 0.8, 10], ["p", 19.2, 10], ["a", 6, 5, "", 1], ["b", 9, 6], ["a", 13, 15], ["b", 11, 13]], "f": [["c", 6, 5, 9, 3], ["p", 6.6, 5.4, 12.6, 14.6]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs15", "s": "pri", "pr": "pa", "n": "El pívot: recibir de espaldas, descargar y tirar", "o": "Usar al pívot de espaldas como apoyo para llegar al tiro.", "g": "Media pista con portero. El pívot, de espaldas a la portería con un defensor detrás, recibe del cierre y descarga de primeras al ala que llega; el ala tira. Variante: el pívot gira si el defensor no aprieta.", "c": "Pívot: cuerpo entre el rival y el balón, descarga de cara; ala: llega lanzado y tira a un toque.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19, 10], ["a", 2, 10, "", 1], ["a", 13, 10, "Pív"], ["b", 15, 10], ["a", 6, 3]], "f": [["p", 2.6, 10, 12.4, 10], ["m", 6, 3, 11, 6], ["p", 12.6, 9.6, 11, 6.6], ["p", 11.6, 6.4, 19, 9.4]]}, "e": ["ini"], "mod": "sala", "fin": 1}, {"id": "fu39", "s": "pri", "pr": "rp", "n": "Posesión 4x4 + comodín y ataque a la portería que diga el entrenador", "o": "Organizar la salida al contraataque al oír la señal y defenderlo replegando.", "g": "Pista completa. 4x4 + comodín de posesión en una franja central. El entrenador dice el nombre de un portero y el equipo con balón ataca esa portería; tiene que ocupar los pasillos y ganar el centro. El otro temporiza y repliega. Variantes: 4-5″ para finalizar; el comodín puede sumarse al ataque.", "c": "Al grito, uno conduce por el centro y los demás abren carriles; el que defiende retrasa y espera ayuda.", "ser": "4 series de 3′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[0, 3.5, 6, 13, ""], [34, 3.5, 6, 13, ""], [14, 0, 12, 20, "Posesión"]], "p": [["p", 0.8, 10], ["p", 39.2, 10], ["a", 17, 8, "", 1], ["a", 22, 4], ["a", 23, 15], ["a", 19, 13], ["b", 20, 7], ["b", 21, 11], ["b", 18, 16], ["b", 24, 9], ["c", 20, 2], ["e", 20, 19.6, "E"]], "f": [["c", 17, 8, 28, 9], ["m", 22, 4, 32, 5], ["m", 23, 15, 32, 14]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs16", "s": "pri", "pr": "pf", "n": "Conducción, control y tiro al segundo palo", "o": "Finalizar tras conducción buscando el segundo palo.", "g": "Media pista con portero y dos filas en las bandas. El primero conduce en diagonal, el segundo de la otra fila arranca a la vez hacia el segundo palo: pase raso atrás o tiro según la posición del portero.", "c": "Cabeza arriba al llegar a la frontal; el del segundo palo llega sin pararse; tiro raso.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19, 10], ["a", 2, 3, "", 1], ["a", 2, 17]], "f": [["c", 2, 3, 12, 8], ["m", 2, 17, 17, 13], ["p", 12.6, 8.4, 16.4, 12.6], ["p", 17, 13, 19, 10.8]]}, "e": ["ini"], "mod": "sala", "fin": 1}, {"id": "fu23", "s": "pri", "pr": "pf", "n": "Recibir de las esquinas y tirar de primeras con defensor", "o": "Desmarcarse del defensor para recibir y tirar de primeras.", "g": "Media pista con una portería en cada lado y porteros. Cuatro jugadores con balón en las esquinas. Dentro, un atacante y un defensor. El atacante tiene que recibir de cualquiera de las esquinas y tirar de primeras a una de las dos porterías.", "c": "Engaña al defensor antes de pedirla; cuerpo abierto a la portería; golpeo de primeras.", "ser": "4 series de 1′", "d": {"w": 20, "h": 20, "g": [[0, 10.0, 3, "v"], [20, 10.0, 3, "v"]], "z": [], "p": [["p", 0.8, 10], ["p", 19.2, 10], ["a", 0.6, 0.6, "", 1], ["a", 19.4, 0.6, "", 1], ["a", 0.6, 19.4, "", 1], ["a", 19.4, 19.4, "", 1], ["a", 10, 9], ["b", 9, 11]], "f": [["m", 10, 9, 13, 6], ["p", 18.8, 1.2, 13.4, 5.6], ["p", 13.4, 6.4, 19, 9]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs17", "s": "pri", "pr": "sb", "n": "3x2 + portero desde la salida del portero", "o": "Salir desde el portero y atacar en superioridad hasta finalizar.", "g": "Pista completa con porteros. El portero de un lado saca con la mano a uno de sus tres compañeros; atacan contra dos defensores y el portero contrario. Al terminar, los dos defensores salen con su portero contra un nuevo atacante.", "c": "Abre el campo al sacar; ataca al defensor para fijarlo; el tercero llega al segundo palo.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "m": "v", "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "z": [[0, 3.5, 6, 13, "Área"], [34, 3.5, 6, 13, "Área"]], "p": [["p", 1.2, 10, "", 1], ["a", 6, 3], ["a", 6, 17], ["a", 10, 10], ["b", 28, 8], ["b", 28, 12], ["p", 38.8, 10]], "f": [["p", 2, 9.6, 5.6, 3.6], ["c", 6, 3, 22, 5], ["m", 10, 10, 26, 10], ["m", 6, 17, 30, 16]]}, "e": ["ini"], "mod": "sala", "fin": 1}, {"id": "fu42", "s": "abp", "n": "Variantes de una jugada ensayada contra distintas defensas", "o": "Leer el tipo de defensa y elegir la variante de la jugada.", "g": "Espacio de 20x20 con porteros. Tres equipos de 4 (o tres de 3 con dos sacadores). Un equipo hace cinco saques seguidos con la misma jugada y sus variantes; el que defiende cambia entre zona, mixta e individual (por decisión propia o del entrenador). Rotan: ataque, descanso con comentarios y defensa.", "c": "Mira cómo se colocan antes de sacar; si te cambian la defensa, cambia la variante.", "ser": "3 turnos de 5 saques por equipo", "d": {"w": 20, "h": 20, "g": [[0, 10.0, 3, "v"], [20, 10.0, 3, "v"]], "z": [], "p": [["p", 0.8, 10], ["p", 19.2, 10], ["a", 19.4, 0.6, "", 1], ["a", 13, 5], ["a", 12, 11], ["a", 8, 8], ["b", 15, 6], ["b", 14, 11], ["b", 10, 9], ["b", 10, 15]], "f": [["p", 18.8, 1, 12.6, 10.4], ["m", 13, 5, 9, 4]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs18", "s": "pri", "pr": "rp", "n": "Contraataque 2x1 + portero tras robo", "o": "Atacar rápido después de robar el balón.", "g": "Pista completa. Un 1x1 en una mitad: si el defensor roba, sale con un compañero que espera en la banda en 2x1 contra el portero y un defensor que vuelve. Gol en menos de 8 segundos vale doble.", "c": "Al robar, cabeza arriba y pase adelante; el compañero arranca ya; ataca por los dos lados del defensor.", "ser": "3 series de 6 repeticiones", "d": {"w": 40, "h": 20, "m": "v", "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "z": [[0, 3.5, 6, 13, "Área"], [34, 3.5, 6, 13, "Área"]], "p": [["p", 1.2, 10], ["p", 38.8, 10], ["a", 10, 10, "", 1], ["b", 12, 10], ["a", 18, 2], ["b", 24, 12]], "f": [["c", 12, 10, 22, 10], ["m", 18, 2, 32, 5], ["p", 22.6, 9.6, 32, 5.6], ["m", 24, 12, 33, 10]]}, "e": ["ini"], "mod": "sala", "fin": 1}, {"id": "fu24", "s": "pri", "pr": "pa", "n": "2x2 con apoyos en zona neutral para pared y tiro", "o": "Combinar con un apoyo para quedar en situación de tiro.", "g": "Media pista. 2x2 dentro. El equipo con balón puede tirar directo o hacer pared con dos apoyos que están en la zona neutral (entre la línea de fondo y el borde del área), que siempre devuelven el balón con un máximo de dos toques.", "c": "Pasa al apoyo y arranca; la devolución, al espacio; tira en cuanto tengas ángulo.", "ser": "4 series de 2′", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19.2, 10], ["a", 9, 7, "", 1], ["a", 8, 13], ["b", 11, 9], ["b", 10, 14], ["c", 16.5, 3, "A"], ["c", 16.5, 17, "A"]], "f": [["p", 9.6, 6.8, 15.8, 3.4], ["m", 9, 7, 13, 5], ["p", 15.8, 3.8, 13.4, 5.6], ["p", 13.6, 5.4, 19, 9]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs19", "s": "pri", "pr": "ap", "n": "Llegada al segundo palo: pase raso desde el ala", "o": "Ganar la línea de fondo y dar el pase atrás al que llega.", "g": "Media pista con portero. El ala recibe en banda, conduce hasta cerca de la línea de fondo y da un pase raso atrás; dos compañeros llegan, uno al primer palo y otro al segundo. Un defensor en la variante.", "c": "Ala: gana la línea antes de pasar; rematadores: llegad cada uno a un palo, sin pararos.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 20,  del saque y repetir los movimientos de la jugada.", "g": "Espacio de 20x20, 3x3 con porteros y cuatro sacadores en las esquinas (dos por equipo). El entrenador señala al sacador, que saca para su equipo y canta una jugada ensayada. Cada equipo ataca siempre la misma portería. Los sacadores cambian por tiempos o son fijos si ya tienen ese rol.", "c": "Colócate según el perfil del sacador; los movimientos, a la vez; el defensor libre lee el pase.", "ser": "4 series de 3′", "d": {"w": 20, "h": 20, "g": [[0, 10.0, 3, "v"], [20, 10.0, 3, "v"]], "z": [], "p": [["p", 0.8, 10], ["p", 19.2, 10], ["a", 19.4, 0.6, "", 1], ["a", 19.4, 19.4], ["b", 0.6, 0.6], ["b", 0.6, 19.4], ["a", 14, 5], ["a", 13, 11], ["a", 9, 8], ["b", 15, 7], ["b", 14, 12], ["b", 11, 10]], "f": [["p", 18.8, 1, 9.6, 7.6], ["m", 14, 5, 16, 9]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs21", "s": "par", "pr": "sb", "n": "Partido 4x4 + porteros: salida con la mano", "o": "Iniciar el juego desde el portero buscando al compañero libre.", "g": "Pista completa, porteros. Tras cada parada o saque de meta, el portero saca con la mano a un compañero abierto; el rival no puede presionar dentro del área. La última serie, libre.", "c": "Ábrete al instante para recibir; si un lado está tapado, el portero saca al otro.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "m": "v", "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "z": [[0, 3.5, 6, 13, "Área"], [34, 3.5, 6, 13, "Área"]], "p": [["p", 1.2, 10], ["p", 38.8, 10], ["a", 10, 5, "", 1], ["a", 10, 15, "", 0], ["a", 16, 10, "", 0], ["a", 12, 10, "", 0], ["b", 30, 5], ["b", 30, 15], ["b", 24, 10], ["b", 28, 10]], "f": [["p", 2, 9.6, 9.5, 5.4]]}, "e": ["ini"], "mod": "sala"}, {"id": "fs22", "s": "par", "pr": "ap", "n": "Partido 4x4 + porteros con alas libres", "o": "Ocupar las bandas para abrir espacios por dentro.", "g": "Pista completa con dos pasillos de 2 m en las bandas donde
