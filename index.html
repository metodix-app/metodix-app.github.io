"]], "p": [["p", 1.2, 10], ["p", 38.8, 10], ["a", 10, 5, "", 1], ["a", 10, 15, "", 0], ["a", 16, 10, "", 0], ["b", 30, 5], ["b", 30, 15], ["b", 24, 10]], "f": []}, "e": ["ini"], "mod": "sala"}, {"id": "fu45", "s": "abp", "n": "Córner en primera y segunda jugada", "o": "Buscar la finalización en el saque y, si no sale, seguir en juego real.", "g": "3x3 con cuatro sacadores fijos en las esquinas; siempre que el balón sale, córner. El saque se juega como 2x2 con un defensor libre añadido y un atacante retrasado que solo entra si recibe y no puede tirar hasta combinar con un compañero. Si no hay tiro en la primera jugada, se sigue 3x3 en segunda jugada.", "c": "Primero, el remate de la jugada ensayada; si no hay, conserva y ataca en segunda jugada; en defensa, ajusta tras el saque.", "ser": "4 series de 3′", "d": {"w": 20, "h": 20, "g": [[0, 10.0, 3, "v"], [20, 10.0, 3, "v"]], "z": [], "p": [["p", 0.8, 10], ["p", 19.2, 10], ["c", 19.4, 0.6, "S", 1], ["a", 15, 5], ["a", 14, 10], ["a", 8, 10], ["b", 17, 6], ["b", 15, 12], ["b", 12, 8]], "f": [["p", 18.8, 1, 14.6, 9.6], ["m", 15, 5, 18, 8], ["p", 14, 10.6, 8.6, 10]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs24", "s": "par", "pr": "pm", "n": "Partido 4x4: todos tocan antes de tirar", "o": "Hacer participar a todos y moverse para recibir.", "g": "Pista completa, porteros. Para que el gol valga, todos los jugadores de campo del equipo tienen que haber tocado el balón en esa jugada. La última serie, libre.", "c": "Pasa y muévete; busca al compañero que aún no ha tocado.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "m": "v", "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "z": [[0, 3.5, 6, 13, "Área"], [34, 3.5, 6, 13, "Área"]], "p": [["p", 1.2, 10], ["p", 38.8, 10], ["a", 10, 5, "", 1], ["a", 10, 15, "", 0], ["a", 16, 10, "", 0], ["a", 12, 10, "", 0], ["b", 30, 5], ["b", 30, 15], ["b", 24, 10], ["b", 28, 10]], "f": []}, "e": ["ini"], "mod": "sala"}, {"id": "fu29", "s": "pri", "pr": "rp", "n": "Marcaje y cobertura: 2x2 para un rematador en zona", "o": "Coordinar marcaje y cobertura entre dos defensores.", "g": "Media pista. Dos atacantes intentan pasar a un compañero situado en una zona de 6x3 m en el borde del área; si recibe, tira. Dos defensores lo impiden con marcaje y cobertura. En la zona solo puede estar el que remata.", "c": "El que está cerca del balón presiona; el otro cubre y cierra el pase a la zona; cuanto más cerca de la portería, más marcaje.", "ser": "4 series de 6 repeticiones", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"], [11, 7, 3, 6, ""]], "p": [["p", 19.2, 10], ["a", 6, 6, "", 1], ["a", 6, 14], ["b", 9, 8], ["b", 10, 12], ["a", 13, 10]], "f": [["p", 6.6, 6.4, 12.4, 9.6], ["m", 10, 12, 11.4, 10.6]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs25", "s": "par", "pr": "pf", "n": "Partido 3x3 + porteros: control orientado", "o": "Recibir orientado hacia donde se quiere jugar.", "g": "Pista completa, porteros. Gol que llega tras un control orientado (el primer toque ya hacia delante o hacia el espacio libre) vale doble. La última serie, libre.", "c": "Mira antes de recibir; primer toque lejos del rival.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "m": "v", "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "z": [[0, 3.5, 6, 13, "Área"], [34, 3.5, 6, 13, "Área"]], "p": [["p", 1.2, 10], ["p", 38.8, 10], ["a", 10, 5, "", 1], ["a", 10, 15, "", 0], ["a", 16, 10, "", 0], ["b", 30, 5], ["b", 30, 15], ["b", 24, 10]], "f": []}, "e": ["ini"], "mod": "sala"}, {"id": "fu65", "s": "fis", "pr": "pf", "n": "Partido en toda la pista: a un toque o toques libres", "o": "Mejorar la resistencia aeróbica jugando y progresar para marcar.", "g": "Partido con todos en la pista completa. Si un jugador juega de primeras, el que recibe tiene toques libres; si no se cumple la regl pa", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "n": "Partido con pívot fijo", "o": "Usar al pívot como referencia para llegar al gol.", "g": "Pista con porteros. Cada equipo tiene un pívot que solo se mueve en el último tercio de ataque; el resto juega 3x2 cuando el balón llega a esa zona. Variante: el pívot no puede defender ni salir de su zona.", "c": "Busca al pívot cuando esté de cara; tras pasarle, llega para la descarga.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "m": "v", "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "z": [[26.7, 0, 13.3, 20, "Zona del pívot"], [0, 0, 13.3, 20, ""]], "p": [["p", 1.2, 10], ["p", 38.8, 10], ["a", 12, 10, "", 1], ["a", 18, 5], ["a", 18, 15], ["a", 33, 10, "Pív"], ["b", 30, 10], ["b", 24, 7], ["b", 24, 13], ["b", 7, 10, "Pív"]], "f": [["p", 12.6, 10, 32.4, 10], ["m", 18, 5, 30, 6], ["p", 33, 9.4, 30.6, 6.4]]}, "e": ["ini"], "mod": "sala"}, {"id": "fs41", "s": "pri", "pr": "pm", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "n": "3x3 con marcaje individual: apoyos en paralela y diagonal", "o": "Dar apoyos en paralela, en diagonal y en triángulo para desmarcarse.", "g": "Zona de 28x20 m con porterías en el borde del área y porteros. 3x3 con marcaje al hombre. Progresión 1: un comodín en cada banda que se suma al ataque (4x3). Progresión 2: 4x4 en el que el equipo sin balón solo defiende en su campo.", "c": "Si te marcan de cerca, desmárcate al espacio; apoyo en paralela por la banda o en diagonal por dentro.", "ser": "3 series de 4′", "d": {"w": 28, "h": 20, "p": [["p", 1.2, 10], ["p", 26.8, 10], ["a", 7, 5, "", 1], ["a", 12, 15], ["a", 18, 8], ["b", 9, 6], ["b", 13, 13.5], ["b", 19, 9.5], ["c", 14, 0.5], ["c", 14, 19.5]], "f": [["p", 7.6, 5.4, 11.6, 14.4], ["m", 18, 8, 21, 5], ["p", 12.6, 15, 20.6, 5.4]], "g": [[0, 10, 3, "v"], [28, 10, 3, "v"]]}, "e": ["ini"], "mod": "sala", "fin": 1}, {"id": "fu48", "s": "por", "n": "Portero: desvío con la pierna a ras de suelo con pantalla", "o": "Reaccionar tarde a un balón raso y desviarlo con la pierna (paso de valla).", "g": "El portero, un poco adelantado. A 2-3 m, una pantalla que le tapa la visión. El entrenador envía balones a ras de suelo, avisando o no, y el portero los desvía con la pierna. Variante: el mismo trabajo desviando con la mano con caída lateral, o con balones de goma a distintas alturas.", "c": "Posición baja y peso hacia delante; pierna rápida al balón; recupera la posición.", "ser": "3 series de 8 balones", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["e", 10, 10, "E", 1]], "f": [["p", 10, 9.2, 12, 1.6]], "k": [[9, 4], [11, 4]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu71", "s": "fis", "n": "Fuerza específica: semisentadilla, saltos, sprint y 1xP", "o": "Pasar de la fuerza general a la específica con velocidad y finalización.", "g": "Pista completa. Cada jugador hace 6 semisentadillas, 3 saltos verticales, un sprint de 20-25 m y, tras recibir el saque del portero, controla y termina en 1xP en la otra portería. Variantes: otros grupos musculares; cambiar los saltos por vallas bajas o escalera; hacerlo a la vez por las dos bandas.", "c": "Técnica correcta en la sentadilla; transferencia rápida; control orientado y tiro.", "ser": "5 series de 4 repeticiones", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [], "p": [["p", 0.8, 10], ["p", 39.2, 10, "", 1], ["a", 4, 3]], "f": [["m", 4, 3, 28, 4], ["p", 38.4, 9.6, 28.6, 4.4], ["c", 28, 4.6, 34, 8]], "k": [[8, 3], [10, 3]]}, "e": ["per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs42", "s": "act", "pr": "rp", "src": "Basado en X. Palau (EFDeportes), ejercicios de fútbol sala", "n": "1x1 desde el suelo con miniporterías", "o": "Reaccionar rápido y resolver el 1x1.", "g": "Media pista con dos miniporterías. Dos jugadores sentados de espaldas; a la señal se giran y disputan un balón a 5 m. El que lo gana ataca una miniportería y el otro defiende. Gana el primero que marque 5.", "c": "Gírate por el lado del balón; el primero en llegar protege con el cuerpo.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 16, "p": [["a", 9, 10], ["b", 11, 10], ["e", 10, 15.5, "E", 1]], "f": [["p", 10, 14.8, 10, 5.6], ["m", 9, 10, 9.5, 6], ["m", 11, 10, 10.5, 6.5]], "g": [[0, 8, 2, "v", 1], [20, 8, 2, "v", 1]]}, "e": ["ini"], "mod": "sala"}, {"id": "fs43", "s": "act", "pr": "pf", "src": "Basado en X. Palau (EFDeportes), ejercicios de fútbol sala", "n": "Relevos con conducción y giro", "o": "Conducir rápido y girar con el balón controlado.", "g": "Filas de 3-4 jugadores en la línea de fondo. Cada uno conduce hasta un cono a mitad de pista, gira con la suela y vuelve para entregar el balón al siguiente. Gana la fila que termina antes.", "c": "Conducción con toques cortos; giro con la suela, sin pasarte del cono.", "ser": "3 series de 6 recorridos por fila", "d": {"w": 20, "h": 12, "p": [["a", 1, 3, "", 1], ["a", 0, 3], ["a", 1, 9, "", 1], ["b", 0, 9]], "f": [["c", 1.6, 3, 15, 3], ["c", 15, 3.8, 2, 4.2], ["c", 1.6, 9, 15, 9]], "k": [[16, 3], [16, 9]]}, "e": ["ini"], "mod": "sala"}, {"id": "fu49", "s": "por", "n": "Portero: desvío orientado con caída lateral desde sentado", "o": "Caer de lado y desviar el balón hacia una dirección concreta.", "g": "Dos porterías enfrentadas: una en su sitio y otra en la línea de 6 m, cada una con un portero. Un tercer portero, sentado en el centro del área. Desde un lado, el entrenador le lanza con el pie balones rasos o a media altura y él cae de lado y los desvía hacia una de las porterías para «marcar». Variantes: porterías más pequeñas; empezar de pie.", "c": "Cae de lado, no de espaldas; mano firme detrás del balón; orienta el desvío.", "ser": "3 series de 8 balones", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"], [10, 6, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["p", 10, 6.8], ["p", 13, 3.5], ["e", 19, 3.5, "E", 1]], "f": [["p", 18.2, 3.5, 13.8, 3.5]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs44", "s": "act", "pr": "rp", "src": "Basado en X. Palau (EFDeportes), ejercicios de fútbol sala", "n": "Robo y depósito de balones", "o": "Robar y proteger el balón a máxima intensidad.", "g": "Media pista con dos zonas de conos (una por equipo). Un equipo intenta llevar balones conduciendo a su zona; el otro intenta robarlos y llevarlos a la suya. Cada balón depositado es un punto.", "c": "Protege con el cuerpo; al robar, sal rápido hacia tu zona.", "ser": "10 repeticiones de 30″ (pausa 30″)", "d": {"w": 20, "h": 20, "p": [["a", 6, 8, "", 1], ["a", 12, 12, "", 1], ["b", 8, 9], ["b", 13, 10], ["a", 15, 5, "", 1], ["b", 5, 15]], "f": [["c", 6, 8, 2, 5], ["m", 13, 10, 12.5, 11.5], ["c", 15, 5, 18, 15]], "z": [[0, 0, 4, 8, "A"], [16, 12, 4, 8, "B"]]}, "e": ["ini"], "mod": "sala"}, {"id": "fs53", "s": "pri", "pr": "sb", "n": "Superar la presión: tres pases antes de buscar al pívot", "o": "Salir de la presión en el propio campo para conectar con el pívot.", "g": "Pista completa, 4x4 con porteros, cada equipo en 3-1: tres contra tres en un campo y el pívot contra su marcador en el otro. El portero saca en corto a un compañero de su campo; los tres tienen que encadenar tres pases antes de buscar al pívot. Si el equipo pierde el balón, empieza el portero rival.", "c": "Los pívots se mueven para abrir líneas de pase; usa todo el ancho y el largo para superar la presión; bloqueos para liberar al compañero.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[0, 3.5, 6, 13, ""], [34, 3.5, 6, 13, ""]], "p": [["p", 0.8, 10, "", 1], ["p", 39.2, 10], ["a", 6, 4], ["a", 6, 16], ["a", 14, 10], ["b", 9, 6], ["b", 9, 14], ["b", 16, 9], ["a", 31, 9, "P"], ["b", 29, 10]], "f": [["p", 1.6, 10.4, 5.6, 15.4], ["p", 6.6, 15.6, 13.6, 10.6], ["p", 14.4, 9.6, 6.6, 4.4], ["p", 6.6, 4, 30.4, 8.6]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fs45", "s": "act", "pr": "rp", "src": "Basado en X. Palau (EFDeportes), ejercicios de fútbol sala", "n": "Pillar balones en espacio reducido", "o": "Proteger el balón en conducción y reaccionar ante un rival.", "g": "Cuadrado de 15x15 m. La mitad conduce con balón y la otra mitad está quieta sin balón. A la señal, cada uno de los quietos intenta sacar del cuadrado el balón del que tenga más cerca. Se cambian los papeles.", "c": "Cabeza arriba; cambia de dirección lejos del que te persigue.", "ser": "4 series de 30″", "d": {"w": 15, "h": 15, "p": [["a", 3, 3, "", 1], ["a", 11, 4, "", 1], ["a", 7, 11, "", 1], ["b", 5, 6], ["b", 10, 8], ["b", 4, 12]], "f": [["m", 5, 6, 4, 4], ["m", 10, 8, 11, 5], ["c", 7, 11, 9, 13]]}, "e": ["ini"], "mod": "sala"}, {"id": "fu51", "s": "por", "n": "Portero: controlar, conducir y defender un 1xP", "o": "Jugar con el pie y defender a continuación un uno contra portero.", "g": "El entrenador lanza un balón por alto; el portero sale, lo controla y conduce hasta el borde del área. Entonces el entrenador señala a uno de los dos jugadores de los lados; el portero le pasa y vuelve para defender su 1xP. Se puede limitar al primer tiro o seguir hasta gol o fuera.", "c": "Control orientado hacia fuera; pase y vuelve rápido; ante el 1x1, reduce el ángulo sin tirarte antes de tiempo.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["e", 10, 10, "E"], ["a", 3, 10], ["a", 17, 10]], "f": [["p", 10, 9.2, 10, 3.2], ["c", 10, 1.8, 10, 6], ["p", 10.6, 6.4, 16.4, 9.6]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs46", "s": "pri", "pr": "sb", "src": "Basado en X. Palau (EFDeportes), ejercicios de fútbol sala", "n": "Portero a portero", "o": "Progresar con el balón hasta el portero contrario y conservarlo bajo presión.", "g": "Cuadrado de 20x20 m con un portero en cada lado. Dos equipos de 4. Un equipo puntúa si consigue pasar el balón al portero contrario; el otro, conservándolo. A los 3 minutos se cambian los papeles.", "c": "Ataca el espacio hacia delante; si no hay pase, conserva y busca el otro lado.", "ser": "4 series de 3′", "d": {"w": 20, "h": 20, "p": [["p", 1, 10], ["p", 19, 10], ["a", 5, 5, "", 1], ["a", 5, 15], ["a", 10, 10], ["a", 14, 6], ["b", 8, 7], ["b", 12, 9], ["b", 9, 14], ["b", 15, 12]], "f": [["p", 5.6, 5.4, 9.4, 9.6], ["p", 10.6, 10, 13.6, 6.4], ["p", 14.6, 6.4, 18.4, 9.6]]}, "e": ["ini"], "mod": "sala"}, {"id": "fs54", "s": "pri", "pr": "ap", "n": "Crear ocasiones en el último tercio: pista en cuartos", "o": "Desordenar al rival en las dos últimas zonas y llegar al remate.", "g": "Pista dividida en cuartos. 2x2 en las zonas 3 y 4; la zona 1 queda libre hasta que el rival recupera y ataca. El portero del equipo atacante pasa a un compañero de la zona 3; cuando el balón llega a la 4, los de la zona 3 pueden entrar. Si se pierde o hay remate o parada, ataca el otro equipo, que no puede rematar hasta que el portero esté en su sitio. Variante: el portero se suma al ataque (portero-jugador).", "c": "Sal de tu posición para arrastrar al rival; fuerza el 1x1 para dejarlo atrás; apóyate en el pívot; ataca el segundo palo.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[10, 0, 10, 20, "4"], [20, 0, 10, 20, "3"]], "p": [["p", 0.8, 10], ["p", 39.2, 10, "", 1], ["a", 26, 6], ["a", 26, 14], ["b", 24, 8], ["b", 24, 12], ["a", 13, 7], ["a", 12, 13], ["b", 15, 9], ["b", 14, 12]], "f": [["p", 38.4, 10.4, 26.6, 13.6], ["p", 25.4, 13.6, 13.6, 7.4], ["m", 26, 6, 17, 5]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fs47", "s": "pri", "pr": "pm", "src": "Basado en X. Palau (EFDeportes), ejercicios de fútbol sala", "n": "Conservación con relevos por pasillos", "o": "Conservar el balón y encontrar a los compañeros de los pasillos.", "g": "Cuadrado de 20x20 m con pasillos laterales de 2 m. Dos equipos de 5: 3 dentro y 2 en los pasillos. Punto al conectar con un compañero de pasillo, que entra y releva al que le pasó. Máximo 3 toques dentro y no se roba en los pasillos.", "c": "Busca al del pasillo con el pase tenso; el que sale del cuadrado ocupa el pasillo al momento.", "ser": "3 series de 4′", "d": {"w": 24, "h": 20, "p": [["a", 2.5, 1, "", 0], ["a", 21.5, 19], ["a", 8, 6, "", 1], ["a", 14, 12], ["a", 10, 15], ["b", 11, 8], ["b", 16, 9], ["b", 8, 12], ["b", 2.5, 19], ["b", 21.5, 1]], "f": [["p", 8.6, 6.4, 13.6, 11.6], ["p", 14.6, 12.4, 21, 18.6]], "z": [[0, 0, 4, 20, "Pasillo"], [20, 0, 4, 20, "Pasillo"]]}, "e": ["ini"], "mod": "sala"}, {"id": "fu52", "s": "por", "n": "Portero: 1xP sin saber quién remata", "o": "Leer quién va a rematar y salir a defenderlo.", "g": "Tres jugadores con balón (centro y bandas) conducen desde 10 m hacia la portería. Al llegar al área, dos se paran y uno sigue para rematar; el portero no sabe quién será. Variante: salen más atrás y en 9 m el que iba a finalizar pasa a un compañero; los dos atacan y el tercero defiende la inferioridad con el portero.", "c": "Espera atento sin decidir antes de tiempo; sal cuando sepas quién sigue; cierra el palo corto.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["a", 4, 12, "", 1], ["a", 10, 13, "", 1], ["a", 16, 12, "", 1]], "f": [["c", 4, 12, 6, 7.5], ["c", 10, 13, 10, 6.5], ["c", 16, 12, 14, 7.5]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs48", "s": "pri", "pr": "pf", "src": "Basado en X. Palau (EFDeportes), ejercicios de fútbol sala", "n": "Conservar y finalizar a la señal", "o": "Pasar de conservar a finalizar en 1x1 con portero.", "g": "Media pista con portero. Dos grupos de 4 se pasan el balón. Al oír «¡ya!», el que tiene el balón ataca la portería en 1x1 contra el portero. La señal puede darse por número de toques, por tiempo o al azar.", "c": "Recibe siempre orientado hacia la portería; a la señal, conduce y tira sin pararte.", "ser": "3 series de 4′", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19, 10], ["a", 4, 4, "", 1], ["a", 4, 16], ["a", 9, 10], ["b", 7, 7], ["b", 7, 13], ["e", 2, 10, "E"]], "f": [["p", 4.6, 4.4, 8.6, 9.6], ["c", 9, 10, 15, 10], ["p", 15.6, 10, 19, 10]]}, "e": ["ini"], "mod": "sala", "fin": 1}, {"id": "fs49", "s": "pri", "pr": "rp", "src": "Basado en X. Palau (EFDeportes), ejercicios de fútbol sala", "n": "Disputa del balón central, 3 pases y ataque", "o": "Ganar el balón, asegurar la posesión y atacar.", "g": "Media pista con portero. Dos equipos de 4 en los extremos. A la señal salen a por un balón en el centro; el que lo gana tiene que dar 3 pases seguidos antes de atacar la portería. Si el otro roba, puede atacar directo.", "c": "El más rápido va al balón y los demás se abren; tras robar, a portería.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19, 10], ["a", 2, 4], ["a", 2, 10], ["a", 2, 16], ["b", 14, 4], ["b", 14, 16], ["e", 8, 1, "E"]], "f": [["m", 2, 10, 7.5, 10], ["m", 14, 4, 8.5, 9.5]], "k": [[8, 10]]}, "e": ["ini"], "mod": "sala", "fin": 1}, {"id": "fu53", "s": "por", "n": "Portero: pase y desvío en doble acción", "o": "Jugar con el pie y reaccionar enseguida a un tiro.", "g": "El portero en el centro de la portería. Se desplaza a un lado y el entrenador le pasa raso: lo devuelve al primer toque. Luego se desplaza al otro lado y actúa sobre un tiro cuya trayectoria no conoce, con la mano o con la pierna.", "c": "Pase limpio al primer toque; después, apoyos rápidos y de cara al tirador.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["e", 10, 9, "E", 1]], "f": [["m", 10, 1.2, 7.5, 1.4], ["p", 10, 8.2, 7.8, 2], ["p", 10.2, 8.2, 12.4, 1.4]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs56", "s": "pri", "pr": "rp", "n": "Superioridad al contragolpe: dos en el centro y 3x1 en las zonas", "o": "Aprovechar la superioridad en el contraataque y llegar con varios al remate.", "g": "Pista en tres partes iguales con porteros. Dos atacantes en la zona central; en cada zona de gol, tres defensores y un atacante. Los del centro se pasan en diagonal, eligen portería y buscan a su compañero de esa zona; si conectan, entran y juegan 3x3. Variante: al pasar a una zona, el atacante de la zona contraria se suma y hacen 4x3. Si el que defiende recupera, contraataca.", "c": "Pásate en diagonal para ver los dos lados; el de la zona de gol da profundidad y amplitud; ataca rápido.", "ser": "4 series de 4′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[13.3, 0, 13.4, 20, ""]], "p": [["p", 0.8, 10], ["p", 39.2, 10], ["a", 18, 7, "", 1], ["a", 22, 13], ["a", 31, 10], ["b", 29, 6], ["b", 29, 14], ["b", 34, 10], ["a", 8, 10], ["b", 10, 6], ["b", 10, 14], ["b", 5, 10]], "f": [["p", 18.6, 7.4, 21.4, 12.6], ["p", 22.6, 12.8, 30.4, 10.4], ["m", 18, 7, 30, 4], ["m", 8, 10, 22, 16]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fu01", "s": "pri", "pr": "pm", "n": "Posesión con un balón en el pie y otro en la mano", "o": "Conservar el balón mirando a todo el espacio y tomando decisiones sencillas.", "g": "Espacio de 20x20 m. Dos equipos iguales (si sobra uno, comodín del que ataca). Se juega con un balón en el pie, a dos toques o libre. Además, cada equipo tiene un balón en la mano que se pasan entre ellos: quien lo lleva no juega con el pie, no defiende y solo puede dar tres pasos. Si el balón de la mano cae al suelo, pierde la posesión.", "c": "Cabeza arriba para ver los dos balones; ofrece siempre una línea de pase; el de la mano también tiene que moverse para recibir.", "ser": "3 series de 4′", "d": {"w": 20, "h": 20, "p": [["a", 4, 4, "", 1], ["a", 10, 15], ["a", 16, 6], ["a", 6, 11, "M"], ["a", 15, 15], ["b", 9, 7], ["b", 13, 10], ["b", 5, 16], ["b", 17, 3, "M"], ["b", 12, 4]], "f": [["p", 4.6, 4.6, 9.6, 14.4], ["m", 16, 6, 17, 10], ["p", 6.6, 11, 14.4, 14.6]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu08", "s": "pri", "pr": "rp", "n": "Marcaje: 1x1 en los carriles y 2x2 con hombres exteriores", "o": "Aprender a marcar antes y después de que el rival reciba el balón.", "g": "Pista dividida en tres espacios: dos de 10x20 y uno central de 20x20. En los de 10x20, 1x1: el atacante recibe siempre del jugador exterior y quiere llegar con el balón controlado a la otra línea; el defensor intenta evitar que reciba o que progrese. Si recupera, pasa al exterior y ataca él. En el central, 2x2 con un hombre exterior por equipo; a mitad de la tarea, los dos atacantes tienen que tocar antes de llegar a la línea. Se rotan exteriores e interiores.", "c": "Vigila al atacante y al balón a la vez; distancia para reaccionar; cuando recibe, cierra su camino hacia la línea.", "ser": "3 series de 4′ por espacio", "d": {"w": 40, "h": 20, "p": [["a", 5, 12], ["b", 5, 9], ["c", 5, 0.6, "X", 1], ["a", 17, 13], ["a", 23, 12], ["b", 18, 10], ["b", 22, 9], ["c", 20, 0.6, "X", 1], ["c", 20, 19.4, "X"], ["a", 35, 12], ["b", 35, 9], ["c", 35, 0.6, "X", 1]], "f": [["p", 5, 1.2, 5, 11.4], ["m", 5, 12, 5, 18], ["p", 20, 1.2, 17.4, 12.4]], "z": [[0, 0, 10, 20, "1x1"], [30, 0, 10, 20, "1x1"]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu54", "s": "por", "n": "Portero: reacción ante dos lanzamientos seguidos", "o": "Reaccionar al primer balón que llega y, si da tiempo, también al segundo.", "g": "El portero, un poco adelantado sobre la línea. El entrenador lanza dos balones o pelotas casi seguidos, con distinta velocidad, para que lleguen casi a la vez; el portero actúa sobre el primero. Variante: más tiempo entre ellos para que actúe sobre los dos, decidiendo cuál llega antes.", "c": "Decide rápido cuál llega primero; acción corta y vuelve a estar listo.", "ser": "3 series de 8 repeticiones", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["e", 9, 10, "E", 1], ["e", 11, 10, "", 1]], "f": [["p", 9, 9.2, 8, 1.6], ["p", 11, 9.2, 12.2, 1.6]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu11", "s": "rue", "pr": "pm", "n": "Rueda de pase por fuera de un rectángulo", "o": "Orientar el control hacia donde va el siguiente pase.", "g": "Rectángulo de unos 15x12 m con dos o tres jugadores en cada esquina. El balón circula por fuera del rectángulo a dos toques (por ejemplo, en el sentido del reloj). El que pasa sigue al balón y se queda detrás del compañero al que se la dio. Variante: cambiar de sentido.", "c": "Control orientado hacia el siguiente compañero; pase tenso y al pie bueno; sigue tu pase.", "ser": "3 series de 3′ (una en cada sentido)", "d": {"w": 15, "h": 12, "p": [["a", 0.8, 0.8, "", 1], ["a", 14.2, 0.8], ["a", 14.2, 11.2], ["a", 0.8, 11.2], ["a", 0.8, 2.6], ["a", 14.2, 2.6]], "f": [["p", 1.6, 0.8, 13.4, 0.8], ["m", 0.8, 1.6, 12.6, 1.6], ["p", 14.2, 1.6, 14.2, 10.4], ["p", 13.4, 11.2, 1.6, 11.2]], "k": [[0, 0], [15, 0], [15, 12], [0, 12]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs57", "s": "pri", "pr": "rp", "n": "Ataque y contraataque: de 2 atacantes a 4x3", "o": "Atacar en superioridad tras elegir portería y defender el contraataque.", "g": "Pista en tres partes. Dos atacantes se pasan el balón en el tercio central hasta elegir portería; pueden pasar directo a la zona de gol o conducir hasta ella y empezar un 3x3. Cuando entran, el atacante de la otra zona de gol se suma y se hace un 4x3. Si los defensores recuperan, contraatacan, pero uno tiene que cruzar el tercio central conduciendo. Se rota a los equipos. Variantes: 4x1 o 4x2 en las zonas de gol; empezar en media pista.", "c": "Comunicación; pases hacia delante; circula y guarda el balón hasta tener la superioridad.", "ser": "4 series de 4′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[13.3, 0, 13.4, 20, ""]], "p": [["p", 0.8, 10], ["p", 39.2, 10], ["a", 18, 8, "", 1], ["a", 22, 12], ["a", 31, 10], ["b", 29, 7], ["b", 30, 13], ["b", 35, 10], ["a", 7, 10], ["b", 9, 6], ["b", 9, 14], ["b", 4, 10]], "f": [["c", 18, 8, 27, 8], ["p", 22.6, 12, 30.4, 10.4], ["m", 7, 10, 20, 17]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fu12", "s": "act", "n": "Pases en pareja avanzando entre conos", "o": "Pasar con precisión en movimiento a uno o dos toques.", "g": "Parejas separadas 8-10 m que salen de la línea de fondo y avanzan hasta el otro lado pasándose el balón entre una fila de conos, a uno o dos toques. Vuelta por fuera.", "c": "Pase por delante del compañero, a la carrera; control hacia delante; mira al compañero antes de pasar.", "ser": "3 series de 4 viajes", "d": {"w": 40, "h": 12, "p": [["a", 1, 2, "", 1], ["a", 1, 10]], "f": [["p", 2, 2.4, 8, 9.6], ["m", 1, 10, 8, 10], ["p", 8.6, 9.6, 15, 2.4], ["m", 1, 2, 15, 2], ["p", 15.6, 2.4, 22, 9.6]], "k": [[5, 6], [12, 6], [19, 6], [26, 6], [33, 6]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu55", "s": "por", "n": "Portero: lanzamiento entre tres posibles tiradores", "o": "Reaccionar ante un tiro sin saber quién lo hará.", "g": "El portero en la portería. A 9-10 m, dos o tres jugadores con balón. El entrenador, detrás de la portería, señala quién tira; todos hacen el gesto de tirar para que el portero no lo sepa. Para más dificultad, después tiran también los demás seguidos.", "c": "Posición base equilibrada; no te muevas con el amago; vuelve a colocarte tras cada parada.", "ser": "3 series de 8 tiros", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["a", 5, 10, "", 1], ["a", 10, 11, "", 1], ["a", 15, 10, "", 1]], "f": [["p", 5.6, 9.4, 8.6, 1.4]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu13", "s": "pri", "pr": "ap", "n": "4x4 con zonas de llegada en los fondos", "o": "Pasar al compañero que entra en la zona de llegada.", "g": "Pista completa con dos zonas en los fondos (los últimos 6 m) donde no pueden entrar los defensores. Es punto si el equipo con balón pasa a un compañero que entra en esa zona y la recibe allí. Los atacantes solo pisan la zona para entrar y recibir.", "c": "Atrae al rival y busca el pase a la espalda; el que entra, en el momento justo, no antes.", "ser": "3 series de 4′", "d": {"w": 40, "h": 20, "p": [["a", 14, 8, "", 1], ["a", 20, 14], ["a", 26, 6], ["a", 30, 13], ["b", 17, 10], ["b", 24, 11], ["b", 28, 8], ["b", 31, 15]], "f": [["p", 14.6, 8.2, 25.4, 6.2], ["m", 30, 13, 36, 12], ["p", 26.6, 6.4, 36, 11.6]], "z": [[0, 0, 6, 20, "Llegada"], [34, 0, 6, 20, "Llegada"]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs58", "s": "pri", "pr": "ap", "n": "4x4 con portero-jugador", "o": "Aprovechar la superioridad numérica del portero-jugador.", "g": "Algo más de media pista con una portería en cada extremo. 4x4 más porteros: la portera-jugadora (o un jugador de campo) empieza la jugada y su equipo construye para rematar. Solo se reinicia cuando el balón sale. Variante: cambiar al portero por un jugador de campo.", "c": "Busca crear 2x1; mueve el balón rápido para desordenar la defensa; cabeza arriba para ver quién queda libre; paciencia.", "ser": "4 series de 3′", "d": {"w": 24, "h": 20, "g": [[0, 10.0, 3, "v"], [24, 10.0, 3, "v"]], "z": [], "p": [["p", 0.8, 10], ["p", 23.2, 10], ["a", 8, 10, "PJ", 1], ["a", 13, 4], ["a", 13, 16], ["a", 18, 8], ["b", 12, 7], ["b", 12, 13], ["b", 17, 10], ["b", 19, 14]], "f": [["p", 8.6, 9.6, 12.6, 4.6], ["p", 13.6, 4.4, 17.6, 7.6], ["p", 8.6, 10.4, 12.6, 15.4]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fu14", "s": "pri", "pr": "pm", "n": "Puertas de conos: punto por pase a través de una puerta", "o": "Pasar y recibir con precisión en un espacio con muchas opciones.", "g": "Dos equipos en toda la pista. Hay varias puertas de conos repartidas, más que jugadores de cada equipo. Es punto cuando el balón pasa por una puerta y lo recibe un compañero al otro lado.", "c": "Busca la puerta libre; el que recibe se coloca detrás de la puerta antes del pase.", "ser": "3 series de 4′", "d": {"w": 40, "h": 20, "p": [["a", 7, 6, "", 1], ["a", 12, 3], ["a", 25, 14], ["a", 30, 6], ["b", 10, 8], ["b", 20, 10], ["b", 27, 9], ["b", 14, 15]], "f": [["p", 7.6, 6, 12, 3.6], ["m", 25, 14, 22, 16]], "k": [[9, 4], [9, 6], [18, 4], [18, 6], [6, 14], [6, 16], [21, 13], [21, 15], [30, 15], [32, 15], [34, 4], [34, 6]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu63", "s": "fis", "n": "4x4 con dos comodines exteriores por equipo", "o": "Trabajar la resistencia aeróbica jugando, con desplazamientos de futsal.", "g": "Media pista. 4x4 dentro con dos comodines exteriores por equipo, toques libres. Cada vez que un jugador conecta con su comodín exterior, cambian los papeles: el comodín entra y el jugador ocupa su sitio fuera. Variante: todos a dos toques.", "c": "Después del pase al exterior, sal rápido a ocupar su sitio; ritmo constante.", "ser": "1-2 series de 8-12′", "d": {"w": 20, "h": 20, "p": [["a", 5, 6, "", 1], ["a", 12, 4], ["a", 9, 14], ["a", 15, 12], ["b", 8, 8], ["b", 13, 8], ["b", 6, 12], ["b", 14, 15], ["c", 0.6, 10, "A"], ["c", 19.4, 10, "A"], ["c", 10, 0.6, "R"], ["c", 10, 19.4, "R"]], "f": [["p", 5.6, 6.4, 1.2, 9.6], ["m", 5, 6, 1.4, 8]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu15", "s": "act", "n": "Conducción por el perímetro y por dentro a la señal", "o": "Conducir con soltura, cambios de dirección y de ritmo.", "g": "Cada jugador con balón conduce por las líneas del perímetro de la pista. A la señal del entrenador, entran a conducir libres por dentro con cambios de dirección y de ritmo. A la siguiente señal, vuelven al perímetro.", "c": "Toques suaves, balón cerca del pie; pasos cortos; cabeza arriba para no chocar.", "ser": "3 series de 2′", "d": {"w": 40, "h": 20, "p": [["a", 1, 1, "", 1], ["a", 20, 0.8, "", 1], ["a", 39, 8, "", 1], ["a", 30, 19.2, "", 1], ["a", 8, 19.2, "", 1], ["a", 15, 9, "", 1], ["a", 25, 12, "", 1], ["e", 20, 10, "E"]], "f": [["c", 2, 1, 10, 1], ["c", 39, 9, 39, 15], ["c", 15, 9, 19, 6], ["c", 25, 12, 30, 9]]}, "e": ["ini"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu16", "s": "pri", "pr": "pf", "n": "Carrera al cono, conducción y tiro con defensor detrás", "o": "Conducir rápido con la cabeza levantada mientras te persiguen.", "g": "Atacante y defensor salen desde la línea de fondo hacia un cono cerca del medio campo; el defensor sale un metro por detrás. Junto al cono hay un balón: el atacante lo coge, conduce hacia la portería y finaliza; el defensor intenta recuperarlo.", "c": "Pasos cortos y rápidos; protege el balón con el cuerpo; cabeza arriba para ver el portero.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19.2, 10], ["a", 1, 7], ["b", 0.6, 9], ["a", 10, 6, "", 1]], "f": [["m", 1, 7, 9.4, 6.2], ["m", 0.6, 9, 8.6, 7.4], ["c", 10, 6, 16, 9]], "k": [[10, 5.2]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs59", "s": "pri", "pr": "pa", "n": "Sistema 3-1: 4x3 apoyándose en el pívot", "o": "Usar al pívot para aguantar el balón, combinar o rematar.", "g": "Pista completa con porteros; cada mitad dividida en tercios. En los dos tercios de una mitad, 3 atacantes contra 3 defensores; en el último tercio, el pívot, para hacer 4x3. El pívot rival espera en el último tercio de la otra mitad. El portero defensor saca con la mano a un atacante y el equipo avanza jugando con el pívot. Si los defensores recuperan, el juego pasa a la otra mitad con los papeles cambiados. Variantes: un defensor acompaña al pívot (4x4); el pívot puede salir de su tercio; se juega en las dos porterías.", "c": "El pívot se perfila para girarse o descargar; el jugador más atrasado cubre los contraataques; si el pívot baja, ocupa su sitio.", "ser": "4 series de 4′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[26.7, 0, 13.3, 20, ""]], "p": [["p", 0.8, 10], ["p", 39.2, 10, "", 1], ["a", 31, 10, "P"], ["b", 28, 10], ["a", 24, 5], ["a", 24, 15], ["a", 18, 10], ["b", 22, 7], ["b", 22, 13], ["b", 16, 13], ["b", 9, 10, "P"]], "f": [["p", 38.4, 10.4, 24.6, 14.6], ["p", 24.6, 14.4, 30.4, 10.6], ["m", 18, 10, 26, 8]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fu64", "s": "fis", "n": "Circuito técnico de seis postas", "o": "Trabajar la resistencia aeróbica con técnica específica.", "g": "Pista completa. Circuito por parejas, 1′30″ en cada posta (hacen falta dos ayudantes en las postas 3 y 5): 1) control tras saque del portero y conducción entre conos; 2) habilidad sin que caiga el balón; 3) pase al pívot y tiro; 4) conducción de espaldas con la suela; 5) pases con el interior a un toque y regate al final; 6) conducción con la suela, elevación y 1xP.", "c": "Calidad en cada gesto aunque llegue el cansancio; cambia rápido de posta.", "ser": "1-2 vueltas (1′30″ por posta)", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [], "p": [["p", 0.8, 10], ["p", 39.2, 10], ["a", 4, 3, "1", 1], ["a", 14, 3, "2", 1], ["a", 26, 3, "3", 1], ["a", 30, 16, "4", 1], ["a", 18, 16, "5", 1], ["a", 8, 16, "6", 1]], "f": [["c", 4.8, 3, 10, 3], ["p", 26.6, 3.4, 33, 8], ["c", 30, 16, 24, 16]], "k": [[6, 3], [8, 3], [20, 16], [22, 16]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fu17", "s": "act", "n": "Puertas de conos: punto conduciendo a través de una puerta", "o": "Conducir, proteger y orientarse buscando espacios libres.", "g": "Dos equipos en la pista con varias puertas de conos, más que jugadores de cada equipo. Un equipo suma un punto cuando uno de sus jugadores atraviesa una puerta conduciendo el balón.", "c": "Levanta la cabeza para encontrar la puerta libre; cambia de ritmo al pasar; protege el balón con el cuerpo.", "ser": "3 series de 3′", "d": {"w": 40, "h": 20, "p": [["a", 7, 5, "", 1], ["a", 24, 13], ["a", 30, 5], ["b", 10, 7], ["b", 26, 11], ["b", 15, 15]], "f": [["c", 7, 5, 9, 2]], "k": [[9, 1], [9, 3], [18, 4], [18, 6], [6, 14], [6, 16], [21, 13], [21, 15], [32, 15], [34, 15], [34, 4], [34, 6]]}, "e": ["ini"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu18", "s": "pri", "pr": "pf", "n": "1x1 tras el saque del portero", "o": "Ganar el balón y superar al rival en el uno contra uno.", "g": "Media pista. El portero saca el balón hacia el centro y dos jugadores salen a la vez desde los postes de la portería. El que lo gana ataca y el otro defiende; el atacante intenta regatear y tirar. Variantes: salir sentados, tumbados boca abajo o boca arriba. Se puede hacer a la vez en las dos porterías.", "c": "Ataca rápido al balón; encara al defensor y regatea hacia su pie adelantado; tira en cuanto lo superes.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19.2, 10, "", 1], ["a", 19, 8.2], ["b", 19, 11.8], ["a", 19.6, 4], ["a", 19.6, 5.4], ["b", 19.6, 15], ["b", 19.6, 16.4]], "f": [["p", 18.4, 10, 8, 10], ["m", 18.4, 8.2, 9, 9.2], ["m", 18.4, 11.8, 9, 10.8]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs50", "s": "pri", "pr": "pm", "n": "Posesión 5x4: el último en pasar sale", "o": "Conservar el balón en superioridad y buscar pases hacia delante.", "g": "Media pista, dos equipos de 5 contando a los porteros. Posesión 5x4: el equipo con balón siempre tiene uno más. Cuando se pierde, el que dio el último pase sale y entra uno del otro equipo. Variantes: los porteros a un toque; nadie más de un toque; 5x5 sin límite de toques; el equipo sin balón es el que tiene uno más.", "c": "Con uno más, paciencia y pase al libre; ofrécete siempre; prioridad al pase hacia delante.", "ser": "3 series de 4′", "d": {"w": 20, "h": 20, "p": [["a", 3, 4, "", 1], ["a", 10, 2], ["a", 17, 6], ["a", 6, 15], ["a", 15, 16], ["b", 7, 6], ["b", 12, 7], ["b", 9, 12], ["b", 14, 12]], "f": [["p", 3.6, 4.2, 9.4, 2.4], ["p", 10.6, 2.6, 16.4, 6], ["m", 6, 15, 4, 10]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA"}, {"id": "fu20", "s": "pri", "pr": "pf", "n": "Tres 1x1 a la vez en media pista", "o": "Regatear y proteger el balón con poco espacio y mucho tráfico.", "g": "Media pista con porteros. Tres parejas juegan a la vez un 1x1, cada pareja con su balón. Cada atacante intenta superar a su defensor y marcar; cuando hay gol o recupera, se cambian los papeles.", "c": "Cambia de ritmo y de dirección; protege con el cuerpo; mira el portero antes de tirar.", "ser": "4 series de 1′30″", "d": {"w": 20, "h": 20, "g": [[0, 10.0, 3, "v"], [20, 10.0, 3, "v"]], "z": [], "p": [["p", 0.8, 10], ["p", 19.2, 10], ["a", 6, 5, "", 1], ["b", 8, 6], ["a", 12, 11, "", 1], ["b", 10, 12], ["a", 7, 16, "", 1], ["b", 9, 15]], "f": [["c", 6, 5, 10, 3], ["c", 12, 11, 16, 9], ["c", 7, 16, 4, 12]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs60", "s": "pri", "pr": "rp", "n": "Presionar en inferioridad: tres equipos y ataque 4-0", "o": "Presionar con uno menos y evitar que el rival genere superioridades.", "g": "Pista completa con tres equipos de 5 (4 de campo y un portero). Dos equipos juegan ataque contra defensa; el que ataca, en 4-0. Uno de los defensores no puede salir de su campo. Empieza el portero que ataca. Solo se cruza el medio campo conduciendo, no con pases. Si el balón sale o hay gol, sale el equipo que defendía (o el que marcó) y entra el tercero. Variantes: el defensa central sube al primer pase del rival; el último defensor sale desde el círculo central y queda libre al segundo pase.", "c": "Sube la intensidad cuando hay opciones de robar; decide dónde presionar y si hay marca individual; presiona con el cuerpo equilibrado.", "ser": "4 series de 4′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [], "p": [["p", 0.8, 10], ["p", 39.2, 10, "", 1], ["a", 32, 3], ["a", 32, 17], ["a", 28, 7], ["a", 28, 13], ["b", 26, 5], ["b", 25, 11], ["b", 22, 15], ["b", 14, 10]], "f": [["p", 38.4, 10.4, 28.6, 12.6], ["m", 26, 5, 28.6, 6.4], ["m", 25, 11, 27.4, 12.4]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fu21", "s": "act", "n": "Tiro de precisión a portería dividida en cuatro", "o": "Tirar con precisión a una zona concreta de la portería.", "g": "Portería dividida en cuatro partes (dos arriba y dos abajo) con una cinta. Serie de tiros a balón parado desde 10 m, diciendo antes a qué zona se tira. Variante: tirar con el balón en movimiento.", "c": "Mira la zona antes de golpear; pie de apoyo al lado del balón; precisión antes que fuerza.", "ser": "3 series de 6 tiros", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19.2, 10], ["a", 10, 10, "", 1], ["a", 7, 9], ["a", 7, 11], ["a", 6, 10]], "f": [["p", 10.6, 10, 19.4, 8.6]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs51", "s": "pri", "pr": "ap", "n": "Pase y direccionalidad: 2x2 en las zonas de gol y 1x1 + comodín", "o": "Dar amplitud y profundidad para que el balón progrese de zona en zona.", "g": "Pista completa en tres zonas, con una central de 10 m. En cada zona de los extremos, 2x2 con portero; en la central, 1x1 más un comodín que juega con el que tiene el balón. Se empieza con saque de banda con el pie desde la zona central y solo se reinicia cuando el balón sale. Solo pasa el balón de una zona a otra; los jugadores no salen de su zona. Variante: un jugador más puede sumarse al ataque en la zona de gol y hacer un 3x2.", "c": "Aléjate del compañero con balón para dar líneas de pase; pases tensos; el comodín rota mucho.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[15, 0, 10, 20, ""]], "p": [["p", 0.8, 10], ["p", 39.2, 10], ["a", 20, 0.6, "", 1], ["c", 20, 10], ["a", 17, 15], ["b", 22, 13], ["a", 27, 5], ["a", 32, 14], ["b", 30, 8], ["b", 34, 11], ["a", 8, 6], ["a", 7, 14], ["b", 10, 9], ["b", 5, 11]], "f": [["p", 20, 1.2, 20, 9.2], ["p", 20.6, 10.2, 26.4, 5.4], ["m", 32, 14, 35, 12]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fu22", "s": "act", "n": "Pase diagonal desde el córner y tiro de primeras", "o": "Tirar de primeras tras un pase en diagonal.", "g": "Media pista con portero. Cuatro grupos: dos en los córneres del fondo y dos en las bandas a la altura del medio campo. El jugador del córner pasa en diagonal al compañero de la banda contraria, que tira de primeras (o tras una conducción corta). Se rotan los grupos.", "c": "Perfílate antes de recibir; golpea de primeras al palo largo; sigue el tiro por si hay rechace.", "ser": "3 series de 8 tiros", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19.2, 10], ["a", 19.4, 0.6, "", 1], ["a", 19.4, 19.4, "", 1], ["a", 1, 2], ["a", 1, 18]], "f": [["p", 18.6, 1.2, 2, 17.4], ["m", 1, 18, 6, 15], ["p", 6.4, 14.8, 19, 8.6]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs61", "s": "pri", "pr": "rp", "n": "Temporizar, dirigir y tapar: 4x3 con comodín defensivo", "o": "Retrasar el ataque rival y llevarlo hacia donde queremos.", "g": "Tres cuartos de pista con una portería en cada línea de 6 m y porteros. Tres equipos de 3. Dentro, 3x3 más un comodín que siempre defiende (4x3 a favor de la defensa). El tercer equipo espera fuera, en la línea del medio: dos en una banda y uno en la otra. Un portero pasa a uno de los de la banda y su equipo ataca la portería contraria. Al acabar, el equipo que defendía se coloca en el medio y pasa a atacar, y el que esperaba fuera defiende.", "c": "Temporiza los pases del rival; presiona al que conduce y cubre a tu compañero; tras robar, cambia rápido el chip.", "ser": "4 series de 4′", "d": {"w": 30, "h": 20, "g": [[0, 10.0, 3, "v"], [30, 10.0, 3, "v"]], "z": [], "p": [["p", 0.8, 10], ["p", 29.2, 10, "", 1], ["a", 15, 0.6, "", 1], ["a", 15, 19.4], ["a", 13, 19.4], ["b", 20, 7], ["b", 21, 13], ["b", 25, 10], ["c", 18, 10, "D"], ["b", 10, 19.4], ["b", 8, 0.6]], "f": [["p", 28.4, 9.6, 15.4, 1.2], ["c", 15, 1.2, 19, 4], ["m", 15, 19.4, 19, 15]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fu25", "s": "rue", "pr": "pm", "n": "Desmarque para recibir en zona despejada", "o": "Moverse para que el poseedor te vea y te pueda pasar.", "g": "Por toda la pista, grupos de cuatro con un balón: dos jugadores en cada banda, enfrentados. El que va a recibir se mueve para dejarse ver claramente («zona despejada») y recibe del compañero; luego empieza él la secuencia hacia el otro lado.", "c": "Muévete hacia donde el poseedor te vea; pide el balón con la mano; recibe perfilado.", "ser": "3 series de 3′", "d": {"w": 20, "h": 12, "p": [["a", 2, 1, "", 1], ["a", 6, 2], ["a", 2, 11], ["a", 6, 10]], "f": [["m", 6, 2, 9, 4], ["p", 2.6, 1.4, 8.6, 4], ["p", 9, 4.6, 2.6, 10.4]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs52", "s": "pri", "pr": "pm", "n": "3x2 en el centro para llegar al pívot de la zona de gol", "o": "Progresar con pases en superioridad hasta el pívot.", "g": "Media pista en tres zonas: una de gol junto a cada línea (a 2 m de la línea de meta y a 3 m de la línea de centro) y una central de unos 18 m. En cada zona de gol, un portero y un pívot. En el centro, 3x2: el que tiene balón siempre juega con uno más (el otro equipo deja a uno fuera, que entra al recuperar). Todos tienen que tocar antes de pasar a la zona de gol. Si roba el rival, pasa a tener la superioridad. Variantes: el pívot puede devolver y se sigue atacando; los porteros juegan en la zona central.", "c": "Cuida el balón; prioridad al pase hacia delante; con uno más, fija y pasa al libre.", "ser": "3 series de 5′", "d": {"w": 20, "h": 20, "z": [[0, 0, 2, 20, ""], [17, 0, 3, 20, ""]], "p": [["p", 0.6, 10], ["a", 1.4, 14, "P"], ["p", 19.4, 10], ["b", 18.4, 6, "P"], ["a", 6, 6, "", 1], ["a", 11, 14], ["a", 13, 6], ["b", 9, 8], ["b", 12, 11], ["b", 1, 19.4]], "f": [["p", 6.6, 6.4, 10.4, 13.6], ["p", 11.6, 13.6, 12.6, 6.6], ["p", 13.4, 6.2, 18, 6]], "g": [[0, 10, 3, "v"], [20, 10, 3, "v"]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA"}, {"id": "fu26", "s": "rue", "pr": "pm", "n": "Rondo 3x1 en dos sectores: recibir en el sector vacío", "o": "Desmarcarse para recibir y dar continuidad con un apoyo.", "g": "Rectángulo de unos 8x4 m dividido en dos sectores. Tres contra uno. Los dos del sector A pasan al compañero del sector B, que se tiene que mostrar para recibir. Luego uno del sector A va a jugar con el que ha recibido en el B. Al principio, el defensor solo puede ocupar la línea que divide los sectores; después, libre.", "c": "El que espera en el sector vacío se mueve para que haya línea de pase; el que va a ayudar llega a tiempo.", "ser": "4 series de 2′", "d": {"w": 8, "h": 4, "p": [["a", 1, 1, "", 1], ["a", 1.5, 3], ["a", 6.5, 2], ["b", 4, 2]], "f": [["p", 1.6, 1.2, 6, 1.6], ["m", 1.5, 3, 5.6, 3.2]], "z": [[4, 0, 4, 4, "B"]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu30", "s": "pri", "pr": "pa", "n": "2x2 + porteros en 28x15", "o": "Decidir bien en el juego de dos, en ataque y en defensa.", "g": "Espacio de 28x15 con porterías y porteros. 2x2. Cuando el balón sale, lo pone en juego el portero del equipo al que le toca sacar. Las parejas cambian cada 2′. Variantes: ampliar a 28x20; toques libres hasta el primer gol, luego 3, luego 2 y después 1 toque (2 al recuperar).", "c": "Juega con el compañero: pared, paralela o cruce; en defensa, uno presiona y el otro ayuda.", "ser": "4 series de 2′", "d": {"w": 28, "h": 15, "g": [[0, 7.5, 3, "v"], [28, 7.5, 3, "v"]], "z": [], "p": [["p", 0.8, 7.5], ["p", 27.2, 7.5], ["a", 9, 5, "", 1], ["a", 12, 11], ["b", 13, 6], ["b", 16, 10]], "f": [["p", 9.6, 5.4, 11.6, 10.4], ["m", 9, 5, 17, 3], ["p", 12.6, 10.6, 17, 4]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs62", "s": "pri", "pr": "rp", "n": "Defensa en bloque medio: 5x5 en cuartos", "o": "Impedir que el rival avance con el balón presionando en las zonas centrales.", "g": "Pista completa dividida en cuartos, 5x5 contando porteros. Empieza el portero que ataca. Dos atacantes salen sin oposición en la zona de inicio y los otros dos se colocan donde quieran. Los defensores solo pueden moverse por las dos zonas centrales; solo retroceden si el rival consigue avanzar hasta su mitad. Si recuperan, se cambian los papeles y se reinicia desde el extremo opuesto. Variante: al recuperar, atacar directamente.", "c": "Presiona al que lleva el balón por las bandas; intuye hacia dónde va el juego; presiona al que va a recibir.", "ser": "4 series de 4′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[10, 0, 20, 20, "Defensa"]], "p": [["p", 0.8, 10, "", 1], ["p", 39.2, 10], ["a", 4, 5], ["a", 4, 15], ["a", 17, 4], ["a", 25, 14], ["b", 13, 7], ["b", 14, 13], ["b", 22, 9], ["b", 25, 12]], "f": [["p", 1.6, 10.4, 3.6, 14.4], ["m", 13, 7, 11, 8], ["m", 14, 13, 8, 14]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fu31", "s": "par", "pr": "pa", "n": "3x3 + porteros en 28x20 con un equipo esperando", "o": "Usar paredes, paralelas y triángulos en el juego de tres.", "g": "Espacio de 28x20 con porteros. 3x3; el tercer equipo espera fuera y entra cada 2′ por uno de los que juegan. Cuando sale el balón, saca el portero. Variantes: toques decrecientes según los goles; no se puede devolver al que te la dio (salvo para finalizar).", "c": "Forma triángulos; después de pasar, muévete; si no puedes devolver, busca al tercero.", "ser": "3 rondas de 2′ por equipo", "d": {"w": 28, "h": 20, "g": [[0, 10.0, 3, "v"], [28, 10.0, 3, "v"]], "z": [], "p": [["p", 0.8, 10], ["p", 27.2, 10], ["a", 8, 6, "", 1], ["a", 10, 14], ["a", 15, 9], ["b", 12, 7], ["b", 14, 13], ["b", 18, 10], ["c", 14, 19.4], ["c", 16, 19.4], ["c", 12, 19.4]], "f": [["p", 8.6, 6.4, 14.4, 8.8], ["p", 15.6, 9.2, 10.6, 13.6], ["m", 8, 6, 19, 4]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA", "fin": 1}, {"id": "fs55", "s": "pri", "pr": "sb", "n": "Jugar por los tres tercios: 2x2, 1x1 + neutral y 2x2", "o": "Avanzar jugando por los tres tercios y aprovechar el 4x3 del centro.", "g": "Pista en tercios. 2x2 en los dos extremos y 1x1 más un neutral (siempre con el que ataca) en el centro. El portero saca en corto al tercio defensivo; se avanza al centro con pase o conducción, donde se forma un 4x3. Si se marca, el mismo equipo sigue con el balón y ataca en el otro sentido desde la portería donde marcó. Variantes: neutral a un toque; el portero tiene 4″ para sacar; el resto del centro a un toque; intercambiar posiciones entre zonas; toques libres.", "c": "Finta para engañar al defensor y abrir líneas de pase; mantén el balón en movimiento; prioriza los pases hacia delante.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[13.3, 0, 13.4, 20, ""]], "p": [["p", 0.8, 10, "", 1], ["p", 39.2, 10], ["a", 7, 5], ["a", 7, 15], ["b", 10, 7], ["b", 10, 13], ["a", 20, 6], ["b", 19, 10], ["c", 21, 14], ["a", 31, 7], ["a", 31, 14], ["b", 28, 9], ["b", 29, 13]], "f": [["p", 1.6, 10.4, 6.6, 14.4], ["c", 7, 15, 13, 15], ["p", 13.6, 14.6, 20.4, 14]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fu46", "s": "por", "n": "Portero: desplazamiento lateral y desvío con las manos", "o": "Desplazarse en la portería y desviar balones altos con las manos.", "g": "El portero, un poco adelantado sobre la línea de gol. El entrenador lanza balones de goma por alto o con bote. Primero de lado a lado de forma alterna y después sin que el portero sepa hacia dónde.", "c": "Pasos laterales cortos sin cruzar las piernas; manos firmes y hacia fuera; vuelve rápido al centro.", "ser": "3 series de 8 lanzamientos", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["e", 10, 9, "E", 1]], "f": [["p", 10, 8.2, 12.6, 1.4]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu47", "s": "por", "n": "Portero: blocaje y desvío con el balón en las manos", "o": "Blocar y agarrar el balón tras un desplazamiento y reaccionar al siguiente lanzamiento.", "g": "El portero en el centro de la portería. Frente a cada poste, un jugador con balones; en el centro del área, el entrenador con pelotas de tenis. El portero se desplaza a un lado y bloca el balón que le envían con el pie (a media altura o sin saber dónde). Sin soltarlo, se desplaza al otro lado y desvía, golpeando con el balón que tiene en las manos, una pelota de tenis del entrenador. Después, al lado contrario.", "c": "Bloca con las manos en forma de W; no sueltes el balón; desplazamiento corto y rápido.", "ser": "3 series de 6 repeticiones", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["a", 6, 8, "", 1], ["a", 14, 8, "", 1], ["e", 10, 6, "E"]], "f": [["p", 6.4, 7.4, 8.6, 1.6], ["p", 10, 5.2, 11.6, 1.4]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs65", "s": "pri", "pr": "sb", "n": "Usar al pívot para superar la presión en tres zonas", "o": "Progresar por zonas apoyándose en el pívot.", "g": "Pista en tercios. En la zona 1, 3x3 más el portero; en la zona 2, 1x1 (el pívot y su marcador); en la 3, solo el portero rival. El portero atacante saca en corto o directamente al pívot. En la zona 2 el pívot solo sirve de apoyo y tiene que combinar con los compañeros que suben antes de pasar a la zona 3, donde puede marcar cualquiera. Si se pierde, el rival ataca la otra portería.", "c": "Orientación corporal para ver toda la pista; abre líneas de pase; el pívot protege el balón y juega de espaldas.", "ser": "3 series de 5′", "d": {"w": 40, "h": 20, "g": [[0, 10, 3, "v"], [40, 10, 3, "v"]], "m": "v", "z": [[13.3, 0, 13.4, 20, "2"]], "p": [["p", 0.8, 10, "", 1], ["p", 39.2, 10], ["a", 5, 4], ["a", 5, 16], ["a", 10, 10], ["b", 7, 6], ["b", 8, 13], ["b", 12, 8], ["a", 19, 10, "P"], ["b", 17, 11]], "f": [["p", 1.6, 9.6, 18.4, 9.6], ["p", 19.6, 10.2, 9.4, 15.6], ["m", 5, 16, 22, 15]]}, "e": ["ini", "des", "per"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fs63", "s": "pri", "pr": "rp", "n": "Defender en rombo 1-2-1 con bloque bajo", "o": "Obligar al rival a jugar en largo y lejos de la portería.", "g": "Pista completa con porteros. 4x4 ataque contra defensa en una mitad; el que defiende se coloca en rombo 1-2-1. Empieza el atacante más cercano a su portería y su equipo quiere avanzar y marcar; la defensa evita las ocasiones. Si marcan o pierden, los equipos se cambian los papeles y se juega en la otra mitad.", "c": "Presiona al que recibe nada más recibir; si el atacante conduce, no retrocedas hacia la portería; intuye sus movimientos.", "ser": "4 series de 4′", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19.2, 10], ["a", 3, 10, "", 1], ["a", 6, 3], ["a", 6, 17], ["a", 13, 10], ["b", 9, 10], ["b", 13, 6], ["b", 13, 14], ["b", 16, 10]], "f": [["p", 3.6, 9.6, 5.6, 3.6], ["m", 13, 6, 9, 4], ["m", 9, 10, 8, 7]]}, "e": ["ini", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA", "fin": 1}, {"id": "fu50", "s": "por", "n": "Portero: desvío a distintas alturas con raqueta", "o": "Ajustar la acción (mano o pie) a la altura del balón.", "g": "El portero, un poco adelantado sobre la línea. A 9-10 m, el entrenador lanza con raqueta pelotas de tenis a distintas alturas, y el portero las desvía según la trayectoria.", "c": "Mira la pelota desde que sale de la raqueta; decide rápido mano o pie; vuelve a la posición base.", "ser": "3 series de 10 pelotas", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["e", 10, 10, "E", 1]], "f": [["p", 10, 9.2, 7.6, 1.4], ["p", 10, 9.2, 12.4, 1.6]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fu56", "s": "por", "n": "Portero: saque con la mano y 1xP", "o": "Sacar con la mano con precisión y defender el 1xP si interceptan.", "g": "Pista de 20x20 con dos porterías. En cada mitad, un jugador sin balón que no puede entrar en su campo defensivo y está atento al saque del portero. Si recibe, hace 1xP; si el rival intercepta el saque, es él quien hace el 1xP. Progresión: dos jugadores por equipo más porteros.", "c": "Saca rápido y al pie o al espacio del compañero; si interceptan, sal a reducir el ángulo.", "ser": "4 series de 6 saques", "d": {"w": 20, "h": 20, "g": [[0, 10.0, 3, "v"], [20, 10.0, 3, "v"]], "z": [], "p": [["p", 0.8, 10, "", 1], ["p", 19.2, 10], ["a", 13, 8], ["b", 7, 12]], "f": [["p", 1.6, 10, 12.4, 8.4], ["m", 7, 12, 12, 9]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs68", "s": "por", "n": "Portero: blocar y dar continuidad al juego", "o": "Desplazarse, detener el tiro y poner el balón en juego enseguida.", "g": "Pista completa con una portería en cada extremo. Línea de conos a 9 m de una portería y un cono a 5 m de cada poste. Tres porteros: uno en portería y dos al lado con balón; seis atacantes en fila detrás de la línea de 9 m. El portero se desplaza de cono a cono; mientras, otro portero pasa raso al primer atacante, que remata de primeras desde detrás de la línea o controla, avanza y tiene 3″ para un 1x1. Si hay rechace, dos toques más. Al acabar, los porteros rotan. Variantes: el portero que bloca marca en la otra portería con un saque con el pie; o lanza un contraataque en largo al último de la fila.", "c": "Lee el cuerpo del atacante para decidir si sales; si ya has salido, frena antes del 1x1; bloca y saca rápido.", "ser": "3 series de 6 acciones por portero", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"]], "p": [["p", 10, 1.2], ["p", 13, 0.6, "", 1], ["p", 15, 0.6], ["a", 10, 10], ["a", 10, 11.4], ["a", 10, 12.8]], "f": [["m", 10, 1.2, 6, 5], ["p", 12.6, 1.2, 10, 9.2], ["p", 10.4, 9.2, 8, 1.4]], "k": [[6, 5], [14, 5], [4, 9], [7, 9], [13, 9], [16, 9]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA"}, {"id": "fs64", "s": "pri", "pr": "rp", "n": "Presión en bloque bajo a partir del pase a banda", "o": "Activar la presión cuando el balón va a la banda.", "g": "Pista completa con porteros, 4x4 ataque contra defensa en una mitad. El portero defensor saca hacia el portero atacante, que avanza hasta la línea del medio y pasa a uno de los dos jugadores de banda: ese pase activa la presión. Si los defensores recuperan, el balón vuelve al portero atacante y se cambian los papeles. Tras parada o gol, el que atacaba retrocede y el otro ataca la portería contraria (sin contraataques).", "c": "Sube la intensidad cuando el balón va a la banda; centro de gravedad bajo al presionar; acorrala al de banda.", "ser": "4 series de 4′", "d": {"w": 20, "h": 20, "g": [[20, 10, 3, "v"]], "z": [[14, 3.5, 6, 13, "Área"]], "p": [["p", 19.2, 10], s.", "g": "Espacio de 15x20 con portería, línea de 9 m y dos zonas de banda de 5 m. Una pareja de atacantes en cada zona central y en cada banda, 1 m detrás de la línea. Cuatro porteros. Un portero saca raso a uno de los del centro, que remata de primeras. Si el portero bloca, pasa raso a uno de banda, que puede tirar o pasar al compañero de la otra banda para que remate en el segundo palo. Variantes: conos junto a la línea de meta a cada lado con un atacante; el portero elige a quién sacar.", "c": "No encojas los brazos ante el remate; aguanta de pie; cubre la portería y ajusta tu posición a cada pase.", "ser": "3 series de 6 acciones por portero", "d": {"w": 20, "h": 15, "g": [[10, 0, 3, "h"]], "z": [[3.5, 0, 13, 6, "Área"], [0, 9, 5, 6, ""], [15, 9, 5, 6, ""]], "p": [["p", 10, 1.2], ["p", 13, 0.6, "", 1], ["a", 3, 10], ["a", 3, 11.4], ["a", 8, 10], ["a", 12, 10], ["a", 17, 10], ["a", 17, 11.4]], "f": [["p", 12.6, 1.2, 8.2, 9.2], ["p", 8.4, 9.2, 9, 1.6], ["p", 9.6, 1.6, 16.6, 9.4]], "k": [[5, 9], [15, 9]]}, "e": ["ini", "des", "per", "ren"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de futsal de la FIFA"}, {"id": "fu59", "s": "act", "n": "Técnica en tríos con 2x1", "o": "Pasar y controlar con un defensor y empezar el trabajo de 2x1.", "g": "Media pista. Grupos de tres en movimiento: dos atacan y uno defiende. Pases, habilidades y 2x1. Variante: limitar los toques de los atacantes.", "c": "El de balón fija al defensor; el compañero se separa para tener línea de pase.", "ser": "1 serie de 3-5′", "d": {"w": 20, "h": 20, "p": [["a", 5, 5, "", 1], ["a", 10, 9], ["b", 8, 5], ["a", 12, 14, "", 1], ["a", 17, 16], ["b", 15, 13]], "f": [["p", 5.6, 5.4, 9.4, 8.6], ["c", 12, 14, 14, 16]]}, "e": ["ini", "des"], "mod": "sala", "src": "Basado en el Manual de entrenamiento de fútbol sala de la UEFA"}, {"id": "fs66", "s": "pri", "pr": "pa", "n": "Sistema 2-2: situaciones de 1x1", "o": "Ganar los duelos individuales usando todo el ancho y el largo.", "g": "Media p /* ================= CONEXIÓN CON SUPABASE (web propia) =================
   Cuando la plataforma NO se abre dentro de Claude, los datos se guardan en Supabase.
   Este bloque imita la base de datos de Claude (doc/collection/onSnapshot/set/delete)
   para que el resto del programa funcione igual. Los permisos los decide Supabase
   (ver supabase/esquema.sql): cada entrenador solo ve lo suyo y coordinación lo ve todo. */

function sbDb(sb, club){
  var cache = {}, colL = [], docL = [];
  function parent(p){ return p.slice(0, p.lastIndexOf('/')); }
  function last(p){ return p.slice(p.lastIndexOf('/') + 1); }
  function fireDoc(l){ var d = cache[l.p]; l.cb({exists: d !== undefined, data: function(){ return d; }}); }
  function fireCol(l){
    var docs = Object.keys(cache).filter(function(k){ return parent(k) === l.p; })
      .map(function(k){ return {id: last(k), data: function(){ return cache[k]; }}; });
    l.cb({docs: docs});
  }
  function emit(p){
    docL.forEach(function(l){ if(l.p === p) fireDoc(l); });
    colL.forEach(function(l){ if(parent(p) === l.p) fireCol(l); });
  }
  var loaded = (async function(){
    var from = 0;
    for(;;){
      var r = await sb.from('docs').select('path,data').eq('club_id', club).range(from, from + 999);
      if(r.error) throw r.error;
      r.data.forEach(function(x){ cache[x.path] = x.data; });
      if(r.data.length < 1000) break;
      from += 1000;
    }
  })();
  sb.channel('docs-' + club)
    .on('postgres_changes', {event: '*', schema: 'public', table: 'docs', filter: 'club_id=eq.' + club}, function(ev){
      if(ev.eventType === 'DELETE'){ var p = ev.old && ev.old.path; if(p && p in cache){ delete cache[p]; emit(p); } }
      else if(ev.new && ev.new.path){ cache[ev.new.path] = ev.new.data; emit(ev.new.path); }
    })
    .subscribe();
  function listen(list, l, fire){
    list.push(l);
    loaded.then(function(){ fire(l); }, function(e){ if(l.err) l.err(e); });
    return function(){ var i = list.indexOf(l); if(i >= 0) list.splice(i, 1); };
  }
  async function put(p, d){
    var r = await sb.from('docs').upsert({club_id: club, path: p, data: d, updated_at: new Date().toISOString()});
    if(r.error) throw r.error;
    cache[p] = d; emit(p);
  }
  async function del(p){
    var r = await sb.from('docs').delete().eq('club_id', club).eq('path', p);
    if(r.error) throw r.error;
    delete cache[p]; emit(p);
  }
  function doc(p){
    return {
      onSnapshot: function(cb, err){ return listen(docL, {p: p, cb: cb, err: err}, fireDoc); },
      set: function(d){ return put(p, d); },
      delete: function(){ return del(p); }
    };
  }
  function collection(p){
    return {
      onSnapshot: function(cb, err){ return listen(colL, {p: p, cb: cb, err: err}, fireCol); },
      doc: function(i){ return doc(p + '/' + i); }
    };
  }
  return {doc: doc, collection: collection};
}

function sbUser(sb, uid){
  return {
    isOwner: async function(){ return CUENTA && CUENTA.rol === 'coord'; },
    id: async function(){ return uid; },
    can: async function(){ return true; },
    profiles: async function(ids){
      var r = await sb.from('miembros').select('user_id,nombre').in('user_id', ids);
      var o = {}; (r.data || []).forEach(function(x){ o[x.user_id] = {name: x.nombre}; });
      return o;
    }
  };
}

var sbDownloads = {
  save: async function(o){
    var blob = o.data instanceof Blob ? o.data : new Blob([o.data], {type: 'application/json'});
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = o.filename; document.body.appendChild(a); a.click(); a.remove();

  }
};

/* Colores: tema general de Metodix (azul Asturias, rojo Gijón y blanco) y tema de cada club */
function mezcla(hex, con, t){ var a = parseInt(hex.slice(1), 16), b = parseInt(con.slice(1), 16);
  var r = Math.round(((a>>16)&255)*(1-t) + ((b>>16)&255)*t), g = Math.round(((a>>8)&255)*(1-t) + ((b>>8)&255)*t), bl = Math.round((a&255)*(1-t) + (b&255)*t);
  return '#' + ((1<<24) + (r<<16) + (g<<8) + bl).toString(16).slice(1); }
function oscuro(hex){ var n = parseInt(hex.slice(1), 16); return (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255)) < 150; }
function aplicaTema(c1, c2, stripe){
  var r = document.documentElement.style;
  r.setProperty('--green', c1); r.setProperty('--green-deep', mezcla(c1, '#000000', .2)); r.setProperty('--green-soft', mezcla(c1, '#ffffff', .88));
  r.setProperty('--sky', c2); r.setProperty('--sky-deep', mezcla(c2, '#000000', .25)); r.setProperty('--sky-soft', mezcla(c2, '#ffffff', .86));
  r.setProperty('--ok', c1); r.setProperty('--ok-soft', mezcla(c1, '#ffffff', .88));
  r.setProperty('--on-green', oscuro(c1) ? '#fff' : '#0E1B3D');
  r.setProperty('--stripe', stripe || ('linear-gradient(90deg,' + c1 + ' 0%,' + c1 + ' 55%,' + c2 + ' 55%,' + c2 + ' 100%)'));
  r.setProperty('--metal', 'linear-gradient(115deg,' + mezcla(c1, '#ffffff', .9) + ' 0%,' + mezcla(c2, '#ffffff', .9) + ' 60%,#F7F9F8 100%)');
}

/* Devuelve {db, dl, u} si hay sesión y club; si no, muestra la pantalla de acceso y devuelve null */
async function sbInit(){
  if(!window.supabase){ acceso('entrar', 'No se ha podido cargar la conexión. Comprueba tu internet y recarga la página.'); return null; }
  SB = window.supabase.createClient(SB_URL, SB_KEY, {auth: {flowType: 'implicit', detectSessionInUrl: true, persistSession: true}});
  if(/type=recovery/.test(location.hash)){
    await new Promise(function(r){ setTimeout(r, 400); });
    acceso('nueva'); return null;
  }
  var ses = (await SB.auth.getSession()).data.session;
  if(!ses){ acceso('entrar'); return null; }
  var uid = ses.user.id;
  var c = await SB.rpc('mi_cuenta');
  CUENTA = c.data;
  if(!CUENTA){
    var md = ses.user.user_metadata || {};
    if(md.codigo){
      var j = await SB.rpc('unirse_club', {codigo: md.codigo, nombre: md.nombre || ''});
      if(!j.error){ CUENTA = (await SB.rpc('mi_cuenta')).data; }
    }
  }
  if(!CUENTA){
    var inv = await SB.rpc('aceptar_invitacion');
    if(!inv.error && inv.data){ CUENTA = (await SB.rpc('mi_cuenta')).data; S.bienvenida = true; }
  }
  if(!CUENTA){ acceso('club'); return null; }
  if(S.bienvenida || (ses.user.user_metadata || {}).sinClave){ S.clubName = CUENTA.club; acceso('bienvenida'); temaClub(CUENTA.color1, CUENTA.color2); return null; }
  S.clubName = CUENTA.club;
  temaClub(CUENTA.color1, CUENTA.color2);
  return {db: sbDb(SB, CUENTA.club_id), dl: sbDownloads, u: sbUser(SB, uid)};
}

var PROP_EST = {pendiente: 'Pendiente de revisar', aprobada: 'Aprobada', enviada: 'Enviada a Claude', anadida: 'Ya en el banco', rechazada: 'Rechazada'};
var PROP_PILL = {pendiente: 'mid', aprobada: 'ok', enviada: 'gold', anadida: 'ok', rechazada: 'bad'};
async function cargaProps(){
  if(!SB || !ME.uid) return;
  var q = SB.from('docs').select('path,data').eq('club_id', CUENTA.club_id);
  q = ME.owner ? q.like('path', 'cuentas/%/propuestas/%') : q.like('path', 'cuentas/' + ME.uid + '/propuestas/%');
  var r = await q;
  if(r.error) return;
  S.props = (r.data || []).map(function(x){ return Object.assign({}, x.data, {path: x.path}); })
    .sort(function(a, b){ return (b.t || 0) - (a.t || 0); });
  S.propsOk = true;
  if(S.ready) softRender();
}
function propCard(p, coord){
  var tt = team(p.equipo);
  var h = '<div style="border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px">' +
    '<div class="row" style="justify-content:space-between"><b style="font:600 17px/1.15 var(--display)">' + esc(p.nombre || 'Sin nombre') + '</b><span class="pill ' + (PROP_PILL[p.estado] || '') + '">' + esc(PROP_EST[p.estado] || p.estado) + '</span></div>' +
    '<span class="isub">' + (coord ? esc(p.autorNombre || 'Entrenador') + ' · ' : '') + esc(tt ? tt.n : '') + (p.duracion ? ' · ' + esc(p.duracion) + ' min' : '') + (p.modalidad ? ' · ' + esc(p.modalidad) : '') + '</span>';
  if(p.objetivo) h += '<span style="font-size:14.5px"><b>Objetivo:</b> ' + esc(p.objetivo) + '</span>';
  if(p.comentario) h += '<span class="note" style="margin:0">Coordinación: ' + esc(p.comentario) + '</span>';
  h += '<div class="row">';
  h += '<button type="button" class="btn ghost small" data-prop="ver" data-p="' + esc(p.path) + '">Ver ficha</button>';
  if(coord){
    if(p.estado === 'pendiente') h += '<button type="button" class="btn small" data-prop="aprobar" data-p="' + esc(p.path) + '">Aprobar</button><button type="button" class="btn danger small" data-prop="rechazar" data-p="' + esc(p.path) + '">Rechazar</button>';
    if(p.estado === 'enviada') h += '<button type="button" class="btn ghost small" data-prop="anadida" data-p="' + esc(p.path) + '">Marcar como añadido al banco</button>';
  } else if(p.estado === 'pendiente' || p.estado === 'rechazada'){
    h += '<button type="button" class="btn ghost small" data-prop="editar" data-p="' + esc(p.path) + '">Editar</button>';
  }
  return h + '</div></div>';
}
function vPropTeam(t){
  if(!SB || S.readOnly || ME.owner) return '';

    mias.map(function(p){ return propCard(p, false); }).join('') + '</div>';

  var apr = S.props.filter(function(p){ return p.estado === 'aprobada'; }).length;

  var h = '<div class="section-h"><h2>Ejercicios propuestos</h2><span>' + pend + ' por revisar · ' + apr + ' aprobados sin enviar</span></div>' +

    '<span class="row"><button type="button" class="btn ghost small" data-prop="nueva" data-eq="' + TEAMS[0].id + '">Proponer uno</button>' +
    '<button type="button" class="btn small" data-prop="copiar"' + (apr ? '' : ' disabled') + '>Copiar aprobados para Claude</button></span></div>' +
    (vis.length ? vis.map(function(p){ return propCard(p, true); }).join('') : '<p class="note" style="margin:0">No hay propuestas pendientes.</p>') + '</div>';

  var tt = team(p.equipo);
  return [
    '### ' + (p.nombre || 'Ejercicio sin nombre'),
    'Propuesto por: ' + (p.autorNombre || '') + (tt ? ' (' + tt.n + ')' : ''),
    'Modalidad: ' + (p.modalidad || '-') + ' · Duración: ' + (p.duracion || '-') + ' min · Etapas: ' + ((p.etapas || []).map(function(e){ return ETAPAS[e] || e; }).join(', ') || '-'),
    'Fase / contenido: ' + (p.contenido || '-'),
    'Objetivo: ' + (p.objetivo || '-'),
    'Espacio: ' + (p.espacio || '-') + ' · Jugadores: ' + (p.jugadores || '-') + ' · Material: ' + (p.material || '-'),
    'Desarrollo: ' + (p.desarrollo || '-'),
    'Consignas: ' + (p.consignas || '-'),
    'Variantes / progresión: ' + (p.variantes || '-'),
    p.foto ? 'Tiene foto del diagrama (verla en la plataforma).' : 'Sin foto del diagrama.'
