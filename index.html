<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metodix</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icono-512.png">
<meta name="theme-color" content="#7B1E30">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Plan: mismo mundo visual del club (azul marino, dorado, plata) en claro fijo.
   Layout: banda metálica arriba, selector de rol, columna central que pasa a dos en iPad horizontal. */
:root{
  --navy:#0E1B3D; --gold:#C9A227; --gold-deep:#9C7A12;
  --bg:#E7E9ED; --surface:#F8F9FB; --ink:#0E1B3D; --muted:#4A5676; --line:#C2C7D0; --seg:#D2D6DD; --silver-soft:#ECEEF2;
  --metal:linear-gradient(180deg,#F2F4F6 0%,#CBD0D7 100%);
  --ok:#2E6B3A; --ok-soft:#DDEBDF; --amber:#A86A06; --amber-soft:#F6EBD2; --red:#B3261E; --red-soft:#F7DEDB;
  --pitch:#3E7A4D; --pitch-line:rgba(255,255,255,.85);
  --display:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
.inner{max-width:1040px;margin:0 auto;padding:0 16px}
.band{background:var(--metal);border-bottom:4px solid var(--gold)}
.band .inner{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px;padding-bottom:12px}
.band h1{font:700 30px/1 var(--display);text-wrap:balance}
.band h1 small{display:block;font:600 15px/1.2 var(--display);color:var(--gold-deep);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.band .club{font:600 17px/1 var(--display)}
.roles{background:var(--surface);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font:600 17px/1 var(--display);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.chip.coord[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
main{padding-bottom:110px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 10px;border-bottom:2px solid var(--gold);padding-bottom:6px;flex-wrap:wrap}
.section-h h2{font:700 24px/1.05 var(--display)}
.section-h span{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--gold);background:var(--gold);color:var(--navy);font:600 18px/1 var(--display)}
.btn.ghost{background:var(--surface);border-color:var(--line)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.small{min-height:40px;padding:8px 12px;font-size:16px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.weeknav{display:flex;align-items:center;gap:8px;margin-top:16px}
.weeknav b{flex:1;text-align:center;font:700 21px/1.1 var(--display)}
.note{font-size:14.5px;color:var(--muted);margin:8px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.item{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.date{background:var(--navy);color:#fff;border-radius:9px;min-width:62px;padding:6px 6px 5px;text-align:center;font:700 26px/1 var(--display)}
.date small{display:block;font:600 13px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.iname{display:block;font:600 20px/1.15 var(--display)}
.isub{display:block;font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-flex;align-items:center;font:600 13.5px/1 var(--display);border-radius:7px;padding:6px 9px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:var(--silver-soft);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.mid{background:var(--amber-soft);color:var(--amber)}.pill.bad{background:var(--red-soft);color:var(--red)}.pill.gold{background:#F3E7BE;color:var(--gold-deep)}
.subbar{position:sticky;top:0;z-index:5;background:var(--metal);border-bottom:4px solid var(--gold)}
.subbar .inner{display:flex;align-items:center;gap:8px;padding-top:6px;padding-bottom:6px}
.subbar button{background:none;border:0;font:600 18px/1 var(--display);padding:12px 8px;border-radius:8px}
.subbar .ttl{font:700 21px/1 var(--display);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead{display:grid;gap:6px;margin-top:14px}
.shead h2{font:700 28px/1.05 var(--display)}
.shead h2::first-letter{text-transform:uppercase}
.banner{background:var(--surface);border-left:4px solid var(--gold);padding:10px 14px;margin:12px 0 0;font-size:14.5px;border-radius:0 8px 8px 0}
.tasks{display:grid;gap:14px;margin-top:14px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.task.ok{border-color:var(--ok)}.task.mod{border-color:var(--gold)}
.thead{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--silver-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.tnum{background:var(--gold);color:var(--navy);border-radius:9px;min-width:40px;height:40px;display:grid;place-items:center;font:700 22px/1 var(--display)}
.tslot{font:600 13px/1 var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--gold-deep)}
.tname{font:700 21px/1.1 var(--display)}
.tbody{display:grid;gap:14px;padding:14px}
@media (min-width:760px){.tbody{grid-template-columns:minmax(260px,1fr) 1.15fr;align-items:start}}
.diag{background:#2F5E3B;border-radius:10px;padding:8px}
.diag svg{display:block;width:100%;height:auto;max-height:360px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:12.5px;color:#E6EEE8}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%}
.legend i.l{width:18px;height:0;border-radius:0;border-top:2px solid #fff}
.legend i.ld{width:18px;height:0;border-radius:0;border-top:2px dashed #fff}
.legend i.lc{width:18px;height:0;border-radius:0;border-top:2px dotted #F2C14E}
.tdesc{display:grid;gap:8px;font-size:15px}
.tdesc b{display:block;font:600 13px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tactions{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.edit{display:grid;gap:10px}
.field label{display:block;font:600 15px/1.2 var(--display);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;min-height:44px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.alts{display:grid;gap:10px;padding:0 14px 14px}
@media (min-width:640px){.alts{grid-template-columns:1fr 1fr}}
.alt{display:grid;gap:6px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px}
.alt .diag{padding:4px}
.asis summary,.card>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.asis{margin-top:12px}
.asum{font:600 15px/1.2 var(--display);color:var(--ink)}
.asgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.asb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line,#ccd);border-radius:10px;padding:8px 10px;background:#fff;min-height:48px}
.asb select{width:100%;min-height:40px;margin-top:4px;border:1px solid var(--line,#ccd);border-radius:8px;padding:4px 8px;background:#fff;font:inherit}
.prog{margin:0 0 6px;padding-left:18px}.prog li{margin:2px 0}.prog span{font-weight:600}
.asb small{font:600 12px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:#2E7D46}
.asb.f{background:#FBEBEB;border-color:#B3261E}.asb.f small{color:#B3261E}.asb.f span{text-decoration:line-through}
.asb.j{background:#F9EEDA;border-color:#C9A227}.asb.j small{color:#8A6D0B}.asb.j span{text-decoration:line-through}
.ck{display:flex;align-items:center;gap:6px;min-height:44px}
.plan{border-top:1px dashed var(--line,#ccd);padding-top:8px;margin-top:4px}
.plan summary{cursor:pointer;font:600 15px/1.2 var(--display);color:var(--ink);padding:6px 0}
.grps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 10px}
.grp{background:#F3F4F7;border-radius:8px;padding:8px;font-size:14px;line-height:1.35}
.grp b{display:block;font:600 14px/1.2 var(--display);margin-bottom:4px}
.rl{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.rl li{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line,#ccd);padding:6px 0}

.diag.ext{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:#F3F4F7;border:1px dashed var(--line,#ccd);border-radius:10px;padding:12px;color:var(--muted,#4A5676);font-size:14px}
.alt .diag.ext{padding:8px;font-size:12px}
.diag.img{background:#fff;padding:0;overflow:hidden;border:1px solid var(--line,#dde)}
.diag.img img{display:block;width:100%;height:auto;max-height:360px;object-fit:contain}
.alt .diag.img img{max-height:170px}
.alt .diag svg{max-height:170px}
.alt b{font:700 17px/1.1 var(--display)}
.alt small{color:var(--muted);font-size:13px}
.val{display:grid;gap:8px;padding:12px 14px;border-top:1px dashed var(--line);background:#FBFBFC}
.vbtns{display:flex;gap:6px;flex-wrap:wrap}
.vbtn{min-width:48px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 22px/1 var(--display)}
.vbtn[aria-pressed="true"]{background:var(--gold);border-color:var(--navy)}
.vbtn.lo[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.footbar .inner{display:flex;gap:10px;align-items:center}
.footbar .btn{flex:1}
.footbar .st{font-size:14px;color:var(--muted);flex:1}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
th{font:600 14px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;background:var(--metal)}
td.n{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td{background:var(--silver-soft)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;font:600 15px/1 var(--display);background:#fff}
.days input{accent-color:var(--gold);width:18px;height:18px}
.grid2{display:grid;gap:12px;margin-top:12px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.bank{display:grid;gap:12px;margin-top:12px}
@media (min-width:640px){.bank{grid-template-columns:1fr 1fr}}
@media (min-width:980px){.bank{grid-template-columns:1fr 1fr 1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--surface);border:2px solid var(--gold);box-shadow:0 6px 18px rgba(14,27,61,.18);padding:10px 16px;border-radius:10px;font-size:15px;max-width:88vw;z-index:50}
.toast:empty{display:none}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;margin:14px 0;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:600 21px/1.2 var(--display);margin-bottom:4px}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Tema Metodix: neutros + verde + celeste, manteniendo marino y dorado como acentos ===== */
:root{
  --green:#2F8A5B; --green-deep:#1F6B44; --green-soft:#E2F2E9;
  --sky:#4BA3D3; --sky-deep:#2A7FAE; --sky-soft:#E3F2FA;
  --bg:#EFF4F2; --surface:#FFFFFF; --muted:#566579; --line:#D5E0DC; --seg:#DCE6E2; --silver-soft:#F2F7F5;
  --metal:linear-gradient(115deg,#E3F2FA 0%,#EAF5EF 55%,#F4F8F6 100%);
  --ok:#2F8A5B; --ok-soft:#E2F2E9;
  --shadow:0 1px 2px rgba(14,27,61,.05),0 4px 14px rgba(14,27,61,.06);
}
body{background:linear-gradient(180deg,#F4F8F6 0%,var(--bg) 320px)}
:focus-visible{outline-color:var(--sky)}
.band{border-bottom:0;box-shadow:inset 0 -4px 0 0 transparent;position:relative}
.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--green) 0%,var(--sky) 60%,var(--gold) 100%)}
.band h1 small{color:var(--green-deep)}
.roles{background:rgba(255,255,255,.75);backdrop-filter:blur(6px)}
.chip{background:#fff;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--sky);color:var(--sky-deep)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 8px rgba(47,138,91,.25)}
.section-h{border-bottom:0;position:relative}
.section-h::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--sky) 55%,rgba(75,163,211,0))}
.btn{background:var(--green);border-color:var(--green);color:#fff;transition:filter .15s,box-shadow .15s}
.btn:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 2px 8px rgba(47,138,91,.22)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover:not(:disabled){border-color:var(--sky);box-shadow:none;filter:none}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn:disabled{background:#A9B6B1;border-color:#A9B6B1;color:#fff;opacity:1}
.card,.item,.task,.empty,.scroll{border-color:var(--line);box-shadow:var(--shadow)}
.item{transition:border-color .15s,transform .15s}
.item:hover{border-color:var(--sky);transform:translateY(-1px)}
.date{background:linear-gradient(160deg,var(--navy) 0%,#1D3A66 100%)}
.date small{color:#9AD3F0}
.pill{background:var(--silver-soft)}
.pill.gold{background:#F6EDCC}
.subbar{border-bottom:0;box-shadow:0 2px 10px rgba(14,27,61,.06)}
.subbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--green) 0%,var(--sky) 60%,var(--gold) 100%)}
.subbar button:hover{background:rgba(75,163,211,.12)}
.banner{background:var(--sky-soft);border-left-color:var(--sky)}
.task.ok{border-color:var(--green)}
.thead{background:linear-gradient(90deg,var(--sky-soft) 0%,#F2F8F5 100%)}
.tslot{color:var(--sky-deep)}
.diag{background:#2E6E4C}
.alt{border-color:var(--line)}
.alt:hover{border-color:var(--sky)}
.val{background:#F6FAF8}
.vbtn[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.footbar{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);box-shadow:0 -2px 12px rgba(14,27,61,.06)}
th{background:linear-gradient(180deg,var(--sky-soft),#EAF4F8)}
.days input{accent-color:var(--green)}
.grp{background:var(--sky-soft)}
.toast{border-color:var(--green)}
.asb small{color:var(--green)}

/* ===== Temas: Metodix (general) y colores de cada club ===== */
:root{ --stripe:linear-gradient(90deg,var(--green) 0%,var(--sky) 60%,var(--gold) 100%); --on-green:#fff; }
.band::after,.subbar::after{background:var(--stripe)}
.btn{color:var(--on-green)}
.chip[aria-pressed="true"]{color:var(--on-green)}
.vbtn[aria-pressed="true"]{color:var(--on-green)}
.band h1 small{color:var(--green-deep)}
body.brand{background:linear-gradient(180deg,#F6F8FB 0%,#EEF2F7 100%)}
body.brand .band{background:linear-gradient(115deg,#EAF5FC 0%,#FFFBEA 55%,#F8EEF0 100%)}
body.brand .band h1{font-size:34px;letter-spacing:.01em}
body.brand .band h1 .mx-a{color:#2B86C2} body.brand .band h1 .mx-b{color:var(--green)}
body.brand .banner{background:#F3F6FB;border-left-color:var(--sky)}
.brand-foot{margin:18px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.brand-flag{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:0 0 16px}
.brand-flag i{flex:1}
.band .inner{align-items:center}
/* Evaluación individual */
.ev .plist{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
.ev .prow{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto 50px;align-items:center;gap:12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ev .pnum{font:700 24px/1 var(--display);color:var(--navy);background:var(--gold);border-radius:9px;height:44px;display:grid;place-items:center}
.ev .pname{display:block;font:600 19px/1.15 var(--display)}
.ev .psub{display:block;font-size:13.5px;color:var(--muted)}
.ev .pbars{display:flex;align-items:flex-end;gap:3px;height:30px}
.ev .pbars i{display:block;width:6px;border-radius:2px 2px 0 0;background:var(--gold);min-height:2px}
.ev .pbars i.nil{background:var(--seg);height:2px}
.ev .pavg{font:700 24px/1 var(--display);text-align:right}
@media (max-width:420px){.ev .prow{grid-template-columns:40px minmax(0,1fr) 46px}.ev .pbars{display:none}}
.evgrid{display:grid;gap:16px;margin-top:16px}
@media (min-width:860px){.evgrid{grid-template-columns:380px minmax(0,1fr);align-items:start}}
.ev .cromo{background:var(--metal);border-radius:18px;padding:20px 18px 12px;border:1px solid var(--line);border-bottom:5px solid var(--gold)}
.ev .cromo-top{display:flex;align-items:flex-end;gap:14px}
.ev .dorsal{font:700 84px/.78 var(--display);color:var(--navy)}
.ev .cromo-id{flex:1;min-width:0}
.ev .cromo-id h2{font:700 29px/1 var(--display);text-transform:uppercase;overflow-wrap:break-word}
.ev .cromo-id p{font-size:14.5px;color:var(--muted);margin-top:5px}
.ev .media{flex:none;background:var(--gold);color:var(--navy);border-radius:12px;padding:8px 10px 6px;text-align:center;min-width:70px}
.ev .media b{display:block;font:700 40px/.95 var(--display)}
.ev .media span{font:600 13px/1 var(--display)}
.ev .radar{display:block;width:100%;height:auto;margin-top:8px;font-family:var(--display)}
.ev .legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);padding-bottom:6px}
.ev .legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--gold);vertical-align:middle;margin-right:6px}
.ev .legend i.prev{border-top:2px dashed var(--navy)}
.ev .evh{font:700 21px/1.1 var(--display);margin-bottom:6px}
.ev .abar{display:grid;grid-template-columns:96px minmax(0,1fr) 40px 44px;align-items:center;gap:10px;padding:6px 0}
.ev .abar .nm{font:600 16.5px/1.1 var(--display)}
.ev .track{height:12px;border-radius:6px;background:var(--seg);overflow:hidden;display:block}
.ev .track i{display:block;height:100%;background:var(--gold);border-radius:6px}

/* ================= CONEXIÓN CON SUPABASE (web propia) =================
   Cuando la plataforma NO se abre dentro de Claude, los datos se guardan en Supabase.
   Este bloque imita la base de datos de Claude (doc/collection/onSnapshot/set/delete)
   para que el resto del programa funcione igual. Los permisos los decide Supabase
   (ver supabase/esquema.sql): cada entrenador solo ve lo suyo y coordinación lo ve todo. */

function sbDb(sb, club){
  var cache = {}, colL = [], docL = [];
  function parent(p){ return p.slice(0, p.lastIndexOf('/')); }
  function last(p){ return p.slice(p.lastIndexOf('/') + 1); }
  function fireDoc(l){ var d = cache[l.p]; l.cb({exists: d !== undefined, data: function(){ return d; }}); }
  function fireCol(l){
    var docs = Object.keys(cache).filter(function(k){ return parent(k) === l.p; })
      .map(function(k){ return {id: last(k), data: function(){ return cache[k]; }}; });
    l.cb({docs: docs});
  }
  function emit(p){
    docL.forEach(function(l){ if(l.p === p) fireDoc(l); });
    colL.forEach(function(l){ if(parent(p) === l.p) fireCol(l); });
  }
  var loaded = (async function(){
    var from = 0;
    for(;;){
      var r = await sb.from('docs').select('path,data').eq('club_id', club).range(from, from + 999);
      if(r.error) throw r.error;
      r.data.forEach(function(x){ cache[x.path] = x.data; });
      if(r.data.length < 1000) break;
      from += 1000;
    }
  })();
  sb.channel('docs-' + club)
    .on('postgres_changes', {event: '*', schema: 'public', table: 'docs', filter: 'club_id=eq.' + club}, function(ev){
      if(ev.eventType === 'DELETE'){ var p = ev.old && ev.old.path; if(p && p in cache){ delete cache[p]; emit(p); } }
      else if(ev.new && ev.new.path){ cache[ev.new.path] = ev.new.data; emit(ev.new.path); }
    })
    .subscribe();
  function listen(list, l, fire){
    list.push(l);
    loaded.then(function(){ fire(l); }, function(e){ if(l.err) l.err(e); });
    return function(){ var i = list.indexOf(l); if(i >= 0) list.splice(i, 1); };
  }
  async function put(p, d){
    var r = await sb.from('docs').upsert({club_id: club, path: p, data: d, updated_at: new Date().toISOString()});
    if(r.error) throw r.error;
    cache[p] = d; emit(p);
  }
  async function del(p){
    var r = await sb.from('docs').delete().eq('club_id', club).eq('path', p);
    if(r.error) throw r.error;
    delete cache[p]; emit(p);
  }
  function doc(p){
    return {
      onSnapshot: function(cb, err){ return listen(docL, {p: p, cb: cb, err: err}, fireDoc); },
      set: function(d){ return put(p, d); },
      delete: function(){ return del(p); }
    };
  }
  function collection(p){
    return {
      onSnapshot: function(cb, err){ return listen(colL, {p: p, cb: cb, err: err}, fireCol); },
      doc: function(i){ return doc(p + '/' + i); }
    };
  }
  return {doc: doc, collection: collection};
}

function mezcla(hex, con, t){ var a = parseInt(hex.slice(1), 16), b = parseInt(con.slice(1), 16);
  var r = Math.round(((a>>16)&255)*(1-t) + ((b>>16)&255)*t), g = Math.round(((a>>8)&255)*(1-t) + ((b>>8)&255)*t), bl = Math.round((a&255)*(1-t) + (b&255)*t);
  return '#' + ((1<<24) + (r<<16) + (g<<8) + bl).toString(16).slice(1); }
function oscuro(hex){ var n = parseInt(hex.slice(1), 16); return (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255)) < 150; }

function fotoReducida(file, max, tipo){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var k = Math.min(1, (max || 1000) / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(tipo || 'image/jpeg', 0.75));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

function partidosSemana(tid, ini){ var fin = addDays(ini, 6); return partidosDe(tid).filter(function(p){ return p.fecha >= ini && p.fecha <= fin; }); }

/* ================= EVALUACIÓN INDIVIDUAL (0 a 10) =================
   Ficha de cada jugador de la plantilla con notas de 0 a 10 por aspecto y «No aplica».
   Dónde se guarda:
     · el entrenador → cuentas/<su id>/evaluaciones/<id>   (solo él y coordinación)
     · coordinación  → privado/evaluaciones/<id> y una copia de solo lectura
                        en la cuenta de cada entrenador del equipo. */
var EV_AREAS = [
  {id:'tec',nombre:'Técnica',aspectos:[['tec_ctrl','Control orientado'],['tec_pc','Pase corto'],['tec_pl','Pase largo y cambio de orientación'],['tec_cond','Conducción'],['tec_reg','Regate y 1 contra 1'],['tec_tiro','Tiro y finalización'],['tec_lat','Pierna no dominante y juego hacia los dos lados']]},
  {id:'cb',nombre:'Con balón',aspectos:[['cb_perfil','Perfil y orientación al recibir'],['cb_mira','Mira antes de recibir'],['cb_dec','Toma de decisiones'],['cb_desm','Desmarque y apoyos'],['cb_3h','Pared y tercer hombre'],['cb_esp','Amplitud y profundidad']]},
  {id:'sb',nombre:'Sin balón',aspectos:[['sb_ptp','Presión tras pérdida'],['sb_repl','Repliegue y posicionamiento defensivo'],['sb_marc','Marcaje y anticipación'],['sb_1x1','Duelo defensivo 1 contra 1']]},
  {id:'fis',nombre:'Física',aspectos:[['fis_vel','Velocidad y aceleración'],['fis_res','Resistencia'],['fis_coord','Coordinación y agilidad'],['fis_fza','Fuerza y salto (desde Infantil)']]},
  {id:'psi',nombre:'Psicológica',aspectos:[['psi_conc','Concentración'],['psi_conf','Confianza y gestión del error'],['psi_comp','Competitividad e intensidad']]},
  {id:'soc',nombre:'Social',aspectos:[['soc_act','Actitud y compromiso'],['soc_comp','Compañerismo y comunicación'],['soc_resp','Respeto']]},
  {id:'por',nombre:'Portero',gk:1,aspectos:[['por_bloc','Blocaje y desvío'],['por_sal','Salidas y 1 contra 1'],['por_pie','Juego con el pie y saque'],['por_col','Colocación']]}
];
function evAreasFor(j){ return EV_AREAS.filter(function(a){ return !a.gk || (j && j.pt); }); }
S.evBy = {}; S.evSrc = {};
function evMean(a){ var v = a.filter(function(x){ return typeof x === 'number'; }); return v.length ? v.reduce(function(s,x){ return s+x; },0)/v.length : null; }
function evAreas(ev, j){ return EV_AREAS.map(function(a){ return ev && (!a.gk || !j || j.pt) ? evMean(a.aspectos.map(function(x){ return ev.notas ? ev.notas[x[0]] : null; })) : null; }); }
function evOverall(ev, j){ return evMean(evAreas(ev, j)); }
function evPick(vals, j){ return EV_AREAS.map(function(a,i){ return (!a.gk || (j && j.pt)) ? vals[i] : undefined; }).filter(function(v){ return v !== undefined; }); }
function evFmt(n){ return n == null ? '–' : (Math.round(n*10)/10).toFixed(1).replace('.',','); }
function evLabel(v){ return v === 'na' ? 'N/A' : (typeof v === 'number' ? v : '–'); }
function evFecha(s){ if(!s) return 'Sin fecha'; var m = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], p = s.split('-'); return p.length === 3 ? (+p[2]) + ' ' + m[(+p[1])-1] + ' ' + p[0] : s; }
function evMerge(){
  var all = {}, src = {};
  Object.keys(S.evBy).forEach(function(p){
    var m = S.evBy[p] || {};
    Object.keys(m).forEach(function(id){
      var e = m[id], o = all[id];
      if(!o || (o.copia && !e.copia) || (!!o.copia === !!e.copia && (e.act || 0) > (o.act || 0))){ all[id] = e; src[id] = p; }
    });
  });
  S.evals = all; S.evSrc = src;
}
function evalsOf(tid, jid){
  return Object.keys(S.evals || {}).map(function(k){ return S.evals[k]; }).filter(function(e){ return e.t === tid && e.j === jid; })

function evWatch(p){

async function evDelete(id){

function evRadar(vals, prev, areas){
  areas = areas || EV_AREAS;
  var n = vals.length, cx = 180, cy = 140, R = 96, out = '';
  function pt(i, v){ var a = -Math.PI/2 + i*2*Math.PI/n, r = R*(v||0)/10; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
  function poly(vs){ return vs.map(function(v,i){ var p = pt(i, v); return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' '); }
  [2,4,6,8,10].forEach(function(k){ out += '<polygon points="'+poly(vals.map(function(){ return k; }))+'" fill="none" stroke="rgba(14,27,61,'+(k===10?.45:.18)+')" stroke-width="1"/>'; });
  vals.forEach(function(_,i){ var p = pt(i,10); out += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(14,27,61,.18)"/>'; });
  if(prev && prev.some(function(v){ return v != null; })) out += '<polygon points="'+poly(prev)+'" fill="none" stroke="var(--navy)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  out += '<polygon points="'+poly(vals)+'" fill="var(--gold)" fill-opacity=".55" stroke="var(--gold-deep)" stroke-width="2.5" stroke-linejoin="round"/>';
  vals.forEach(function(v,i){
    if(v != null){ var p = pt(i,v); out += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="var(--gold-deep)"/>'; }
    var a = -Math.PI/2 + i*2*Math.PI/n, c = Math.cos(a), s = Math.sin(a);
    var lx = cx + (R+14)*c, ly = cy + (R+14)*s + (s < -0.5 ? -14 : s > 0.5 ? 14 : -2);
    var anchor = c > 0.3 ? 'start' : c < -0.3 ? 'end' : 'middle';
    out += '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anchor+'" font-size="13" font-weight="600" fill="var(--muted)">'+esc(areas[i].nombre)+'</text>';
    out += '<text x="'+lx.toFixed(1)+'" y="'+(ly+16).toFixed(1)+'" text-anchor="'+anchor+'" font-size="16" font-weight="700" fill="var(--ink)">'+evFmt(v)+'</text>';
  });
  return '<svg class="radar" viewBox="0 0 360 290" role="img" aria-label="Perfil por áreas: '+esc(areas.map(function(a,i){ return a.nombre+' '+evFmt(vals[i]); }).join(', '))+'">'+out+'</svg>';
}
function evBars(vals){ return '<span class="pbars" aria-hidden="true">'+vals.map(function(v){ return v == null ? '<i class="nil"></i>' : '<i style="height:'+Math.max(2, Math.round(v*3))+'px"></i>'; }).join('')+'</span>'; }
function evPlayer(tid, jid){ return plantilla(tid).filter(function(j){ return j.id === jid; })[0]; }

/* Pegar la plantilla de una vez */
function evParseLista(txt){
  var out = [];
  String(txt || '').split(/\r?\n/).forEach(function(l){
    l = l.replace(/^\s*[-•*·]\s*/, '').trim(); if(!l) return; if(/^=|====|plantillas para pegar|copia el bloque/i.test(l) || l.length > 70) return;
    var pt = /\b(portero|portera|guardameta|POR)\b|\((P|POR)\)/i.test(l);
    l = l.replace(/[,;(\-–]*\s*\b(portero|portera|guardameta)\b\s*\)?/ig, ' ').replace(/\((P|POR)\)/ig, ' ');
    var m = l.match(/^\s*(\d{1,2})\s*[.)\-–:\t ]\s*(.+)$/), d = '', n = l;
    if(m){ d = m[1]; n = m[2]; }
    else { var m2 = l.match(/^(.+?)[\t ,;]+(\d{1,2})\s*$/); if(m2){ n = m2[1]; d = m2[2]; } }
    n = n.replace(/[\t,;]+/g, ' ').replace(/\s+/g, ' ').trim();
    if(n.length < 2 || /^(dorsal|nombre|jugador)/i.test(n)) return;
    out.push({n:n, d:d, pt:pt});
  });
  return out;
}
function evNorm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
function pasteHtml(t){
  if(S.readOnly) return '';
  return '<details class="paste" style="margin-top:12px"' + keepD('pp-' + t.id) + '><summary class="btn ghost small" style="display:inline-flex">Pegar la lista completa</summary>' +
    '<div class="field" style="margin-top:10px"><label for="pl-' + t.id + '">Un jugador por línea: dorsal y nombre. Si es portero, añade «portero» al final.</label><textarea id="pl-' + t.id + '" rows="8" placeholder="1 Nombre Apellido Apellido portero&#10;2 Nombre Apellido Apellido&#10;Nombre sin dorsal"></textarea></div>' +
    '<p class="note">Los que ya estén en la plantilla (mismo nombre) se actualizan; los nuevos se añaden. No se quita a nadie.</p>' +
    '<button type="button" class="btn small" data-ev="pegar" data-t="' + t.id + '">Añadir a la plantilla</button></details>';
}

app.addEventListener('click', async function(ev){
  var b = ev.target.closest('[data-ev]'); if(!b) return;
  var k = b.dataset.ev, v = S.view;
  if(k === 'ver'){ go({name:'evjug', t:b.dataset.t, j:b.dataset.j}); }
  else if(k === 'tabla'){ go({name:'evtabla', t:b.dataset.t}); }
  else if(k === 'volver' || k === 'volverHome'){ go({name:'home'}); }
  else if(k === 'pick'){ v.evId = b.dataset.id; stay(); }
  else if(k === 'nueva' || k === 'editar'){
    var base, d;
    if(k === 'editar'){ base = S.evals[b.dataset.id]; d = JSON.parse(JSON.stringify(base)); delete d.copia; }
    else {
      base = evalsOf(v.t, v.j)[0];
      d = {id:'ev-' + uid(), t:v.t, j:v.j, fecha:today(), notas:base ? JSON.parse(JSON.stringify(base.notas || {})) : {}, fortalezas:'', mejorar:'', objetivo:'', creado:Date.now(), prefill:!!base};
    }
    S.evBack = {t:v.t, j:v.j}; go({name:'evaluar', d:d});
  }
  else if(k === 'cancelar'){ go({name:'evjug', t:S.evBack.t, j:S.evBack.j}); }
  else if(k === 'nota'){ v.d.notas[b.dataset.asp] = +b.dataset.n; evPaintRow(b.dataset.asp); }
  else if(k === 'na'){ var a = b.dataset.asp; if(v.d.notas[a] === 'na') delete v.d.notas[a]; else v.d.notas[a] = 'na'; evPaintRow(a); }
  else if(k === 'guardar'){
    var e = Object.assign({}, v.d); delete e.prefill;
    if(!e.fecha){ toast('Pon la fecha de la evaluación.'); return; }
    e.autor = e.autor || ME.uid || ''; e.autorN = e.autorN || (ME.owner ? 'Coordinación' : ((typeof CUENTA !== 'undefined' && CUENTA && CUENTA.nombre) || S.names[ME.uid] || ''));
    S.evBusy = true; stay();
    try{ await evSave(e); S.evBusy = false; toast('Evaluación guardada'); go({name:'evjug', t:e.t, j:e.j, evId:e.id}); }
    catch(err){ S.evBusy = false; stay(); toast(err && err.code === 'invalid_argument' ? 'Tu acceso es de solo lectura: no se ha guardado.' : 'No se ha podido guardar. Comprueba la conexión.'); }
  }
  else if(k === 'borrar'){
    var id = b.dataset.id;
    if(S.evConfirm !== id){ S.evConfirm = id; stay(); return; }
    S.evConfirm = null;
    try{ await evDelete(id); if(v.evId === id) v.evId = null; stay(); toast('Evaluación eliminada'); }catch(err){ toast('No se ha podido eliminar.'); }
  }
  else if(k === 'pegar'){
    var tid = b.dataset.t, ta = document.getElementById('pl-' + tid), lista = evParseLista(ta && ta.value);
    if(!lista.length){ toast('No he encontrado jugadores en el texto.'); return; }
    var nuevos = 0, cambiados = 0;
    editRoster(tid, function(l){
      lista.forEach(function(x){
        var o = l.filter(function(j){ return evNorm(j.n) === evNorm(x.n); })[0];
        if(o){ if(x.d && o.d !== x.d){ o.d = x.d; cambiados++; } if(x.pt && !o.pt){ o.pt = true; cambiados++; } }
        else { l.push({id:'j-' + tid + '-' + uid(), n:x.n, d:x.d, pt:x.pt}); nuevos++; }
      });
      return l;
    });
    S.keepD = S.keepD || {}; S.keepD['pp-' + tid] = false; S.keepD['pl-' + tid] = true;
    stay(); await saveRoster();
    toast((nuevos === 1 ? '1 jugador añadido' : nuevos + ' jugadores añadidos') + (cambiados ? ' y ' + (cambiados === 1 ? '1 dato actualizado' : cambiados + ' datos actualizados') : ''));
  }
});

  h += '<div class="scroll"><table><thead><tr><th>Equipo</th><th>Sesiones</th><th>Confirmadas</th><th>Con antelación</th><th>Valorados</th><th>Estado</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
  if(pendientes.length) h += '<div class="section-h"><h2>Por confirmar</h2><span>'+pendientes.length+' sesiones</span></div><ul class="list">'+pendientes.map(function(s){ return '<li><button type="button" class="item" data-act="open" data-t="'+s.equipo+'" data-f="'+s.fecha+'"><span class="date">'+fdate(s.fecha,'day')+'<small>'+fdate(s.fecha,'mon')+'</small></span><span><span class="iname">'+esc(team(s.equipo).n)+' · '+esc(PR[s.pr])+'</span><span class="tags">'+statusPills(s)+'</span></span><span aria-hidden="true">›</span></button></li>'; }).join('')+'</ul>';
  h += '<div class="grid2"><div class="card"><h3 style="font:700 20px/1.1 var(--display);margin-bottom:6px">Ejercicios que no han funcionado (1-2)</h3>'+(low.length ? '<ul style="margin:0;padding-left:18px">'+low.slice(0,12).map(function(a){ return '<li>'+esc(a[1].nombre)+' · '+esc(team(a[0].equipo).n)+', '+fdate(a[0].fecha,'short')+(a[1].valObs ? ' — '+esc(a[1].valObs) : '')+'</li>'; }).join('')+'</ul>' : '<p class="note">Ninguno todavía.</p>')+'</div>' +
    '<div class="card"><h3 style="font:700 20px/1.1 var(--display);margin-bottom:6px">Ejercicios para el banco del club (4-5)</h3>'+(high.length ? '<ul style="margin:0;padding-left:18px">'+high.slice(0,12).map(function(a){ return '<li>'+esc(a[1].nombre)+' · '+esc(team(a[0].equipo).n)+' ('+a[1].val+'/5)</li>'; }).join('')+'</ul>' : '<p class="note">Ninguno todavía.</p>')+'</div></div>';
  if(!(sinPlan() || PLAN_ED)) h += vMesos();
  h += '<div class="section-h"><h2>Días de entrenamiento</h2><span>Los borradores salen de estos días</span></div><div class="card" style="display:grid;gap:12px">';
  TEAMS.forEach(function(t){
    var d = teamDays(t);
    var al = teamAlt(t), altW = al ? addDays(monday(al.ref), al.par * 7) : '';
    var altTxt = '<span class="note alt-ed" style="margin:0;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:400">Alterno: <select data-alt="d" data-t="'+t.id+'"'+(S.readOnly ? ' disabled' : '')+'><option value="">Ninguno</option>'+d.map(function(k){ return '<option value="'+k+'"'+(al && al.d === k ? ' selected' : '')+'>'+DOW[k]+'</option>'; }).join('')+'</select>'+(al ? ' una semana sí y otra no, desde la del <input type="date" data-alt="ref" data-t="'+t.id+'" value="'+esc(altW)+'"'+(S.readOnly ? ' disabled' : '')+'>' : '')+'</span>';
    h += '<div class="row" style="justify-content:space-between"><b style="font:600 18px/1 var(--display);min-width:150px">'+esc(t.n)+altTxt.replace('<span','<br><span')+'</b><div class="days">'+[1,2,3,4,5,6,0].map(function(k){ return '<label><input type="checkbox" data-act="day" data-t="'+t.id+'" data-d="'+k+'"'+(d.indexOf(k) >= 0 ? ' checked' : '')+(S.readOnly ? ' disabled' : '')+'>'+DOW[k].slice(0,3)+'</label>'; }).join('')+'</div></div>';
  });
  h += '</div>';
  h += '<div class="section-h"><h2>Banco de ejercicios</h2><span>'+BANK.length+' ejercicios con diagrama</span></div>';
  var fe = S.view.fe || 'todas';
  h += '<div class="chips" role="group" aria-label="Filtrar por etapa">'+['todas','ini','des','per','ren'].map(function(e){ return '<button type="button" class="chip" data-act="fe" data-e="'+e+'" aria-pressed="'+(fe === e)+'">'+(e === 'todas' ? 'Todas' : ETAPAS[e])+'</button>'; }).join('')+'</div>';
  var fs = S.view.fs || 'todas', FS = {todas:'Todas las partes', act:'Calentamiento', p1:'Primera parte', p2:'Segunda parte', abp:'Balón parado', par:'Tercera parte', fis:'Preparación física', por:'Porteros', cal:'Vuelta a la calma'};
  var inFs = function(b){ return fs === 'todas' || (fs === 'p1' ? ((b.s === 'rue' || b.s === 'pri') && !tiro(b)) : fs === 'p2' ? ((b.s === 'pri' || b.s === 'act') && tiro(b)) : fs === 'act' ? (b.s === 'act' && !tiro(b)) : b.s === fs); };
  h += '<div class="chips" role="group" aria-label="Filtrar por parte de la sesión" style="margin-top:8px">'+Object.keys(FS).map(function(e){ return '<button type="button" class="chip" data-act="fs" data-e="'+e+'" aria-pressed="'+(fs === e)+'">'+FS[e]+'</button>'; }).join('')+'</div>';
  var fm = S.view.fm || 'todas', FM = {todas:'Sala y campo', sala:'Solo fútbol sala', campo:'Solo fútbol campo'};
  h += '<div class="chips" role="group" aria-label="Filtrar por modalidad" style="margin-top:8px">'+Object.keys(FM).map(function(e){ return '<button type="button" class="chip" data-act="fm" data-e="'+e+'" aria-pressed="'+(fm === e)+'">'+FM[e]+'</button>'; }).join('')+'</div>';
  var bl = BANK.filter(function(b){ return (fe === 'todas' || b.e.indexOf(fe) >= 0) && inFs(b) && (fm === 'todas' || b.mod === fm); });
  h += '<p class="note">'+bl.length+' ejercicios. '+DRIVE.length+' vienen de los dosieres de tareas del Drive del club y '+MF.length+' de las fichas MetodoFutbol de las carpetas de ejercicios y '+SALA.length+' son ejercicios específicos de fútbol sala (con las tareas de los manuales de entrenamiento de futsal de la UEFA y de la FIFA) y '+F11.length+' vienen de los programas FIFA 11+ y FIFA 11+ Kids. Cada ejercicio indica si es de sala, de campo o sirve para los dos.</p>';
  h += '<div class="bank">'+bl.map(function(b){ return '<div class="alt">'+pic(b, true)+'<b>'+esc(b.n)+'</b><small>'+MODS[b.mod]+' · '+esc(b.s === 'pri' ? 'Primera o segunda parte' : b.s === 'rue' ? 'Primera parte' : SLOTS[b.s])+(b.s === 'pri' ? (hasGoal(b) ? ' · con finalización' : ' · elementos') : '')+(b.pr ? ' · '+esc(PR[b.pr]) : '')+' · '+b.e.map(function(e){ return ETAPAS[e]; }).join(', ')+'</small></div>'; }).join('')+'</div>';
  if(S.dl && ME.owner) h += '<div class="row" style="margin-top:16px"><button type="button" class="btn ghost" data-act="export">Descargar todas las sesiones (para integrarlas en la app)</button></div>';
  return h;
}
function render(){
  if(S.acceso){ if(!document.getElementById('acceso')) app.innerHTML = vLogin(S.acceso, S.accesoMsg); return; }
  if(!S.ready){ app.innerHTML = '<p class="loading">Cargando…</p>'; return; }
  var y = window.scrollY;
  if(S.view.name === 'session'){
    var s = S.view.s; if(s && S.sessions[s.id] && S.sessions[s.id] !== s && !s.dirty && (S.sessions[s.id].actualizado || 0) > (s.actualizado || 0)) S.view.s = JSON.parse(JSON.stringify(S.sessions[s.id]));
    app.innerHTML = vSession();
  } else if(S.view.name === 'partido') app.innerHTML = vPartido();
  else if(S.view.name === 'evjug') app.innerHTML = vEvJugador();
  else if(S.view.name === 'evaluar') app.innerHTML = vEvaluar();
  else if(S.view.name === 'evtabla') app.innerHTML = vEvTabla();
  else app.innerHTML = vHome();
  if(S.keepOpen){ var dd = document.querySelector('#t-' + S.keepOpen + ' .plan details'); if(dd) dd.open = true; S.keepOpen = null; }
  if(S.keepScroll){ window.scrollTo(0, y); S.keepScroll = false; }
}
function go(v){ S.view = v; render(); window.scrollTo(0,0); }
function stay(){ S.keepScroll = true; render(); }

/* ================= ACCIONES ================= */
function cur(){ return S.view.s; }
function task(k){ return cur().tareas.find(function(x){ return x.k === k; }); }
async function persist(){ var s = cur(); await saveSession(s); }
app.addEventListener('click', async function(ev){
  var b = ev.target.closest('[data-act]'); if(!b || b.disabled) return;
  var a = b.dataset.act, s, x;
  if(a === 'day') return;
  switch(a){
    case 'role': if(!roleOk(b.dataset.r)) return; S.role = b.dataset.r; if(S.role === 'admin') cargaAdmin(); try{ localStorage.setItem(LS + '-rol', S.role); }catch(e){} go({name:'home'}); break;
    case 'wk': S.week = addDays(S.week, +b.dataset.d); stay(); break;
    case 'home': go({name:'home'}); break;
    case 'open': if(!roleOk(b.dataset.t) && !ME.owner) return; s = JSON.parse(JSON.stringify(sessionFor(b.dataset.t, b.dataset.f))); var nch = normaliza(s); go({name:'session', s:s}); if(nch && !s.virtual) await persist(); break;
    case 'newDay':
      var f = document.getElementById('nd').value; if(!f){ toast('Elige una fecha.'); return; }
      s = sessionFor(b.dataset.t, f); go({name:'session', s:JSON.parse(JSON.stringify(s))}); break;
    case 'accept': x = task(b.dataset.k); x.dec = 'ok'; stay(); await persist(); break;
    case 'acceptAll': cur().tareas.forEach(function(t){ if(t.dec === 'pend') t.dec = 'ok'; }); stay(); await persist(); break;
    case 'f11': S.view.swap = b.dataset.k; S.view.f11 = b.dataset.v; S.view.edit = null; stay(); break;
    case 'swap': S.view.f11 = null; S.view.swap = S.view.swap === b.dataset.k ? null : b.dataset.k; S.view.swapPr = S.view.swap ? task(b.dataset.k).prin : null; S.view.edit = null; stay(); break;
    case 'tipo':
      s = cur(); if(s.estado === 'confirmada') return;
      var nd = makeDraft(s.equipo, s.fecha, b.dataset.v); nd.virtual = s.virtual; S.view.s = nd; S.view.swap = null; S.view.edit = null; stay(); if(!nd.virtual) await persist(); toast('Borrador rehecho como sesión '+TIPOS[b.dataset.v].toLowerCase()); break;
    case 'pickSwap':
      x = task(b.dataset.k); var nb = BYID[b.dataset.b], nt = fromBank(nb, x.slot, x.dur, cur().pr === 'jc' || cur().pr === 'co' ? cur().pr : cur().prTarea);
      S.view.f11 = null; nt.k = x.k; nt.dec = 'mod'; nt.prin = nb.pr || x.prin; cur().tareas[cur().tareas.indexOf(x)] = nt; S.view.swap = null; stay(); await persist(); toast('Ejercicio cambiado'); break;
    case 'edit': S.view.edit = b.dataset.k; S.view.swap = null; stay(); break;
    case 'cancelEdit': S.view.edit = null; stay(); break;
    case 'saveEdit':
      x = task(b.dataset.k);
      x.nombre = document.getElementById('e-n').value.trim() || x.nombre;
      x.dur = +document.getElementById('e-d').value || x.dur;
      x.obj = document.getElementById('e-o').value.trim(); x.org = document.getElementById('e-g').value.trim(); x.cons = document.getElementById('e-c').value.trim(); x.carga = document.getElementById('e-k').value.trim(); var ep = document.getElementById('e-p'); if(ep){ var pl = ep.value.split('\n').map(function(l){ return l.trim(); }).filter(Boolean); if(pl.join('|') !== (progresion(Object.assign({}, x, {prog:null}), cur()) || []).map(function(t){ return t.txt; }).join('|')) x.prog = pl; else delete x.prog; }
      x.dec = 'mod'; S.view.edit = null; stay(); await persist(); break;
    case 'remove': s = cur(); s.tareas = s.tareas.filter(function(t){ return t.k !== b.dataset.k; }); stay(); await persist(); toast('Ejercicio quitado'); break;
    case 'addTask': S.view.adding = !S.view.adding; S.view.addSlot = S.view.addSlot || 'p1'; stay(); break;
    case 'pickAdd':
      s = cur(); var asl = S.view.addSlot || 'p1', ab = BYID[b.dataset.b], nx = fromBank(ab, asl, asl === 'p1' || asl === 'p2' ? 15 : 10, s.pr === 'jc' || s.pr === 'co' ? s.pr : s.prTarea); nx.dec = 'ok';
      var order = Object.keys(SLOTS), pos = s.tareas.length;
      for(var i = 0; i < s.tareas.length; i++){ if(order.indexOf(s.tareas[i].slot) > order.indexOf(asl)){ pos = i; break; } }
      s.tareas.splice(pos, 0, nx); S.view.adding = false; stay(); await persist(); toast('Ejercicio añadido'); break;
    case 'confirm':
      s = cur(); s.estado = 'confirmada'; s.confirmado = Date.now(); stay(); await persist(); toast('Sesión confirmada'); break;
    case 'val': x = task(b.dataset.k); x.val = +b.dataset.v; var ta = document.getElementById('v-'+x.k); if(ta) x.valObs = ta.value.trim(); stay(); await persist(); toast('Valoración guardada'); break;
    case 'asisAll': s = cur(); s.asis = {}; stay(); await persist(); toast('Todos asisten'); break;
    case 'asis':
      s = cur(); s.asis = s.asis || {}; var jv = s.asis[b.dataset.j] || ''; var nv = jv ? '' : 'f';
      if(nv) s.asis[b.dataset.j] = nv; else delete s.asis[b.dataset.j]; stay(); await persist(); break;
    case 'addExtra':
      s = cur(); var exn = document.getElementById('exn').value.trim(); if(!exn){ toast('Escribe el nombre.'); return; }
      s.extra = (s.extra || []).concat([{id:'x-' + uid(), n:exn, d:'', pt:document.getElementById('exp').checked, extra:true}]); stay(); await persist(); toast('Jugador añadido a esta sesión'); break;
    case 'rmExtra': s = cur(); s.extra = (s.extra || []).filter(function(j){ return j.id !== b.dataset.j; }); stay(); await persist(); break;
    case 'mix': x = task(b.dataset.k); x.mix = (x.mix || 0) + 1; S.keepOpen = x.k; stay(); await persist(); break;
    case 'rAdd':
      var rn = document.getElementById('rn').value.trim(); if(!rn){ toast('Escribe el nombre.'); return; }
      var rtid = b.dataset.t, rd = document.getElementById('rd').value.trim(), rp = document.getElementById('rp').checked;
      editRoster(rtid, function(l){ l.push({id:'j-' + rtid + '-' + uid(), n:rn, d:rd, pt:rp}); return l; }); stay(); await saveRoster(); toast('Jugador añadido'); break;
    case 'rDel': editRoster(b.dataset.t, function(l){ return l.filter(function(j){ return j.id !== b.dataset.j; }); }); stay(); await saveRoster(); toast('Jugador quitado de la plantilla'); break;
    case 'rGk': editRoster(b.dataset.t, function(l){ l.forEach(function(j){ if(j.id === b.dataset.j) j.pt = !j.pt; }); return l; }); stay(); await saveRoster(); break;
    case 'solSend':
      var se = document.getElementById('solEq').value; if(!ME.uid || !se) return;
      try{ await S.db.doc('solicitudes/' + ME.uid).set({equipo:se, t:Date.now()}); toast('Solicitud enviada'); }catch(e){ toast('No se ha podido enviar. Pide a coordinación que te dé permiso de edición al compartir.'); }
      break;
    case 'solDel': try{ await S.db.doc('solicitudes/' + ME.uid).delete(); }catch(e){} break;
    case 'solOk':
      if(!ME.owner) return; var su = b.dataset.u, sq = S.sol[su]; if(!sq) return;
      await darEquipo(su, sq.equipo); try{ await S.db.doc('solicitudes/' + su).delete(); }catch(e){} delete S.sol[su]; stay(); toast('Acceso dado a ' + who(su)); break;
    case 'solNo':
      if(!ME.owner) return; try{ await S.db.doc('solicitudes/' + b.dataset.u).delete(); }catch(e){} delete S.sol[b.dataset.u]; stay(); toast('Solicitud rechazada'); break;
    case 'pdf':
      s = cur(); b.disabled = true; var ob = b.textContent; b.textContent = 'Preparando…';
      try{
        var buf = await chuletaPdf(s), fn = 'Chuleta_' + team(s.equipo).n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_') + '_' + s.fecha + '.pdf';
        window.__lastPdf = buf.slice(0);
        if(S.dl){ await S.dl.save({filename:fn, data:new Blob([buf], {type:'application/pdf'})}); toast('Chuleta descargada'); }
        else toast('La descarga solo funciona en la plataforma publicada.');
      }catch(e){ if(!(e && e.code === 'declined')) toast(e && e.message === 'jspdf' ? 'No se ha podido cargar el generador de PDF. Revisa la conexión.' : 'No se ha podido generar la chuleta.'); }
      b.disabled = false; b.textContent = ob; break;
    case 'fe': S.view.fe = b.dataset.e; stay(); break;
    case 'fs': S.view.fs = b.dataset.e; stay(); break;
    case 'fm': S.view.fm = b.dataset.e; stay(); break;
    case 'export':
      try{ await S.dl.save({filename:'sesiones-cimadevilla-'+today()+'.json', data:JSON.stringify({sesiones:Object.keys(S.sessions).map(function(id){ return Object.assign({id:id}, clean(S.sessions[id])); }), plantillas:TEAMS.reduce(function(o, t){ o[t.id] = plantilla(t.id); return o; }, {})}, null, 2)}); }
      catch(e){ if(!(e && e.code === 'declined')) toast('No se ha podido descargar.'); }
      break;
  }
});
app.addEventListener('change', async function(ev){
  var ag = ev.target.closest('[data-act="asigT"]');
  if(ag && ME.owner){
    var au = ag.dataset.u, at = ag.dataset.t;
    if(ag.checked) await darEquipo(au, at); else { S.asig[au] = (S.asig[au] || []).filter(function(x){ return x !== at; }); await saveAsig(); }
    stay(); toast(ag.checked ? 'Equipo asignado' : 'Acceso al equipo retirado'); return;
  }
  var t = ev.target;
  if(t.dataset && t.dataset.act === 'day'){
    var tid = t.dataset.t, d = +t.dataset.d, cur0 = teamDays(team(tid)).slice();
    if(t.checked){ if(cur0.indexOf(d) < 0) cur0.push(d); } else cur0 = cur0.filter(function(x){ return x !== d; });
    S.config[tid] = Object.assign({}, S.config[tid], {dias:cur0}); await saveConfig(); render();
  } else if(t.dataset && t.dataset.alt){
    var tm = team(t.dataset.t), al0 = teamAlt(tm), nv;
    if(t.dataset.alt === 'd') nv = t.value === '' ? null : {d: +t.value, ref: al0 ? addDays(monday(al0.ref), al0.par * 7) : S.week, par: 0};
    else nv = t.value ? {d: al0.d, ref: monday(t.value), par: 0} : al0;
    S.config[tm.id] = Object.assign({}, S.config[tm.id], {alt: nv}); await saveConfig(); render(); toast(nv ? 'Día alterno guardado' : 'Sin día alterno');
  } else if(t.dataset && t.dataset.asis){
    var sa = cur(); if(!sa) return; sa.asis = sa.asis || {};
    if(t.value) sa.asis[t.dataset.asis] = t.value; else delete sa.asis[t.dataset.asis];
    stay(); await persist(); toast(t.value ? 'Marcado como ausente' : 'Marcado como que asiste');
  } else if(t.dataset && t.dataset.obs){
    var so = cur(); if(so){ so.obs = t.value.trim(); await persist(); toast('Observaciones guardadas'); }
  } else if(t.dataset && t.dataset.vobs){
    var x = task(t.dataset.vobs); if(x){ x.valObs = t.value.trim(); await persist(); toast('Comentario guardado'); }
  } else if(t.id === 'addslot'){ S.view.addSlot = t.value; stay(); }
});

init();
})();
</script>
