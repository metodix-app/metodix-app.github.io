}
function abreProp(p){
  var ed = !p.path || p.estado === 'pendiente' || p.estado === 'rechazada';
  if(ME.owner && p.path) ed = false;
  var m = document.getElementById('propModal');
  if(!m){ m = document.createElement('div'); m.id = 'propModal'; document.body.appendChild(m); }
  function f(id, lab, val, area, ph){
    return '<div class="field"><label for="pf-' + id + '">' + lab + '</label>' + (area ? '<textarea id="pf-' + id + '"' + (ed ? '' : ' readonly') + ' placeholder="' + (ph || '') + '">' + esc(val || '') + '</textarea>' : '<input id="pf-' + id + '" value="' + esc(val || '') + '"' + (ed ? '' : ' readonly') + ' placeholder="' + (ph || '') + '">') + '</div>';
  }
  var et = p.etapas || [];
  m.innerHTML = '<div style="position:fixed;inset:0;background:rgba(14,27,61,.45);z-index:60;overflow:auto;padding:24px 12px"><div class="card" style="max-width:720px;margin:0 auto;display:grid;gap:10px">' +
    '<div class="row" style="justify-content:space-between"><b style="font:700 22px/1.1 var(--display)">' + (p.path ? esc(p.nombre || 'Ejercicio') : 'Nuevo ejercicio') + '</b><button type="button" class="btn ghost small" data-prop="cerrar">Cerrar</button></div>' +
    f('nombre', 'Nombre del ejercicio', p.nombre, false, 'Ej.: Rondo 4x2 con cambio de orientación') +
    '<div class="grid2" style="margin-top:0">' +
    '<div class="field"><label for="pf-equipo">Equipo con el que lo usas</label><select id="pf-equipo"' + (ed ? '' : ' disabled') + '>' + TEAMS.map(function(t){ return '<option value="' + t.id + '"' + (t.id === p.equipo ? ' selected' : '') + '>' + esc(t.n) + '</option>'; }).join('') + '</select></div>' +
    '<div class="field"><label for="pf-modalidad">Modalidad</label><select id="pf-modalidad"' + (ed ? '' : ' disabled') + '>' + ['Campo', 'Sala', 'Sala y campo'].map(function(o){ return '<option' + (o === p.modalidad ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>' +
    f('duracion', 'Duración (minutos)', p.duracion) + f('contenido', 'Fase del juego o contenido', p.contenido, false, 'Ej.: pase y movimiento, salida de balón…') + '</div>' +
    '<div class="field"><label>Etapas en las que sirve</label><div class="days">' + Object.keys(ETAPAS).map(function(e){ return '<label><input type="checkbox" class="pf-et" value="' + e + '"' + (et.indexOf(e) >= 0 ? ' checked' : '') + (ed ? '' : ' disabled') + '> ' + ETAPAS[e] + '</label>'; }).join('') + '</div></div>' +
    f('objetivo', 'Objetivo', p.objetivo, true) +
    '<div class="grid2" style="margin-top:0">' + f('espacio', 'Espacio', p.espacio, false, 'Ej.: 20 × 15 m') + f('jugadores', 'Jugadores', p.jugadores, false, 'Ej.: 4 contra 2') + '</div>' +
    f('material', 'Material', p.material) +
    f('desarrollo', 'Desarrollo (cómo funciona)', p.desarrollo, true) +
    f('consignas', 'Consignas para los jugadores', p.consignas, true) +
    f('variantes', 'Variantes o progresión', p.variantes, true) +
    '<div class="field"><label for="pf-foto">Foto o dibujo del diagrama (opcional)</label>' + (p.foto ? '<img src="' + p.foto + '" alt="Diagrama propuesto" style="max-width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:6px">' : '') + (ed ? '<input id="pf-foto" type="file" accept="image/*">' : '') + '</div>' +
    (ed ? '<button type="button" class="btn" data-prop="guardar" data-p="' + esc(p.path || '') + '">' + (p.path ? 'Guardar cambios' : 'Enviar a coordinación') + '</button>' : '') +
    (ME.owner && p.path && p.estado === 'pendiente' ? '<div class="field"><label for="pf-coment">Comentario para el entrenador (opcional)</label><input id="pf-coment"></div><div class="row"><button type="button" class="btn" data-prop="aprobar" data-p="' + esc(p.path) + '">Aprobar</button><button type="button" class="btn danger" data-prop="rechazar" data-p="' + esc(p.path) + '">Rechazar</button></div>' : '') +
    '</div></div>';
}
function cierraProp(){ var m = document.getElementById('propModal'); if(m) m.innerHTML = ''; }
function fotoReducida(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        var k = Math.min(1, 1000 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function propBy(path){ return S.props.find(function(p){ return p.path === path; }); }
async function guardaProp(path, data){ var d = Object.assign({}, data); delete d.path; await S.db.doc(path).set(d); }
document.addEventListener('click', async function(e){
  var b = e.target.closest('[data-prop]'); if(!b || !SB) return;
  var a = b.dataset.prop, p = b.dataset.p ? propBy(b.dataset.p) : null;
  try{
    if(a === 'nueva'){ abreProp({equipo: b.dataset.eq, modalidad: 'Campo', etapas: [], estado: 'pendiente'}); return; }
    if(a === 'ver' || a === 'editar'){ if(p) abreProp(p); return; }
    if(a === 'cerrar'){ cierraProp(); return; }
    b.disabled = true;
    if(a === 'guardar'){
      function v(id){ var el = document.getElementById('pf-' + id); return el ? el.value.trim() : ''; }
      if(!v('nombre')){ toast('Ponle un nombre al ejercicio.'); b.disabled = false; return; }
      var prev = b.dataset.p ? propBy(b.dataset.p) : null;
      var d = {nombre: v('nombre'), equipo: v('equipo'), modalidad: v('modalidad'), duracion: v('duracion'), contenido: v('contenido'),
        etapas: Array.from(document.querySelectorAll('.pf-et:checked')).map(function(x){ return x.value; }),
        objetivo: v('objetivo'), espacio: v('espacio'), jugadores: v('jugadores'), material: v('material'),
        desarrollo: v('desarrollo'), consignas: v('consignas'), variantes: v('variantes'),
        foto: prev ? prev.foto || '' : '', estado: 'pendiente', comentario: '',
        autor: ME.uid, autorNombre: (CUENTA && CUENTA.nombre) || '', t: Date.now()};
      var fi = document.getElementById('pf-foto');
      if(fi && fi.files && fi.files[0]) d.foto = await fotoReducida(fi.files[0]);
      var path = b.dataset.p || ('cuentas/' + ME.uid + '/propuestas/p' + Date.now().toString(36));
      await guardaProp(path, d);
      cierraProp(); toast(ME.owner ? 'Ejercicio guardado' : 'Enviado a coordinación'); await cargaProps();
    } else if((a === 'aprobar' || a === 'rechazar') && p && ME.owner){
      var c = document.getElementById('pf-coment');
      p.estado = a === 'aprobar' ? 'aprobada' : 'rechazada'; p.comentario = c ? c.value.trim() : (p.comentario || '');
      await guardaProp(p.path, p); cierraProp(); toast(a === 'aprobar' ? 'Aprobado' : 'Rechazado'); await cargaProps();
    } else if(a === 'anadida' && p && ME.owner){
      p.estado = 'anadida'; await guardaProp(p.path, p); await cargaProps();
    } else if(a === 'copiar' && ME.owner){
      var apr = S.props.filter(function(x){ return x.estado === 'aprobada'; });
      var txt = 'Claude, añade estos ejercicios aprobados al banco de Metodix (formato de la plataforma, con su diagrama):\n\n' + apr.map(textoProp).join('\n\n');
      await navigator.clipboard.writeText(txt);
      for(var i = 0; i < apr.length; i++){ apr[i].estado = 'enviada'; await guardaProp(apr[i].path, apr[i]); }
      toast('Copiados ' + apr.length + '. Pégalos en el chat con Claude.'); await cargaProps();
    }
  }catch(err){ toast('No se ha podido completar: ' + ((err && err.message) || '')); }
  b.disabled = false;
});

async function init(){
  var db = null, u = null;
  if(window.claude && typeof window.claude.use === 'function'){
    temaClub('#0E1B3D', '#C9A227');
    try{
      var r = await Promise.all([window.claude.use('db'), window.claude.use('downloads'), window.claude.use('user')]);
      db = r[0]; S.dl = r[1]; u = r[2]; S.user = u;
      if(u){
        try{ ME.owner = !!(await u.isOwner()); }catch(e){}
        try{ ME.uid = await u.id(); }catch(e){}
        try{ if((await u.can('data.write')) === false) S.readOnly = true; }catch(e){}
      }
    }catch(e){}
  }
  else {
    var x = await sbInit(); if(!x) return;
    db = x.db; S.dl = x.dl; u = x.u; S.user = u;
    ME.owner = !!(await u.isOwner()); ME.uid = await u.id();
    if(ME.owner) setTimeout(cargaInv, 2500);
    setTimeout(cargaProps, 1800);
  }
  if(!db){ ME.owner = true; loadLocal(); S.ready = true; ajustaTodas(); render(); return; }
  S.db = db;
  var timer = setTimeout(function(){ if(!S.ready){ S.ready = true; render(); } }, 10000);
  var got = {ses:false, asig:false};
  function ready(k){ got[k] = true; if(!S.ready && got.ses && got.asig){ S.ready = true; clearTimeout(timer); if(S.role && !roleOk(S.role)) S.role = null; if(!S.role && !ME.owner && ME.teams.length === 1) S.role = ME.teams[0]; render(); } else if(S.ready) softRender(); }
  function watchSes(p){
    if(SUBS[p]) return;
    SUBS[p] = db.collection(p).onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ m[d.id] = Object.assign({}, d.data(), {id:d.id}); });
      S.sesBy[p] = m; mergeSessions(); ready('ses'); setTimeout(ajustaTodas, 600);
    }, function(){ ready('ses'); });
  }
  function watchPlant(uid){
    var p = 'cuentas/' + uid + '/plantillas';
    if(SUBS[p]) return;
    SUBS[p] = db.collection(p).onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ m[d.id] = d.data(); }); S.pCoach[uid] = m; recomputePlant(); if(S.ready) softRender();
    }, function(){});
  }
  db.doc('config/equipos').onSnapshot(function(snap){ S.config = snap.exists ? (snap.data() || {}) : {}; if(S.ready) softRender(); }, function(){});
  db.doc('config/asignaciones').onSnapshot(function(snap){
    var d = snap.exists ? (snap.data() || {}) : {}; S.asig = d.entrenadores || {};
    ME.teams = ME.uid ? (S.asig[ME.uid] || []) : [];
    if(ME.owner){ Object.keys(S.asig).forEach(function(c){ watchSes(sesCol(c)); watchPlant(c); evWatch('cuentas/' + c + '/evaluaciones'); }); askNames(Object.keys(S.asig)); }
    else if(S.ready && S.role && !roleOk(S.role)) S.role = null;
    if(!ME.owner && S.ready && !S.role && ME.teams.length === 1) S.role = ME.teams[0];
    mergeSessions(); ready('asig');
  }, function(){ ready('asig'); });
  if(ME.owner){
    watchSes('sesiones'); evWatch('privado/evaluaciones');
    db.doc('privado/plantillas').onSnapshot(function(snap){ S.pMaster = snap.exists ? (snap.data() || {}) : {}; recomputePlant(); if(S.ready) softRender(); }, function(){});
    db.collection('solicitudes').onSnapshot(function(snap){ var m = {}; snap.docs.forEach(function(d){ m[d.id] = d.data(); }); S.sol = m; askNames(Object.keys(m)); if(S.ready) softRender(); }, function(){});
  } else if(ME.uid){
    watchSes(sesCol(ME.uid)); watchPlant(ME.uid); evWatch('cuentas/' + ME.uid + '/evaluaciones');
    db.doc('solicitudes/' + ME.uid).onSnapshot(function(snap){ ME.solMine = snap.exists ? snap.data() : null; if(S.ready) softRender(); }, function(){});
  } else { got.ses = true; }
}
var SUBS = {};
async function askNames(ids){
  if(!S.user || !S.user.profiles) return;
  ids = ids.filter(function(i){ return !(i in S.names); }); if(!ids.length) return;
  try{ var ps = await S.user.profiles(ids) || {}; ids.forEach(function(i){ S.names[i] = (ps[i] && ps[i].name) || ''; }); if(S.ready) softRender(); }catch(e){}
}
function who(uid){ return S.names[uid] || 'Entrenador sin nombre (' + String(uid).slice(-5) + ')'; }


/* ================= EVALUACIÓN INDIVIDUAL (0 a 10) =================
   Ficha de cada jugador de la plantilla con notas de 0 a 10 por aspecto y «No aplica».
   Dónde se guarda:
     · el entrenador → cuentas/<su id>/evaluaciones/<id>   (solo él y coordinación)
     · coordinación  → privado/evaluaciones/<id> y una copia de solo lectura
                        en la cuenta de cada entrenador del equipo. */
var EV_AREAS = [
  {id:'tec',nombre:'Técnica',aspectos:[['tec_ctrl','Control orientado'],['tec_pc','Pase corto'],['tec_pl','Pase largo y cambio de orientación'],['tec_cond','Conducción'],['tec_reg','Regate y 1 contra 1'],['tec_tiro','Tiro y finalización'],['tec_lat','Pierna no dominante y juego hacia los dos lados']]},
  {id:'cb',nombre:'Con balón',aspectos:[['cb_perfil','Perfil y orientación al recibir'],['cb_mira','Mira antes de recibir'],['cb_dec','Toma de decisiones'],['cb_desm','Desmarque y apoyos'],['cb_3h','Pared y tercer hombre'],['cb_esp','Amplitud y profundidad']]},
  {id:'sb',nombre:'Sin balón',aspectos:[['sb_ptp','Presión tras pérdida'],['sb_repl','Repliegue y posicionamiento defensivo'],['sb_marc','Marcaje y anticipación'],['sb_1x1','Duelo defensivo 1 contra 1']]},
  {id:'fis',nombre:'Física',aspectos:[['fis_vel','Velocidad y aceleración'],['fis_res','Resistencia'],['fis_coord','Coordinación y agilidad'],['fis_fza','Fuerza y salto (desde Infantil)']]},
  {id:'psi',nombre:'Psicológica',aspectos:[['psi_conc','Concentración'],['psi_conf','Confianza y gestión del error'],['psi_comp','Competitividad e intensidad']]},
  {id:'soc',nombre:'Social',aspectos:[['soc_act','Actitud y compromiso'],['soc_comp','Compañerismo y comunicación'],['soc_resp','Respeto']]},
  {id:'por',nombre:'Portero',gk:1,aspectos:[['por_bloc','Blocaje y desvío'],['por_sal','Salidas y 1 contra 1'],['por_pie','Juego con el pie y saque'],['por_col','Colocación']]}
];
function evAreasFor(j){ return EV_AREAS.filter(function(a){ return !a.gk || (j && j.pt); }); }
S.evBy = {}; S.evSrc = {};
function evMean(a){ var v = a.filter(function(x){ return typeof x === 'number'; }); return v.length ? v.reduce(function(s,x){ return s+x; },0)/v.length : null; }
function evAreas(ev, j){ return EV_AREAS.map(function(a){ return ev && (!a.gk || !j || j.pt) ? evMean(a.aspectos.map(function(x){ return ev.notas ? ev.notas[x[0]] : null; })) : null; }); }
function evOverall(ev, j){ return evMean(evAreas(ev, j)); }
function evPick(vals, j){ return EV_AREAS.map(function(a,i){ return (!a.gk || (j && j.pt)) ? vals[i] : undefined; }).filter(function(v){ return v !== undefined; }); }
function evFmt(n){ return n == null ? '–' : (Math.round(n*10)/10).toFixed(1).replace('.',','); }
function evLabel(v){ return v === 'na' ? 'N/A' : (typeof v === 'number' ? v : '–'); }
function evFecha(s){ if(!s) return 'Sin fecha'; var m = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], p = s.split('-'); return p.length === 3 ? (+p[2]) + ' ' + m[(+p[1])-1] + ' ' + p[0] : s; }
function evMerge(){
  var all = {}, src = {};
  Object.keys(S.evBy).forEach(function(p){
    var m = S.evBy[p] || {};
    Object.keys(m).forEach(function(id){
      var e = m[id], o = all[id];
      if(!o || (o.copia && !e.copia) || (!!o.copia === !!e.copia && (e.act || 0) > (o.act || 0))){ all[id] = e; src[id] = p; }
    });
  });
  S.evals = all; S.evSrc = src;
}
function evalsOf(tid, jid){
  return Object.keys(S.evals || {}).map(function(k){ return S.evals[k]; }).filter(function(e){ return e.t === tid && e.j === jid; })
    .sort(function(a,b){ return String(b.fecha||'').localeCompare(String(a.fecha||'')) || ((b.creado||0) - (a.creado||0)); });
}
function evWatch(p){
  if(!S.db || SUBS[p]) return;
  SUBS[p] = S.db.collection(p).onSnapshot(function(snap){
    var m = {}; snap.docs.forEach(function(d){ m[d.id] = Object.assign({}, d.data(), {id:d.id}); });
    S.evBy[p] = m; evMerge(); if(S.ready && S.view.name !== 'evaluar') softRender();
  }, function(){});
}
function evCanEdit(e){
  if(S.readOnly) return false;
  if(!e) return true;
  if(ME.owner) return true;
  return !e.copia && S.evSrc[e.id] === 'cuentas/' + ME.uid + '/evaluaciones';
}
async function evSave(e){
  e = JSON.parse(JSON.stringify(e)); e.act = Date.now(); delete e.copia;
  if(!S.db){ (S.evBy.local = S.evBy.local || {})[e.id] = e; evMerge(); saveLocal(); return; }
  var src = S.evSrc[e.id], path;
  if(src && src.indexOf('cuentas/') === 0 && ME.owner && !(S.evals[e.id] || {}).copia) path = src;
  else path = ME.owner ? 'privado/evaluaciones' : 'cuentas/' + ME.uid + '/evaluaciones';
  await S.db.collection(path).doc(e.id).set(e);
  (S.evBy[path] = S.evBy[path] || {})[e.id] = e;
  if(ME.owner && path === 'privado/evaluaciones'){
    var cs = coachesOf(e.t), cp = Object.assign({}, e, {copia:1});
    for(var i = 0; i < cs.length; i++){ var pc = 'cuentas/' + cs[i] + '/evaluaciones'; await S.db.collection(pc).doc(e.id).set(cp); (S.evBy[pc] = S.evBy[pc] || {})[e.id] = cp; }
  }

}
async function evDelete(id){
  if(!S.db){ if(S.evBy.local) delete S.evBy.local[id]; evMerge(); saveLocal(); return; }
  var paths = Object.keys(S.evBy).filter(function(p){ return S.evBy[p] && S.evBy[p][id]; });
  if(!ME.owner) paths = paths.filter(function(p){ return p === 'cuentas/' + ME.uid + '/evaluaciones'; });
  for(var i = 0; i < paths.length; i++){ await S.db.collection(paths[i]).doc(id).delete(); delete S.evBy[paths[i]][id]; }
  evMerge();
}
function evRadar(vals, prev, areas){
  areas = areas || EV_AREAS;
  var n = vals.length, cx = 180, cy = 140, R = 96, out = '';
  function pt(i, v){ var a = -Math.PI/2 + i*2*Math.PI/n, r = R*(v||0)/10; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
  function poly(vs){ return vs.map(function(v,i){ var p = pt(i, v); return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' '); }
  [2,4,6,8,10].forEach(function(k){ out += '<polygon points="'+poly(vals.map(function(){ return k; }))+'" fill="none" stroke="rgba(14,27,61,'+(k===10?.45:.18)+')" stroke-width="1"/>'; });
  vals.forEach(function(_,i){ var p = pt(i,10); out += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="rgba(14,27,61,.18)"/>'; });
  if(prev && prev.some(function(v){ return v != null; })) out += '<polygon points="'+poly(prev)+'" fill="none" stroke="var(--navy)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  out += '<polygon points="'+poly(vals)+'" fill="var(--gold)" fill-opacity=".55" stroke="var(--gold-deep)" stroke-width="2.5" stroke-linejoin="round"/>';
  vals.forEach(function(v,i){
    if(v != null){ var p = pt(i,v); out += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="var(--gold-deep)"/>'; }
    var a = -Math.PI/2 + i*2*Math.PI/n, c = Math.cos(a), s = Math.sin(a);
    var lx = cx + (R+14)*c, ly = cy + (R+14)*s + (s < -0.5 ? -14 : s > 0.5 ? 14 : -2);
    var anchor = c > 0.3 ? 'start' : c < -0.3 ? 'end' : 'middle';
    out += '<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anchor+'" font-size="13" font-weight="600" fill="var(--muted)">'+esc(areas[i].nombre)+'</text>';
    out += '<text x="'+lx.toFixed(1)+'" y="'+(ly+16).toFixed(1)+'" text-anchor="'+anchor+'" font-size="16" font-weight="700" fill="var(--ink)">'+evFmt(v)+'</text>';
  });
  return '<svg class="radar" viewBox="0 0 360 290" role="img" aria-label="Perfil por áreas: '+esc(areas.map(function(a,i){ return a.nombre+' '+evFmt(vals[i]); }).join(', '))+'">'+out+'</svg>';
}
function evBars(vals){ return '<span class="pbars" aria-hidden="true">'+vals.map(function(v){ return v == null ? '<i class="nil"></i>' : '<i style="height:'+Math.max(2, Math.round(v*3))+'px"></i>'; }).join('')+'</span>'; }

/* Pegar la plantilla de una vez */
function evParseLista(txt){
  var out = [];
  String(txt || '').split(/\r?\n/).forEach(function(l){
    l = l.replace(/^\s*[-•*·]\s*/, '').trim(); if(!l) return; if(/^=|====|plantillas para pegar|copia el bloque/i.test(l) || l.length > 70) return;
    var pt = /\b(portero|portera|guardameta|POR)\b|\((P|POR)\)/i.test(l);
    l = l.replace(/[,;(\-–]*\s*\b(portero|portera|guardameta)\b\s*\)?/ig, ' ').replace(/\((P|POR)\)/ig, ' ');
    var m = l.match(/^\s*(\d{1,2})\s*[.)\-–:\t ]\s*(.+)$/), d = '', n = l;
    if(m){ d = m[1]; n = m[2]; }
    else { var m2 = l.match(/^(.+?)[\t ,;]+(\d{1,2})\s*$/); if(m2){ n = m2[1]; d = m2[2]; } }
    n = n.replace(/[\t,;]+/g, ' ').replace(/\s+/g, ' ').trim();
    if(n.length < 2 || /^(dorsal|nombre|jugador)/i.test(n)) return;
    out.push({n:n, d:d, pt:pt});
  });
  return out;
}
function evNorm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }

    '<p class="note">Los que ya estén en la plantilla (mismo nombre) se actualizan; los nuevos se añaden. No se quita a nadie.</p>' +
    '<button type="button" class="btn small" data-ev="pegar" data-t="' + t.id + '">Añadir a la plantilla</button></details>';
}

app.addEventListener('click', async function(ev){
  var b = ev.target.closest('[data-ev]'); if(!b) return;
  var k = b.dataset.ev, v = S.view;
  if(k === 'ver'){ go({name:'evjug', t:b.dataset.t, j:b.dataset.j}); }
  else if(k === 'tabla'){ go({name:'evtabla', t:b.dataset.t}); }
  else if(k === 'volver' || k === 'volverHome'){ go({name:'home'}); }
  else if(k === 'pick'){ v.evId = b.dataset.id; stay(); }
  else if(k === 'nueva' || k === 'editar'){
    var base, d;
    if(k === 'editar'){ base = S.evals[b.dataset.id]; d = JSON.parse(JSON.stringify(base)); delete d.copia; }
    else {
      base = evalsOf(v.t, v.j)[0];
      d = {id:'ev-' + uid(), t:v.t, j:v.j, fecha:today(), notas:base ? JSON.parse(JSON.stringify(base.notas || {})) : {}, fortalezas:'', mejorar:'', objetivo:'', creado:Date.now(), prefill:!!base};
    }
    S.evBack = {t:v.t, j:v.j}; go({name:'evaluar', d:d});
  }
  else if(k === 'cancelar'){ go({name:'evjug', t:S.evBack.t, j:S.evBack.j}); }
  else if(k === 'nota'){ v.d.notas[b.dataset.asp] = +b.dataset.n; evPaintRow(b.dataset.asp); }
  else if(k === 'na'){ var a = b.dataset.asp; if(v.d.notas[a] === 'na') delete v.d.notas[a]; else v.d.notas[a] = 'na'; evPaintRow(a); }
  else if(k === 'guardar'){
    var e = Object.assign({}, v.d); delete e.prefill;
    if(!e.fecha){ toast('Pon la fecha de la evaluación.'); return; }
    e.autor = e.autor || ME.uid || ''; e.autorN = e.autorN || (ME.owner ? 'Coordinación' : ((typeof CUENTA !== 'undefined' && CUENTA && CUENTA.nombre) || S.names[ME.uid] || ''));
    S.evBusy = true; stay();
    try{ await evSave(e); S.evBusy = false; toast('Evaluación guardada'); go({name:'evjug', t:e.t, j:e.j, evId:e.id}); }
    catch(err){ S.evBusy = false; stay(); toast(err && err.code === 'invalid_argument' ? 'Tu acceso es de solo lectura: no se ha guardado.' : 'No se ha podido guardar. Comprueba la conexión.'); }
  }
  else if(k === 'borrar'){
    var id = b.dataset.id;
    if(S.evConfirm !== id){ S.evConfirm = id; stay(); return; }
    S.evConfirm = null;
    try{ await evDelete(id); if(v.evId === id) v.evId = null; stay(); toast('Evaluación eliminada'); }catch(err){ toast('No se ha podido eliminar.'); }
  }
  else if(k === 'pegar'){
    var tid = b.dataset.t, ta = document.getElementById('pl-' + tid), lista = evParseLista(ta && ta.value);
    if(!lista.length){ toast('No he encontrado jugadores en el texto.'); return; }
    var nuevos = 0, cambiados = 0;
    editRoster(tid, function(l){
      lista.forEach(function(x){
        var o = l.filter(function(j){ return evNorm(j.n) === evNorm(x.n); })[0];
        if(o){ if(x.d && o.d !== x.d){ o.d = x.d; cambiados++; } if(x.pt && !o.pt){ o.pt = true; cambiados++; } }
        else { l.push({id:'j-' + tid + '-' + uid(), n:x.n, d:x.d, pt:x.pt}); nuevos++; }
      });
      return l;
    });
    S.keepD = S.keepD || {}; S.keepD['pp-' + tid] = false; S.keepD['pl-' + tid] = true;
    stay(); await saveRoster();
    toast((nuevos === 1 ? '1 jugador añadido' : nuevos + ' jugadores añadidos') + (cambiados ? ' y ' + (cambiados === 1 ? '1 dato actualizado' : cambiados + ' datos actualizados') : ''));
  }
});

  return '<div class="weeknav"><button type="button" class="btn ghost small" data-act="wk" data-d="-7" aria-label="Semana anterior">‹ Anterior</button><b>Semana del '+fdate(S.week,'short')+' al '+fdate(end,'short')+'</b><button type="button" class="btn ghost small" data-act="wk" data-d="7" aria-label="Semana siguiente">Siguiente ›</button></div>';
}
function vHome(){
  var h = band() + '<main class="inner">';

  if(!S.role){
    h += ME.owner ? '<div class="empty"><strong>¿Qué quieres ver?</strong>Elige arriba un equipo, o Coordinación para ver todos los equipos y dar acceso a los entrenadores.</div>'
      : '<div class="empty"><strong>Elige tu equipo</strong>Pulsa arriba en tu equipo para ver los borradores de tus sesiones.</div>';
    h += '<p class="note">Esta plataforma es privada del club. Lee de gestionaclub solo lo necesario y no escribe nada en ella.</p>';
    return h + '</main>';
  }
  if(S.role === 'coord') return h + vCoord() + '</main>';
  var t = team(S.role);
  h += weekNav();
  var days = teamDays(t), list = weekDates(t.id, S.week);

    h += '<div class="empty"><strong>Faltan los días de entrenamiento</strong>Este equipo todavía no tiene días configurados. Coordinación puede añadirlos, o crea una sesión para un día concreto.</div>';
  }

    h += '<ul class="list">' + list.map(function(f){
      var s = sessionFor(t.id, f), m = MESOS.find(function(x){ return x.id === s.meso; });

        '<span><span class="iname">'+esc(DOW[pdate(f).getDay()])+' · '+esc(TIPOS[s.tipo||'media'])+' · '+esc(PR[s.pr])+'</span><span class="isub">Mesociclo '+esc(s.meso)+(s.paron ? ' (parón: se mantiene el último principio)' : '')+' · '+s.tareas.length+' ejercicios · '+s.tareas.reduce(function(a,x){ return a + (+x.dur||0); },0)+' min</span><span class="tags">'+statusPills(s)+'</span></span><span aria-hidden="true">›</span></button></li>';
    }).join('') + '</ul>';

    } else {

      '<div class="field"><label for="e-p">Progresión (una línea por serie)</label><textarea id="e-p" rows="3">'+esc((progresion(x, s) || []).map(function(t){ return t.txt; }).join('\n'))+'</textarea></div>' +

  } else {

    if(editable){
      h += '<div class="tactions">' + (x.dec !== 'ok' ? '<button type="button" class="btn small" data-act="accept" data-k="'+x.k+'">Aceptar</button>' : '') +

function fichaHtml(x){
  var f = x.fic || (BYID[x.bid] ? ficha(BYID[x.bid]) : null); if(!f) return '';

function altList(s, slot, current, act, k){
  var t = team(s.equipo);
  if(S.view.f11 && act === 'pickSwap'){
    var kidsW = S.view.f11 === 'kids', fl = BANK.filter(function(b){ return b.s === slot && b.id !== current && /FIFA 11\+/.test(b.src || '') && (/Kids/.test(b.src) === kidsW); });
    return '<p class="note">'+(kidsW ? 'Ejercicios del FIFA 11+ Kids' : 'Ejercicios del FIFA 11+')+' para esta parte de la sesión:</p>' + (fl.map(function(b){ return '<button type="button" class="alt" data-act="pickSwap" data-b="'+b.id+'" data-k="'+k+'">'+pic(b, true)+'<b>'+esc(b.n)+'</b><small>'+esc(b.src)+'</small></button>'; }).join('') || '<p class="note">No hay ejercicios de este programa para esta parte.</p>');
  }
  var list = (slot === 'p1' ? BANK.filter(function(b){ return (b.s === 'pri' || b.s === 'rue') && !tiro(b); })
    : slot === 'p2' ? BANK.filter(function(b){ return (b.s === 'pri' || b.s === 'act') && tiro(b); })
    : BANK.filter(function(b){ return b.s === slot && slotOk(slot, b); })).filter(function(b){ return b.id !== current && (!t.mod || b.mod === 'ambos' || b.mod === t.mod); });
  list.sort(function(a, b){
    var want = S.view.swapPr || s.prTarea;
    var sa = (a.e.indexOf(t.e) >= 0 ? 0 : 4) + (prOk(a, want) ? 0 : 1) + (t.mod === 'sala' && a.mod !== 'sala' ? 2 : 0);
    var sb = (b.e.indexOf(t.e) >= 0 ? 0 : 4) + (prOk(b, want) ? 0 : 1) + (t.mod === 'sala' && b.mod !== 'sala' ? 2 : 0);
    return sa - sb;
  });
  return list.map(function(b){
    return '<button type="button" class="alt" data-act="'+act+'" data-b="'+b.id+'"'+(k ? ' data-k="'+k+'"' : '')+'>'+pic(b, true)+'<b>'+esc(b.n)+'</b><small>'+MODS[b.mod]+' · '+b.e.map(function(e){ return ETAPAS[e]; }).join(', ')+(b.pr ? ' · '+esc(PR[b.pr]) : '')+'</small></button>';
  }).join('') || '<p class="note">No hay más ejercicios de este tipo en el banco.</p>';
}

async function saveAsig(){ try{ await S.db.doc('config/asignaciones').set({entrenadores:JSON.parse(JSON.stringify(S.asig)), t:Date.now()}); }catch(e){ toast('No se han podido guardar los accesos.'); } }
async function darEquipo(u, tid){
  var ts = (S.asig[u] || []).slice(); if(ts.indexOf(tid) < 0) ts.push(tid); S.asig[u] = ts; await saveAsig();
  try{
    var pl = plantilla(tid); if(pl.length) await S.db.doc('cuentas/' + u + '/plantillas/' + tid).set({l:JSON.parse(JSON.stringify(pl)), t:Date.now()});
    var ids = Object.keys(S.sessions).filter(function(id){ return S.sessions[id].equipo === tid; });
    for(var i = 0; i < ids.length; i++) await S.db.collection(sesCol(u)).doc(ids[i]).set(clean(S.sessions[ids[i]]));
  }catch(e){ toast('El acceso está dado, pero no se han podido copiar todas las sesiones.'); }
}
function vCoord(){
  var h = vAccesos() + vPropCoord() + weekNav(), end = addDays(S.week, 6), rows = [], low = [], high = [], pendientes = [];
  TEAMS.forEach(function(t){
    var list = weekDates(t.id, S.week), conf = 0, tiempo = 0, val = 0, valTot = 0;
    list.forEach(function(f){
      var s = sessionFor(t.id, f);
      if(s.estado === 'confirmada'){ conf++; var p = planState(s); if(p && p.k === 'ok') tiempo++; }
      else pendientes.push(s);
      if(s.estado === 'confirmada' && f <= today()) s.tareas.forEach(function(x){ valTot++; if(x.val) val++; });
    });
    rows.push('<tr><td><b>'+esc(t.n)+'</b></td><td class="n">'+list.length+'</td><td class="n">'+conf+'</td><td class="n">'+tiempo+'</td><td class="n">'+(valTot ? val+'/'+valTot : '–')+'</td><td>'+(list.length ? (conf === list.length ? '<span class="pill ok">Al día</span>' : '<span class="pill '+(list.some(function(f){ return f < today() && sessionFor(t.id,f).estado !== 'confirmada'; }) ? 'bad' : 'gold')+'">'+(list.length - conf)+' por confirmar</span>') : '<span class="pill">Sin días configurados</span>')+'</td></tr>');
  });
  Object.keys(S.sessions).forEach(function(id){ var s = S.sessions[id]; (s.tareas||[]).forEach(function(x){ if(x.val && x.val <= 2) low.push([s, x]); if(x.val >= 4) high.push([s, x]); }); });

  h += '<div class="scroll"><table><thead><tr><th>Equipo</th><th>Sesiones</th><th>Confirmadas</th><th>Con antelación</th><th>Valorados</th><th>Estado</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';
  if(pendientes.length) h += '<div class="section-h"><h2>Por confirmar</h2><span>'+pendientes.length+' sesiones</span></div><ul class="list">'+pendientes.map(function(s){ return '<li><button type="button" class="item" data-act="open" data-t="'+s.equipo+'" data-f="'+s.fecha+'"><span class="date">'+fdate(s.fecha,'day')+'<small>'+fdate(s.fecha,'mon')+'</small></span><span><span class="iname">'+esc(team(s.equipo).n)+' · '+esc(PR[s.pr])+'</span><span class="tags">'+statusPills(s)+'</span></span><span aria-hidden="true">›</span></button></li>'; }).join('')+'</ul>';
  h += '<div class="grid2"><div class="card"><h3 style="font:700 20px/1.1 var(--display);margin-bottom:6px">Ejercicios que no han funcionado (1-2)</h3>'+(low.length ? '<ul style="margin:0;padding-left:18px">'+low.slice(0,12).map(function(a){ return '<li>'+esc(a[1].nombre)+' · '+esc(team(a[0].equipo).n)+', '+fdate(a[0].fecha,'short')+(a[1].valObs ? ' — '+esc(a[1].valObs) : '')+'</li>'; }).join('')+'</ul>' : '<p class="note">Ninguno todavía.</p>')+'</div>' +
    '<div class="card"><h3 style="font:700 20px/1.1 var(--display);margin-bottom:6px">Ejercicios para el banco del club (4-5)</h3>'+(high.length ? '<ul style="margin:0;padding-left:18px">'+high.slice(0,12).map(function(a){ return '<li>'+esc(a[1].nombre)+' · '+esc(team(a[0].equipo).n)+' ('+a[1].val+'/5)</li>'; }).join('')+'</ul>' : '<p class="note">Ninguno todavía.</p>')+'</div></div>';
  h += '<div class="section-h"><h2>Días de entrenamiento</h2><span>Los borradores salen de estos días</span></div><div class="card" style="display:grid;gap:12px">';
  TEAMS.forEach(function(t){
    var d = teamDays(t);
    var altTxt = t.alt ? '<span class="note" style="margin:0">'+DOW[t.alt.d]+' alterno: '+(t.alt.par === 0 ? 'empieza el 20/11' : 'empieza el 27/11')+'</span>' : '';
    h += '<div class="row" style="justify-content:space-between"><b style="font:600 18px/1 var(--display);min-width:150px">'+esc(t.n)+altTxt.replace('<span','<br><span')+'</b><div class="days">'+[1,2,3,4,5,6,0].map(function(k){ return '<label><input type="checkbox" data-act="day" data-t="'+t.id+'" data-d="'+k+'"'+(d.indexOf(k) >= 0 ? ' checked' : '')+(S.readOnly ? ' disabled' : '')+'>'+DOW[k].slice(0,3)+'</label>'; }).join('')+'</div></div>';
  });
  h += '</div>';
  h += '<div class="section-h"><h2>Banco de ejercicios</h2><span>'+BANK.length+' ejercicios con diagrama</span></div>';
  var fe = S.view.fe || 'todas';
  h += '<div class="chips" role="group" aria-label="Filtrar por etapa">'+['todas','ini','des','per','ren'].map(function(e){ return '<button type="button" class="chip" data-act="fe" data-e="'+e+'" aria-pressed="'+(fe === e)+'">'+(e === 'todas' ? 'Todas' : ETAPAS[e])+'</button>'; }).join('')+'</div>';
  var fs = S.view.fs || 'todas', FS = {todas:'Todas las partes', act:'Calentamiento', p1:'Primera parte', p2:'Segunda parte', abp:'Balón parado', par:'Tercera parte', fis:'Preparación física', por:'Porteros', cal:'Vuelta a la calma'};
  var inFs = function(b){ return fs === 'todas' || (fs === 'p1' ? ((b.s === 'rue' || b.s === 'pri') && !tiro(b)) : fs === 'p2' ? ((b.s === 'pri' || b.s === 'act') && tiro(b)) : fs === 'act' ? (b.s === 'act' && !tiro(b)) : b.s === fs); };
  h += '<div class="chips" role="group" aria-label="Filtrar por parte de la sesión" style="margin-top:8px">'+Object.keys(FS).map(function(e){ return '<button type="button" class="chip" data-act="fs" data-e="'+e+'" aria-pressed="'+(fs === e)+'">'+FS[e]+'</button>'; }).join('')+'</div>';
  var fm = S.view.fm || 'todas', FM = {todas:'Sala y campo', sala:'Solo fútbol sala', campo:'Solo fútbol campo'};
  h += '<div class="chips" role="group" aria-label="Filtrar por modalidad" style="margin-top:8px">'+Object.keys(FM).map(function(e){ return '<button type="button" class="chip" data-act="fm" data-e="'+e+'" aria-pressed="'+(fm === e)+'">'+FM[e]+'</button>'; }).join('')+'</div>';
  var bl = BANK.filter(function(b){ return (fe === 'todas' || b.e.indexOf(fe) >= 0) && inFs(b) && (fm === 'todas' || b.mod === fm); });
  h += '<p class="note">'+bl.length+' ejercicios. '+DRIVE.length+' vienen de los dosieres de tareas del Drive del club y '+MF.length+' de las fichas MetodoFutbol de las carpetas de ejercicios y '+SALA.length+' son ejercicios específicos de fútbol sala (con las tareas de los manuales de entrenamiento de futsal de la UEFA y de la FIFA) y '+F11.length+' vienen de los programas FIFA 11+ y FIFA 11+ Kids. Cada ejercicio indica si es de sala, de campo o sirve para los dos.</p>';
  h += '<div class="bank">'+bl.map(function(b){ return '<div class="alt">'+pic(b, true)+'<b>'+esc(b.n)+'</b><small>'+MODS[b.mod]+' · '+esc(b.s === 'pri' ? 'Primera o segunda parte' : b.s === 'rue' ? 'Primera parte' : SLOTS[b.s])+(b.s === 'pri' ? (hasGoal(b) ? ' · con finalización' : ' · elementos') : '')+(b.pr ? ' · '+esc(PR[b.pr]) : '')+' · '+b.e.map(function(e){ return ETAPAS[e]; }).join(', ')+'</small></div>'; }).join('')+'</div>';
  if(S.dl && ME.owner) h += '<div class="row" style="margin-top:16px"><button type="button" class="btn ghost" data-act="export">Descargar todas las sesiones (para integrarlas en la app)</button></div>';
  return h;
}
function render(){
  if(S.acceso){ if(!document.getElementById('acceso')) app.innerHTML = vLogin(S.acceso, S.accesoMsg); return; }
  if(!S.ready){ app.innerHTML = '<p class="loading">Cargando…</p>'; return; }
  var y = window.scrollY;
  if(S.view.name === 'session'){
    var s = S.view.s; if(s && S.sessions[s.id] && S.sessions[s.id] !== s && !s.dirty && (S.sessions[s.id].actualizado || 0) > (s.actualizado || 0)) S.view.s = JSON.parse(JSON.stringify(S.sessions[s.id]));
    app.innerHTML = vSession();
  } else if(S.view.name === 'evjug') app.innerHTML = vEvJugador();
  else if(S.view.name === 'evaluar') app.innerHTML = vEvaluar();
  else if(S.view.name === 'evtabla') app.innerHTML = vEvTabla();
  else app.innerHTML = vHome();
  if(S.keepOpen){ var dd = document.querySelector('#t-' + S.keepOpen + ' .plan details'); if(dd) dd.open = true; S.keepOpen = null; }
  if(S.keepScroll){ window.scrollTo(0, y); S.keepScroll = false; }
}
function go(v){ S.view = v; render(); window.scrollTo(0,0); }
function stay(){ S.keepScroll = true; render(); }

/* ================= ACCIONES ================= */
function cur(){ return S.view.s; }
function task(k){ return cur().tareas.find(function(x){ return x.k === k; }); }
async function persist(){ var s = cur(); await saveSession(s); }
app.addEventListener('click', async function(ev){
  var b = ev.target.closest('[data-act]'); if(!b || b.disabled) return;
  var a = b.dataset.act, s, x;
  if(a === 'day') return;
  switch(a){
    case 'role': if(!roleOk(b.dataset.r)) return; S.role = b.dataset.r; try{ localStorage.setItem(LS + '-rol', S.role); }catch(e){} go({name:'home'}); break;
    case 'wk': S.week = addDays(S.week, +b.dataset.d); stay(); break;
    case 'home': go({name:'home'}); break;
    case 'open': if(!roleOk(b.dataset.t) && !ME.owner) return; s = JSON.parse(JSON.stringify(sessionFor(b.dataset.t, b.dataset.f))); var nch = normaliza(s); go({name:'session', s:s}); if(nch && !s.virtual) await persist(); break;
    case 'newDay':
      var f = document.getElementById('nd').value; if(!f){ toast('Elige una fecha.'); return; }
      s = sessionFor(b.dataset.t, f); go({name:'session', s:JSON.parse(JSON.stringify(s))}); break;
    case 'accept': x = task(b.dataset.k); x.dec = 'ok'; stay(); await persist(); break;
    case 'acceptAll': cur().tareas.forEach(function(t){ if(t.dec === 'pend') t.dec = 'ok'; }); stay(); await persist(); break;
    case 'f11': S.view.swap = b.dataset.k; S.view.f11 = b.dataset.v; S.view.edit = null; stay(); break;
    case 'swap': S.view.f11 = null; S.view.swap = S.view.swap === b.dataset.k ? null : b.dataset.k; S.view.swapPr = S.view.swap ? task(b.dataset.k).prin : null; S.view.edit = null; stay(); break;
    case 'tipo':
      s = cur(); if(s.estado === 'confirmada') return;
      var nd = makeDraft(s.equipo, s.fecha, b.dataset.v); nd.virtual = s.virtual; S.view.s = nd; S.view.swap = null; S.view.edit = null; stay(); if(!nd.virtual) await persist(); toast('Borrador rehecho como sesión '+TIPOS[b.dataset.v].toLowerCase()); break;
    case 'pickSwap':
      x = task(b.dataset.k); var nb = BYID[b.dataset.b], nt = fromBank(nb, x.slot, x.dur, cur().pr === 'jc' || cur().pr === 'co' ? cur().pr : cur().prTarea);
      S.view.f11 = null; nt.k = x.k; nt.dec = 'mod'; nt.prin = nb.pr || x.prin; cur().tareas[cur().tareas.indexOf(x)] = nt; S.view.swap = null; stay(); await persist(); toast('Ejercicio cambiado'); break;
    case 'edit': S.view.edit = b.dataset.k; S.view.swap = null; stay(); break;
    case 'cancelEdit': S.view.edit = null; stay(); break;
    case 'saveEdit':
      x = task(b.dataset.k);
      x.nombre = document.getElementById('e-n').value.trim() || x.nombre;
      x.dur = +document.getElementById('e-d').value || x.dur;
      x.obj = document.getElementById('e-o').value.trim(); x.org = document.getElementById('e-g').value.trim(); x.cons = document.getElementById('e-c').value.trim(); x.carga = document.getElementById('e-k').value.trim(); var ep = document.getElementById('e-p'); if(ep){ var pl = ep.value.split('\n').map(function(l){ return l.trim(); }).filter(Boolean); if(pl.join('|') !== (progresion(Object.assign({}, x, {prog:null}), cur()) || []).map(function(t){ return t.txt; }).join('|')) x.prog = pl; else delete x.prog; }
      x.dec = 'mod'; S.view.edit = null; stay(); await persist(); break;
    case 'remove': s = cur(); s.tareas = s.tareas.filter(function(t){ return t.k !== b.dataset.k; }); stay(); await persist(); toast('Ejercicio quitado'); break;
    case 'addTask': S.view.adding = !S.view.adding; S.view.addSlot = S.view.addSlot || 'p1'; stay(); break;
    case 'pickAdd':
      s = cur(); var asl = S.view.addSlot || 'p1', ab = BYID[b.dataset.b], nx = fromBank(ab, asl, asl === 'p1' || asl === 'p2' ? 15 : 10, s.pr === 'jc' || s.pr === 'co' ? s.pr : s.prTarea); nx.dec = 'ok';
      var order = Object.keys(SLOTS), pos = s.tareas.length;
      for(var i = 0; i < s.tareas.length; i++){ if(order.indexOf(s.tareas[i].slot) > order.indexOf(asl)){ pos = i; break; } }
      s.tareas.splice(pos, 0, nx); S.view.adding = false; stay(); await persist(); toast('Ejercicio añadido'); break;
    case 'confirm':
      s = cur(); s.estado = 'confirmada'; s.confirmado = Date.now(); stay(); await persist(); toast('Sesión confirmada'); break;
    case 'val': x = task(b.dataset.k); x.val = +b.dataset.v; var ta = document.getElementById('v-'+x.k); if(ta) x.valObs = ta.value.trim(); stay(); await persist(); toast('Valoración guardada'); break;
    case 'asisAll': s = cur(); s.asis = {}; stay(); await persist(); toast('Todos asisten'); break;
    case 'asis':
      s = cur(); s.asis = s.asis || {}; var jv = s.asis[b.dataset.j] || ''; var nv = jv ? '' : 'f';
      if(nv) s.asis[b.dataset.j] = nv; else delete s.asis[b.dataset.j]; stay(); await persist(); break;
    case 'addExtra':
      s = cur(); var exn = document.getElementById('exn').value.trim(); if(!exn){ toast('Escribe el nombre.'); return; }
      s.extra = (s.extra || []).concat([{id:'x-' + uid(), n:exn, d:'', pt:document.getElementById('exp').checked, extra:true}]); stay(); await persist(); toast('Jugador añadido a esta sesión'); break;
    case 'rmExtra': s = cur(); s.extra = (s.extra || []).filter(function(j){ return j.id !== b.dataset.j; }); stay(); await persist(); break;
    case 'mix': x = task(b.dataset.k); x.mix = (x.mix || 0) + 1; S.keepOpen = x.k; stay(); await persist(); break;
    case 'rAdd':
      var rn = document.getElementById('rn').value.trim(); if(!rn){ toast('Escribe el nombre.'); return; }
      var rtid = b.dataset.t, rd = document.getElementById('rd').value.trim(), rp = document.getElementById('rp').checked;
      editRoster(rtid, function(l){ l.push({id:'j-' + rtid + '-' + uid(), n:rn, d:rd, pt:rp}); return l; }); stay(); await saveRoster(); toast('Jugador añadido'); break;
    case 'rDel': editRoster(b.dataset.t, function(l){ return l.filter(function(j){ return j.id !== b.dataset.j; }); }); stay(); await saveRoster(); toast('Jugador quitado de la plantilla'); break;
    case 'rGk': editRoster(b.dataset.t, function(l){ l.forEach(function(j){ if(j.id === b.dataset.j) j.pt = !j.pt; }); return l; }); stay(); await saveRoster(); break;
    case 'solSend':
      var se = document.getElementById('solEq').value; if(!ME.uid || !se) return;
      try{ await S.db.doc('solicitudes/' + ME.uid).set({equipo:se, t:Date.now()}); toast('Solicitud enviada'); }catch(e){ toast('No se ha podido enviar. Pide a coordinación que te dé permiso de edición al compartir.'); }
      break;
    case 'solDel': try{ await S.db.doc('solicitudes/' + ME.uid).delete(); }catch(e){} break;
    case 'solOk':
      if(!ME.owner) return; var su = b.dataset.u, sq = S.sol[su]; if(!sq) return;
      await darEquipo(su, sq.equipo); try{ await S.db.doc('solicitudes/' + su).delete(); }catch(e){} delete S.sol[su]; stay(); toast('Acceso dado a ' + who(su)); break;
    case 'solNo':
      if(!ME.owner) return; try{ await S.db.doc('solicitudes/' + b.dataset.u).delete(); }catch(e){} delete S.sol[b.dataset.u]; stay(); toast('Solicitud rechazada'); break;
    case 'pdf':
      s = cur(); b.disabled = true; var ob = b.textContent; b.textContent = 'Preparando…';
      try{
        var buf = await chuletaPdf(s), fn = 'Chuleta_' + team(s.equipo).n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_') + '_' + s.fecha + '.pdf';
        window.__lastPdf = buf.slice(0);
        if(S.dl){ await S.dl.save({filename:fn, data:new Blob([buf], {type:'application/pdf'})}); toast('Chuleta descargada'); }
        else toast('La descarga solo funciona en la plataforma publicada.');
      }catch(e){ if(!(e && e.code === 'declined')) toast(e && e.message === 'jspdf' ? 'No se ha podido cargar el generador de PDF. Revisa la conexión.' : 'No se ha podido generar la chuleta.'); }
      b.disabled = false; b.textContent = ob; break;
    case 'fe': S.view.fe = b.dataset.e; stay(); break;
    case 'fs': S.view.fs = b.dataset.e; stay(); break;
    case 'fm': S.view.fm = b.dataset.e; stay(); break;
    case 'export':
      try{ await S.dl.save({filename:'sesiones-cimadevilla-'+today()+'.json', data:JSON.stringify({sesiones:Object.keys(S.sessions).map(function(id){ return Object.assign({id:id}, clean(S.sessions[id])); }), plantillas:TEAMS.reduce(function(o, t){ o[t.id] = plantilla(t.id); return o; }, {})}, null, 2)}); }
      catch(e){ if(!(e && e.code === 'declined')) toast('No se ha podido descargar.'); }
      break;
  }
});
app.addEventListener('change', async function(ev){
  var ag = ev.target.closest('[data-act="asigT"]');
  if(ag && ME.owner){
    var au = ag.dataset.u, at = ag.dataset.t;
    if(ag.checked) await darEquipo(au, at); else { S.asig[au] = (S.asig[au] || []).filter(function(x){ return x !== at; }); await saveAsig(); }
    stay(); toast(ag.checked ? 'Equipo asignado' : 'Acceso al equipo retirado'); return;
  }
  var t = ev.target;
  if(t.dataset && t.dataset.act === 'day'){
    var tid = t.dataset.t, d = +t.dataset.d, cur0 = teamDays(team(tid)).slice();
    if(t.checked){ if(cur0.indexOf(d) < 0) cur0.push(d); } else cur0 = cur0.filter(function(x){ return x !== d; });
    S.config[tid] = Object.assign({}, S.config[tid], {dias:cur0}); await saveConfig(); render();
  } else if(t.dataset && t.dataset.asis){
    var sa = cur(); if(!sa) return; sa.asis = sa.asis || {};
    if(t.value) sa.asis[t.dataset.asis] = t.value; else delete sa.asis[t.dataset.asis];
    stay(); await persist(); toast(t.value ? 'Marcado como ausente' : 'Marcado como que asiste');
  } else if(t.dataset && t.dataset.obs){
    var so = cur(); if(so){ so.obs = t.value.trim(); await persist(); toast('Observaciones guardadas'); }
  } else if(t.dataset && t.dataset.vobs){
    var x = task(t.dataset.vobs); if(x){ x.valObs = t.value.trim(); await persist(); toast('Comentario guardado'); }
  } else if(t.id === 'addslot'){ S.view.addSlot = t.value; stay(); }
});

init();
})();
</script>
